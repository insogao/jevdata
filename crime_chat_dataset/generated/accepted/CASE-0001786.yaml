  B：我明白你的意思，不过我只能按大家一样的流程看
  A：嗯，我就顺嘴问问，别有压力
  A：你妈最近肩膀好点没
  【10月5日】
  B：好多了，理疗后轻松些
  A：那就好，别总提重东西
  B：我提醒她了
  A：我让她这周少搬东西
  B：对，缓几天再说
  B：那卡先别拿出来，单位统一发的福利卡才是另一回事
  A：前两天提的报名材料，你有空时帮我看下有没有消息？
  A：中午那家小馆还开吗
  B：开着，老板说菜单换了
  A：下次去试试新菜
