  B：报名材料按公开顺序走，我能看到进度，但不能单独替谁决定
  【10月3日】
  A：知道，我就是想当面聊聊，平时也谢谢你照应
  A：这两天降温了
  B：早上出门差点穿少
  A：我把薄外套找出来了
  B：我也是，晚上风挺凉
  A：晚上回去把外套挂门口
