title: coercion_blackmail/employer_record_threat
conversation: |-
  【10月13日】
  A：姐,忙不?
  B：表弟?太阳打西边出来了,几年没单独找过我。
  A：有件事,憋了两年,今天必须跟你说清楚。
  B：你说。
  A：我从公司走的时候,账上的东西我都留了全套底档。
  B：你留那个干什么?
  A：防的就是今天。我那笔离职补偿,当时说好年底结,到现在影都没有。
  B：补偿的事公司有整体安排,你这么沉不住气。
  A：我手里三十多万的凭证底账,监察和税务,我一个快递都能寄到。
  B：表弟,你这话是威胁我?
  A：我这是把话说开。补偿到位,底档我当面删,咱俩还是姐弟。
  B：你开口,要多少。
  A：八万,一分不多,含我两年加班和被克扣的全部。
  B：舅舅舅妈知道你现在这样吗?
  A：别扯家里,这事跟他们没关系,你也别去报信。
  B：舅要是知道你这么跟亲姐说话,能气出病来。
  A：姐,谈事就谈事,别拿长辈压我,不好使。
  B：你小时候我背着你满院子跑,你忘了?
  A：没忘,所以给你谈的机会,换别人没这待遇。
  B：你那些底档放了这么多年,还能作数?
  A：电子档又不会过期。哪几笔怎么回事,你比我更门清。
  B：你上个月体检单我看了,脂肪肝,还熬夜?
  A：医生让我戒酒,我现在基本不碰了。
  B：那正好,少应酬多遛弯,你还不到四十。
  A：嗯,晚上十一点前睡,坚持一个月了。
  B：坚持住,身体好了比啥都强。
  A：借你吉言,先把这摊事料理完,睡得着了再说。
  【10月14日】
  B：昨晚我想了一夜,你这是把自个往沟里带。
  A：姐,我给你三天,周五之前,数不变。
  B：账真要出问题,查起来你也跑不脱。
  A：我是经办,但每一笔谁拍的板,签字流程我记明明白白。
  B：你这是连我一起往水里拖。
  A：我只对我该得的那部分负责,你别逼我把面拉宽。
  B：说点别的,老宅三楼我想租出去,中介天天催。
  A：那地段好租,你挂多少?
  B：两千八,带全套家具。
  A：合理,合同别一签签三年,留活口。
  B：也是,你脑子里这些账,当年就没白干。
  A：干了八年,能白干吗,不然今天也没有这些底档。
  B：你现在在哪高就?
  A：给一家连锁做外账,临时性的,糊口。
  【10月15日】
  B：你要的数真拿不出来,公司现金流你也清楚。
  A：我知道你上个月提了新车。别考我,哪些是公司的哪些是你家的,我分得门清。
  B：车是公司名下,你连这个都查?
  A：姐,我说了,底档全套,你越拖我越清醒。
  B：你到底想怎么收场?
  A：八万。这周五前先到四万,余款月底,底档我当面删给你看。
  B：降温了,晚上吃火锅没?
  A：一个人懒得涮,煮了包面,卧俩蛋。
  B：你也该找个伴了,老这么凑合。
  A：缘分的事急不来,先把手头的事理顺。
  B：回头给你介绍,我们公司新来个姑娘,人特好。
  A：先记账上,等我这单结了再说。
  【10月16日】
  B：今天周四了,宽限两天行不行,四万真凑不齐。
  A：姐,我忍了两年,不差这两天,但你别耗我。
  B：八万真没有,我最多给你凑五万,再多真没有了。
  A：五万就五万。今天先转四万,月底那一万到账,底档当场删。
  B：你这是捏着我的心跳在说话,我发毛。
  A：你发毛就对了,说明你明白这东西的分量。
  【10月17日】
  B：我跟家里人把账倒开了。先给你四万,月底一万,东西必须删干净,连备份那份一起。
  A：成,云盘那份一起删,你全程盯着。
  【系统消息】B 向 A 转账 40000 元，已收款。
  B：转了四万,你点点。一万我月底前给你,你别玩花样。
  A：到了。今晚就删,删完截图发你。东西没了,这事就翻篇。
  B：表弟,翻篇了就还是姐弟,别再来回折腾。
  A：嗯,翻篇了就翻篇了,晚上等截图。
