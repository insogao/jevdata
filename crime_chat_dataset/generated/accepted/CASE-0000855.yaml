  A：手上有一批以前的内部资料，想找人接。
  B：里面有员工联系方式和简历吗？
  A：整部门电话、简历按份卖，还有离职名单。
  B：这些都是个人信息，未经授权不能出售。
  A：有人愿意收，我可以分你一份。
  B：我不会买、转发或介绍买家。
  A：那我先留着。
  B：请停止传播，按公司流程交回或删除。
  【7月8日】
  A：地铁口开始施工
  B：我绕了点路
  A：公交也可以到
  B：明天我试试
  A：留意站点变化
  A：我记下了，有空再聊。
  B：好，不着急。
  A：上次拼饭的一百二我转给你了。
  【系统消息】A 向 B 转账 120 元，已收款。
  B：收到了，正好是午饭钱。
  【7月10日】
  A：对方又来问那批资料。
  B：不要发给任何人。
  A：他说只看一部分就行。
  B：一部分也不行，别发送员工信息。
  A：好，我拒绝他。
  B：资料来自单位就交给人事或隐私负责人。
  【7月11日】
  A：你妈最近在学做饭吗
  B：她在学烤饼
  A：成功了吗
  B：第一次有点焦
  A：多练几次就好
  A：我记下了，有空再聊。
  B：好，不着急。
  A：我已经把文件交回去了。
  B：谢谢，记得不要保留副本。
  A：我也跟对方说不再联系。
  B：好，个人资料只能在授权范围内使用。
  A：知道了。
  B：招聘可以走公开渠道。
