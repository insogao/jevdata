  B：你好，记得的。你最近怎么样。
  A：明晚方便吗？我来定地方，离单位不远。
  B：明晚可以，别订太正式的地方。
  A：好，就附近那家家常菜馆。顺便带一点节日小心意。
  B：吃饭可以，东西真不用特意准备。
  A：你最近还坐地铁吗
  B：基本都坐 开车找位太费劲
  A：我这两天改骑车了
  B：路上注意点 早高峰车多
  A：就两站路 还挺方便
  B：嗯 下雨我就不骑了
  A：我现在会提前十分钟出门
  B：这样不容易慌
  A：还顺路买了早餐
  A：家里老人最近身体还好吧
  B：挺好的 就是老问我啥时回去
  A：节前路上票不好买
  B：我提前看了一下 还没放票
  A：放票那天记得设个提醒
  B：好的 我叫我弟也盯着
  A：我姐说能帮我一起看票
  B：有人一起弄省心
  A：我爸还说不用着急
  【9月25日】
  A：最近肩膀还酸吗
  B：好多了 我换了个枕头
  A：我也是坐久了就僵
  B：每隔一会儿起来走走
  A：对 我现在设了个闹钟
  B：挺好 别硬扛
  A：我桌上放了个小水杯
  B：记得多起来活动
  A：刚刚站起来伸了会儿
  A：你上次说的那个保温杯买了吗
  B：买了 挺轻的 不漏水
  A：我还在挑颜色呢
  B：深色耐脏一点
  A：那我去店里看看实物
  B：行 线上图有时不准
  A：我准备周末带家里人一起去
  B：一起挑比较方便
  A：我到门口了，你慢慢来。
  B：刚出来，马上到。
  A：这个给你，一张小购物卡，过节图个方便。卡面金额我也没仔细看。
  B：你太客气了，心意我收下，下次别这么见外。
  B：今天聊得挺轻松的，回去路上注意。
  A：好呀，你也早点休息。
  A：前几天见面说的我那份场地申请，如果有动静麻烦跟我说一声，我好安排后面的事。
  B：材料都按顺序处理，有消息会照常通知。
