title: privacy_doxxing/exam_score_lookup
conversation: |-
  【12月3日】
  A：你好，想问一下最近那位同学的成绩是不是出来了？
  A：我把这周要处理的事项写在便签上了。
  B：我不能向无关的人提供学生信息。
  A：能不能让我看看那位同学的成绩？我只想确认一下。
  B：好，做完一项划掉一项。
  B：即使能看到，也只能按学校规定向监护人反馈。
  A：上午会议结束得比预想早。
  A：红包已发，你就截一张给我看就行。
  B：周末你打算在家还是出门？
  【12月4日】
  B：那正好留点时间喘口气。
  A：可能在家收拾书架，东西堆得太多。
  B：我也准备整理一下衣柜。
  A：刚才外面下了几分钟小雨。
  A：整理完会清爽很多。
  B：不行，我不会发别人的成绩截图。
  B：我看窗台都湿了，应该快停了。
  A：名字不用带出来，我大概知道是哪位。
  B：遮住名字也还是个人信息，不能这样处理。
  【12月5日】
  A：我打算把桌面文件夹重新分一下。
  A：我只是关心一下，不会告诉别人。
  B：请让家长通过学校的正式渠道了解。
  B：按日期分会比较好找。
  A：最近早餐都吃得很随便。
  B：可以前一晚准备点酸奶和水果。
  A：今天午饭吃得有点晚。
  A：这个主意不错，我明天试试。
  B：别光喝咖啡就出门。
  【12月6日】
  B：那下午别忘了喝点水。
  A：你帮我这一次就好，我不再问了。
  B：我不能帮忙查，也不会确认任何分数。
  A：楼下那家店换了招牌，我差点没认出来。
  A：那我自己去问家里人。
  B：这样更合适，请不要把红包转给我。
  B：我昨天也看到了，颜色挺亮。
  A：知道了，我把红包撤回来。
  A：这周天气忽冷忽热，你早上出门带外套了吗？
  【12月7日】
  B：带了，早晚风挺凉的。
  A：我晚点要去取个快递。
  A：我昨天没带，下午就后悔了。
  B：放一件在办公室吧，省得忘。
  B：驿站现在开到挺晚的。
  B：谢谢，后续有问题让监护人联系学校。
  A：我不会再问成绩的事。
  B：好的，保护学生隐私很重要。
  A：这周的日程比上周松一点。
  【12月8日】
  A：明白，刚才的话也别往群里发。
  B：我会按规定处理，不会扩散。
  B：正好把积着的小事清掉。
  A：我今天试了新开的面包店。
  B：好吃吗？
  A：还不错，下次可以买给家里人。
  B：嗯，少买点，别放久了。
  A：手机电量掉得比平时快。
  B：你是不是一直开着导航？
