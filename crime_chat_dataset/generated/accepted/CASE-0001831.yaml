conversation: |-
  【5月28日】
  A：介绍人，节前你哪天方便？节前碰面时顺便提一下
  B：这两天事情有点多，怎么突然想见面？
  A：今天路上堵不堵
  B：桥那边在修路，有点慢
  A：我绕小路走了
  B：明早我也早点出门
  A：我把导航收藏一下
  B：好，明早看路况再决定
  A：嗯，别到时候又迟到
  A：想问问那份手续的进展，也好提前安排一下。
  B：那份手续都按统一顺序处理，我只能看流程到哪一步。
  A：咱们认识的人也不少，就是想当面谢谢你平时照应。
  A：你上次说的鞋到了吗
  B：到了，码数刚好
  A：那不错，走路舒服不
  B：还行，先穿两天看看
  A：那先穿着试试，不磨脚就好
  B：对，走多了再看
  A：嗯，周末再告诉你
  B：吃饭可以，带东西就不用了。
  A：本来想带张卡给你，里面多少我也没看，就一点心意。
  A：周末要不要去逛书店
  B：可以啊，下午人少点
  A：那我把地址发你
  【5月29日】
  B：收到，顺便喝杯咖啡
  A：正好我也想买支笔
  B：那家文具区挺全的
  A：顺路看看吧，不急
  B：私人给的我不能留，单位统一发的福利卡才按公司规矩登记。
  A：那天说的那份，你有空时帮我看一眼就行。
  A：你家猫还挑食吗
  B：好多了，换了新粮
  A：别一下换太多吧
  B：嗯，我掺着旧的喂
  A：旧粮我还留了一点
  B：慢慢掺就好，别换太突然
  B：我不能因为认识或收礼就给谁调顺序，都是照同一套要求办。
  A：嗯，我知道，就是问问。
  B：卡就先别拿来了，等正常通知。
  A：这两天降温了
  B：早上出门差点穿少
  A：我把薄外套找出来了
  B：我也是，晚上风挺凉
  A：晚上回去把外套挂门口
  B：挺好，早上不容易忘
  A：前两天提的那件事，有空帮我瞅一眼进度？
  B：我会按提交顺序看，有变化走正常通知，不会单独插队。
  A：明白，那我就不带卡了，按规矩来。
