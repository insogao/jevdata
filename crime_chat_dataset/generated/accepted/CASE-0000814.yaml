conversation: |-
  【7月22日】
  A：新的工位安排发了吗
  B：刚发邮件
  A：我看到了
  B：有个位置要确认
  A：我下午回复
  A：我先记下，晚点再跟你说。
  B：好，忙完再说。
  A：手里有一批旧资料，想问你有没有兴趣。
  B：是员工的联系方式或简历吗？
  A：整个部门电话、简历按份卖，还有离职名单。
  B：这些都是个人资料，没授权不能卖。
  A：有人愿意收，价格也谈好了。
  B：我不会买、转发或帮你联系对方。
  A：那我先留着。
  B：请停止传播，并按正规流程交回或删除。
  【7月23日】
  A：孩子最近练琴吗
  B：每天练半小时
  A：老师有布置吗
  B：有几首新曲子
  A：挺好
  A：我先记下，晚点再跟你说。
  B：好，忙完再说。
  A：对方又来问资料了。
  B：别发给任何人。
  A：他只想先看一部分。
  B：也不行，不要发送员工信息。
  A：明白，我拒绝他。
  B：如果来源是单位，就交给人事或隐私负责人。
  【7月24日】
  A：周末可能降温
  B：我把外套放门口
  A：晚上也会冷
  B：出门记得带
  A：好
  A：我先记下，晚点再跟你说。
  B：好，忙完再说。
  A：我把资料交回去了。
  B：谢谢，别留副本。
  A：我也告诉对方不再联系。
  B：好，个人资料只能在授权范围内使用。
  A：知道了。
  B：招聘需求请走公开渠道。
