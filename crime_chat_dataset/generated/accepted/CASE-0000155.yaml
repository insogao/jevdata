conversation: |-
  【10月11日】
  B：阿伟，在吗，问你个事
  A：老同学，咋了
  B：我店里有笔货款卡住了，周转差五万。银行那边我征信有逾期，办不下来
  A：银行那是死板，你这金额又不大。我认识个做放款的，不看征信，当天就批
  B：不看征信？靠谱吗，别是那种乱七八糟的
  A：我去年自己用过，第二天钱就到账了，你要的话我帮你问问
  B：行，你帮我问问，利息怎么算的
  A：月息一分五，五万一个月七百五，比银行高点，但人家不看征信嘛
  B：行，麻烦你了
  A：说到这个，下个月班长婚礼你去不，群里在统计人数
  B：去，红包我都准备好了，就是那个酒店有点远
  A：远啥，到时候我们几个拼车
  B：成
  【10月12日】
  A：老同学，问好了，人家那边说要先核一下你的身份和店铺信息，你把营业执照拍给我
  B：好，我拍了发你，还要什么
  A：银行卡号也发一下，用于放款，再填个申请表，我传给经理
  B：表发我
  A：表格图片发你了，按这个填，填好拍回来
  B：填好了，你看看
  A：收到，我传给经理了，他说下午给你回
  B：等消息的时间干活去了，最近厂里接了个大单，天天赶工
  A：好事啊，忙起来才有钱赚
  B：是，忙完这波，我打算把店里再扩半间
  A：有魄力，到时候开张叫我喝酒
  B：一定
  A：经理回复了，额度批了，五万，利息按说好的。但放款前要走个流程，交三千保证金，证明你有还款能力，放款当天原路退回
  B：还要交钱？不是说批了就放款吗
  A：人家正规流程，保证金就是走个形式。你要不放心，我陪你一起去交也行，人家就认这个
  B：行吧，先交三千，放款了连本带息我一起结
  A：嗯，我把他收款码发你，你转这个
  B：转好了，你让经理确认下
  【系统消息】B 向 A 转账 3000 元，已收款。
  A：收到，我马上转给经理，你等今晚放款
  B：好，今晚到账我请你吃夜宵
  B：怎么还没到账，说好今天的
  A：别急，经理说系统批量放款，明早十点前肯定到
  B：行，明早我盯着
  【10月13日】
  B：阿伟，十点了，还没到
  A：我催了。经理说你的卡进件的时候填错一位数，钱被系统拦下来了，要交两千解冻费，解冻了连保证金一起退
  B：填错？我照着你发的表填的，怎么会错
  A：经理说新员工录错的可能性也有，先交解冻，钱到账了一分不少退你
  B：我现在拿不出两千了，三张卡都空了
  A：那你找家里周转下，解冻费不出，前面三千也拿不回来，得不偿失
  B：我跟我老婆说了，她说先等等，她要打电话核实你们公司
  A：打电话没用，这个部门不接外部电话。合同都在的，你怕什么
  B：合同发我看看
  A：合同是图片版的，盖章页我拍给你。电子签系统在维护，先看图，放款后补纸质
  B：图片怎么核实啊，连公司全称都看不清
  A：你就认我这个人，我老同学坑你干嘛，放完款你什么都有了
  B：唉，先不说了，店里外面下大雨，我得去收摊
  A：你那还下雨呢，我们这边出太阳。早点收，别淋着
  B：嗯，店门口招牌都被泡了一角，烦死了
  A：拍照留证据，这种有保险的能赔一点
  B：对，我下午拍
  【10月14日】
  B：昨晚想了一夜，那两千我真的不交了，你把三千退我，这事算了
  A：退不了，保证金在放款通道里，你中途撤单要扣百分之三十违约金
  B：什么违约金，昨天你说是走形式原路退回，我现在人证物证都有
  A：你冷静点，违约金一扣你更亏，不如把解冻费交了，今天就能全下来
  B：你再发一遍经理的工号和公司全称，我要去查
  A：人家接的单子多，不对外报工号。你要信我，交了今天就到账，不信就当我没说
  B：我问你，收款码收款人为什么是个人的名字
  A：经理用他个人卡走账快，这个行内都这样
  B：行内都这样？我去问过在银行干的同学了，他说正规放款绝不会在放款前收任何费用
  A：你同学懂什么，银行那套早就过时了，不然你自己怎么在银行办不下来
  B：他还把正规放款流程的说明截图发我了，你自己看
  A：截图谁都会做，你要这么说我也没办法
  B：阿伟，咱们十年同学，你今天必须给我个准话，三千到底退不退
  A：退不了，我话放这。你要闹就闹，单子是你自己签的
  B：好，你会后悔的，我已经在整理聊天记录了，我表哥在派出所
  A：随便，吓唬谁呢
  B：我不管你信不信，今天之内退钱，三千块也是钱，不然我就去反映
  A：别冲动，经理说又给你争取了一次，今晚再放一次款，你把解冻的事再想想
  B：不用想了，我下午已经去查过了，材料都备齐了，你们那个公司注册地址是个共享办公室
  A：……你再等等，今晚
  B：我最后说一次，今晚八点前退款，我只要你退我本金，不然明天我不会再跟你商量
  A：说了在走流程，你着什么急
  B：等着你的就是流程了，我等到八点，你看着办
  B：八点了，没收到。明天见，阿伟
  A：……
