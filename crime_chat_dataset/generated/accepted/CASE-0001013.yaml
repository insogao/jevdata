  【9月15日】
  A：打扰一下，我想了解一名学生的成绩档案，可以替我查吗？
  B：抱歉，只有获授权的监护人才能申请相关信息。
  A：我路上看到附近公交改线相关的通知了。
  B：我也看见了，信息挺清楚。
  A：你觉得要改计划吗？
  B：先按原来安排，到时再看。
  A：行，有变化再说。
  B：好，回头联系。
  A：我把附近公交改线的时间记下来了。
  B：好，免得临时忘。
  A：最近天气变化快，出门看一眼预报。
  B：嗯，我会带件外套。
  A：那先这样，我去处理手头的事。
  【9月16日】
  A：班主任系统点一下不就能看到升学情况？
  B：我不能越权打开学生资料。
  A：顺便问下，手机电池更换后来有着落了吗？
  B：有了，刚刚确定下来。
  A：你选了哪个方案？
  B：就选简单那个，省心。
  A：那挺好，少操点心。
  B：嗯，最近事情有点多。
  A：我把手机电池更换的时间记下来了。
  B：好，免得临时忘。
