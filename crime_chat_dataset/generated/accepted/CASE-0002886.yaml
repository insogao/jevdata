title: bribery_corruption/gift_card_channel
conversation: |-
  【6月13日】
  A：林姐，打扰下，我那份资格续审材料这周是不是会轮到你看？
  B：我先看一下安排，最近都在按顺序处理。
  A：嗯，知道你忙。刚好节前安排前我想当面跟你说声谢谢。
  B：不用特意跑一趟，工作上的事照流程就行。
  A：我手边有张购物卡，节前一点心意，卡面我也没特意看。
  B：你太客气了，这个我收下，心意我知道了。
  【6月14日】
  A：我妈又问我假期回不回去，车票还没看呢。
  B：早点定吧，临近节日票不好买。
  A：她说家里要包饺子，非让我带点水果回去。
  B：挺好啊，我上周也回去了一趟。
  A：你家那边现在还热闹吗？
  B：还行，邻居都在准备过节。
  A：家里说不用带太多东西，人回去就行。
  A：那份资格续审材料我又核了一遍，附件都齐了。
  B：好，我还没看到最后一页，等轮到时一起核。
  A：辛苦啦，最近催得有点急，我怕耽误后面的安排。
  B：理解，不过每份都得一样看，别着急。
  【6月15日】
  A：最近肩膀有点僵，坐电脑前时间太久了。
  B：我也是，记得起来活动一下，别一直窝着。
  A：买了个小靠垫，感觉稍微好点。
  B：我下班会走两圈，确实轻松些。
  A：我得学你，最近运动量几乎为零。
  B：先从散步开始，不用一下给自己太大压力。
  【6月16日】
  A：昨天网购的收纳盒到了，比照片里小一圈。
  B：哈哈，尺寸没看仔细吧？
  A：大概是，我准备放办公桌下面。
  B：小的也好，桌面能清爽一点。
  A：你上次买的那款好用吗？
  B：还行，拼起来挺快，没什么味道。
  【6月17日】
  A：今天地铁又晚点，差点没赶上打卡。
  B：早高峰就是这样，最近那条线在检修。
  A：我以后可能提前十分钟出门。
  B：留点余量安心些。
  A：你是坐公交还是地铁？
  B：公交转地铁，路上能听会儿播客。
  A：午饭你吃了吗，我刚点了个盖饭，今天忙得忘了看时间。
  B：刚吃完，楼下那家新开的还行，就是排队有点长。
  A：我也想试，听说他们的番茄牛腩不错。
  B：嗯，别点太多，分量挺大的。
  A：记下了，哪天一起去？
  B：可以，等这阵子忙完吧。
  【6月18日】
  A：前几天那份东西，多谢你照应一下。
  B：我只是照常看材料，你别客气。
  A：明白，就是想请你有空时帮我留意下进度。
  B：我会按顺序处理，有消息再通知你。
