title: bribery_corruption/school_admission_payment
conversation: |-
  【6月1日】
  A：学校公众号提到助学捐赠，我想了解一下怎么走。
  A：这周雨挺大，路上堵得厉害。
  B：我早上多坐了两站地铁，反而快些。
  A：明天我也早点出门试试。
  B：带把伞，预报说还要下。
  B：可以看财务处公开页面，捐赠完全自愿，和入学名额没有关系。
  B：中午吃的什么？
  A：楼下新开了家面馆，味道还行。
  B：我也想去，别点太辣。
  A：放心，我最近胃不太舒服。
  【6月2日】
  A：明白。我们主要还想问问转学手续，需要准备什么？
  A：家里那盆绿植最近叶子有点蔫。
  B：是不是放在空调风口了？
  A：我挪到窗边看看。
  B：先少浇点水，周末再观察。
  B：材料清单也在官网，按学区和学籍要求正常提交就行。
  A：捐了以后收据会写清楚用途吧？
  B：会按实际捐赠项目开具，金额和去向都能查询。
  A：那我们先不捐，先把转学材料准备齐。
  【6月3日】
  B：没问题，审核按统一标准，不会因为捐赠改变顺序。
  A：我刚开完会，今天安排有点满。
  B：辛苦了，记得喝水。
  A：嗯，桌上还放着半杯咖啡。
  B：冷了就别喝了，换点温水。
  A：明早我先把日程看一下。
  B：好，有变化再互相说一声。
  B：你那边今天忙到几点？
  A：差不多六点，晚点再回家。
  【6月4日】
  A：刚才网络断了一下，消息才发出去。
  B：没事，我也刚看到。
  B：快递送到了吗？
  A：到了，放在门口柜子里。
  A：这两天温差挺明显的。
  B：是啊，晚上记得加件外套。
  B：我先去处理下手头的事。
  A：好，忙完再聊。
  A：刚把桌面收拾了下，文件总算没那么乱。
  【6月5日】
  B：今天窗外风挺大，阳台门我关上了。
  A：晚饭打算做点清淡的，最近不想吃太油。
  B：我把明天要带的东西放在玄关了。
  A：刚泡了杯茶，先缓一会儿再继续。
  B：附近那家水果店换了招牌，你看见没？
  B：这周睡得有点晚，今晚争取早点休息。
  A：我把快递纸箱拆好了，准备拿去回收。
  A：天气预报说周末会降温，衣服得带厚一点。
  B：刚才整理照片，翻到去年那次出游了。
  【6月6日】
  B：家里的灯泡好像快坏了，闪了两下。
