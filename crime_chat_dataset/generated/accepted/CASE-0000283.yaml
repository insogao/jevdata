  A：橙子最近挺甜的。
  B：我妈更喜欢梨，我买一小袋。
  A：挺好，路上别赶。
  B：嗯，坐地铁过去。
  A：很多同行都这么做。
  B：我不接没有授权的货。
  A：你最近还在看那部剧吗？
  B：看完了，后半段比开头好。
  【9月5日】
  A：我还没看到一半。
  B：慢慢看，不着急。
  A：最近晚上总加班。
  B：那就周末再看。
  A：那我把报价撤下来。
  B：商品说明也要真实，不要让买家误认。
  A：你最近午饭还点那家盖饭吗？
  B：换成楼下的馄饨了，出餐快。
  A：我周末想把书架整理一下。
