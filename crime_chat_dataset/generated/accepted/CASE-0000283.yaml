  A：不是尾单，做工按一比一走。
  B：没有授权就不能按品牌商品卖。
  【9月2日】
  A：附近新开了家面馆，你吃过没？
  B：还没，同事说汤底挺清爽。
  A：我中午去试试，别又排队。
  B：早点去吧，十二点后人多。
  A：好，回来给你反馈。
  B：要是不错我也去。
  A：防伪码扫出来也能过，顾客看不出来。
  B：扫码不能替代授权证明。
  A：你家那盆绿植最近怎么样？
  【9月3日】
  B：新长了两片叶子，挪到窗边了。
  A：我办公室那盆还没动静。
  B：别浇太勤，土干了再浇。
  【系统消息】A 向 B 转账 86 元，已收款。
  A：这是午饭拼单的钱，刚转给你了。
  A：好，回头试试。
  B：希望它快点长起来。
  A：拿货价分层，量越大越便宜。
  B：先提供正规来源和授权文件。
  A：周末你准备做什么？
  【9月4日】
