conversation: |-
  【6月3日】
  A：你上次说同事要论文润色？我这边能接
  B：她只是问格式和语言
  A：我这边从提纲到正文都能做，一篇一千五
  B：这不是辅导了吧？
  A：熟人合作，内容按她方向来，查重我保过
  B：她自己最近忙实习
  B：公司楼下新开了家咖啡店
  A：味道怎么样
  B：拿铁还行，就是有点贵
  A：我平时喝美式，省点糖
  【6月4日】
  B：实习单位离学校挺远，每天通勤两小时
  A：那确实累，地铁上别一直看手机
  B：她想先把开题弄完
  A：你把题目发来，我安排写手，导师那边我打招呼
  B：你怎么认识导师的
  A：以前合作过，流程我熟
  A：周末球场订到了吗
  B：周六上午十点，老位置
  A：好，我带两瓶水
  B：我把护膝也放包里
  【系统消息】B 向 A 转账 1500 元，已收款。
  【6月7日】
  A：她决定了吗？档期我得排
  B：她还在犹豫，想先要个提纲看看
  A：提纲可以做，后面正文一篇一千五，查重我保过
  B：她说想自己写，只请人改改表达
  A：那也能做，不过我这边主要是整套服务
  B：我转达一下
  B：最近地铁施工，早高峰更挤了
  A：坐到下一站再换线会不会好点
  B：试过，反而绕远
  A：那就多预留十分钟
  【6月8日】
  B：她最后说还是自己写，找同学帮忙看格式
  A：可惜了，导师那边我都打过招呼
  B：那就别继续了，免得她为难
  A：行。对了你周五还去打球吗
  B：去，球鞋刚洗了
  A：我带水，别忘了护膝
  A：你上次推荐的电影我看完了
  B：结尾是不是有点突然
  A：是，但配乐不错
  B：我就喜欢那段钢琴
