title: bribery_corruption/relative_employment_exchange
conversation: |-
  【11月1日】
  A：我女儿面试那边说流程都走完了，面试像走形式。
  B：你是招聘经理，怎么还让家属入职前收款？
  A：对方说档案可以特殊处理，先给我一笔感谢费。
  B：这不是正常内推，不能收钱或承诺岗位。
  A：她条件确实合适，我只是想帮她。
  B：让她走公开流程，你按制度回避亲属关系。
  A：妈今天复查结果出来了，医生说稳定。
  B：太好了，记得按时吃药。
  A：周末我陪她去公园走走。
  B：天气预报不错，带件外套。
  【11月2日】
  A：我已经把那笔钱退回去，也说明不会动档案。
  B：把招聘过程按规定记录，交给合规部门复核。
  A：我会申报亲属关系并回避评审。
  B：这样对她也公平，省得以后说不清。
  A：午饭吃了没？
  B：刚吃完，今天食堂鱼不错。
  A：我还在开会，晚点吃。
  B：别空腹喝咖啡啊。
  【11月3日】
  A：合规同事接手复核了。
  B：好，后面按公开标准处理。
  A：我没再跟候选人谈特殊安排。
  B：保持透明就好。
  【系统消息】A 向 B 转账 1200 元，已收款。
  【11月7日】
  A：女儿决定继续等公开招聘结果。
