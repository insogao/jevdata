conversation: |-
  【9月2日】
  A：早啊，刚到工位就看见你昨晚朋友圈，又加班到十一点？
  B：别提了，项目上线，连着三周了，头发一把一把掉。
  A：命要紧，钱是老板的，头发是自己的。
  B：道理都懂，房贷不懂我。
  A：你们楼下那家咖啡还送不送？我们这边全靠冰美式续命。
  B：送，9块9那款，我现在一天两杯打底。
  A：我最近戒了，换成枸杞，中年人的妥协。
  B：哈哈哈，保温杯里泡枸杞，你倒是走在时代前面。
  B：对了，你最近忙啥呢？朋友圈都不怎么发了。
  A：换了赛道，跟着一个舅舅做点小项目，先不细说，等稳了请你吃饭。
  B：呦，搞什么名堂这么神秘。
  A：不是不说，是说早了怕你觉得玄乎。反正比你那项目轻松，收益还行。
  B：我最近是真琢磨搞点副业，工资就那样，涨不动。
  A：巧了，回头细聊，你这种人上手快。
  B：你听说没，老刘跳去对手家了，薪资翻倍。
  A：听说了，群里都传疯了，他还装死不吭声。
  B：上季度还一起吐槽食堂，转头就跑，绝。
  A：人往高处走，咱就酸一下，哈哈。
  B：周末干嘛去？听说北边开了个市集。
  A：带娃去，他惦记那家烤肠摊好久了。
  B：那你帮我看看有没有手工皮具摊，我想配个钥匙扣。
  A：行，拍照发你挑。
  B：突然想起来，你说的那个项目，真有那么好？
  A：不吹，这个月比工资多。不过你现在别急着问，过两天我整理好给你看。
  B：行，我等着，别画饼啊。
  【9月3日】
  A：早。昨晚整理了下，你要真有兴趣，我先让你体验一把。
  B：咋体验？
  A：上礼拜不是给你转了500嘛，你看到没？
  B：看到了！还没来得及谢你呢，那500我寻思你发错人了，哈哈。
  A：没发错。那就是体验份额，五天，昨天到期，本息一起回的，你点下账单。
  B：真是秒到啊……这玩意儿靠谱吗？
  A：我进场两年了，内部额度，不是外面那种App，提现我自己说了算。
  B：内部额度是啥意思？
  A：一个舅舅在那边带盘，名额制，不对外的。所以我说名额金贵。
  B：中午绕着园区走了两圈，算健身了。
  A：就这？我今晚还夜跑五公里呢。
  B：卷王。上次约球你鸽我两回。
  A：这周补上，周四晚，老地方球场。
  B：下午闲，我又翻了翻你说的那个，心里还是打鼓。最近理财爆雷的可不少。
  A：所以才让你先拿500试啊。爆雷的是不认识的人，我舅舅那个，我全家都在里面，我拿全家骗你？
  B：话是这么说……
  A：而且咱这规矩：不满保底，我自己贴给你。首月保底12%，你五千一个月600，比我一年调薪都多。
  B：600块，一个月。
  A：对，而且到期本息自动回，不用你天天盯。
  B：容我消化消化。
  A：不急，这事讲究个缘分，你要当兄弟吹牛也行。
  B：晚上去吃了新开那家湘菜，剁椒鱼头绝了。
  A：下次带路，我能吃三碗饭。
  B：就怕你减肥大业毁于鱼头。
  A：毁就毁吧，人这一生，口腹之欲最难戒。
  B：再问你个实在的，这名额要花钱买吗？
  A：占名额要押一笔进去，多少自定，三千起步。我第一次也是三千试的。
  B：我手头能动的就一万出头。
  A：够了，一万千一别多，先感受一个月，到账你自己判断。
  B：行，我想一晚上，明天给你话。
  【9月4日】
  A：早，想好了没？不催你，就是这期有点紧。
  B：昨晚跟我媳妇商量了，她说先少放点。
  A：嫂子稳妥。不过跟你说个事：这期通道今晚12点关，下一期排到双十一以后了，名额就剩3个，我能不能给你挤出来都两说。
  B：这么紧？
  A：名额制就这样，我舅舅也是卡着配额走。你要这期没赶上，我也没办法，只能等你下回。
  B：让我再想想……保底那个，写下来吗？
  A：兄弟之间，我嘴就是字据。不满12%，差多少我补多少，这事我在群里都敢说。
  B：中午了，吃啥？
  A：食堂红烧肉。对了中秋放三天，你回老家不？
  B：回，票还没抢，不知道抢得到不。
  A：让你媳妇用候补，前年我候补第二天就出票了。
  B：好嘞，这就去候补。
  B：兄弟，我想明白了，就按你说的，先放一万，多了真没有。
  A：行，这才对。名额我现在就给你占上。
  B：转哪个账号？你那个舅舅的，还是你的？
  A：转我就行，我统一报名额，回执截图给你。
  B：定下来了，转你一万，帮我占上，别到时候黄了。
  【系统消息】B 向 A 转账 10000 元，已收款。
  B：转了，你点点。
  A：收到！名额锁了，明天上午我把后台份额截图发你，到期自动回本息。
  B：好，那我坐等到账，到时候请你吃剁椒鱼头。
  A：一言为定，加个鸡腿。
