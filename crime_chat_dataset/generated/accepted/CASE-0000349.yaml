title: fraud_scam/video_coaching_parent_scam
conversation: |-
  【9月2日】
  A：林姐，孩子最近还在找数学老师吗
  B：在呢，初二数学有点跟不上
  A：我认识个老师，清华退学的，后来专做竞赛辅导
  B：退学也能教吗？有证吗
  A：证书回头给你看，先试听也行，家长群里都说讲得好
  B：学校通知下周要开家长会
  A：我周五提醒你，别跟孩子撞上兴趣班
  B：兴趣班刚好也调到周六了
  A：那周末就空一点
  【9月3日】
  B：我看了你发的介绍，写着十节包提分？
  A：对，基础题这块，十节没变化就继续补，不额外收
  B：孩子英语也有点拖后腿
  A：英语先别加，数学先稳住，别一次报太多
  B：这倒是，昨晚他还说想买双球鞋
  A：我妈寄来一箱橙子
  B：现在这个季节的橙子挺甜
  A：我放门口给你拿几个
  B：好呀，谢啦
  A：球鞋可以周末去商场看看，最近有折扣
  B：他想要白色的，特别不耐脏
  A：初中生嘛，喜欢就行，买双能穿的
  B：你说那个老师什么时候能试听？
  A：这周能排，最后三个名额了，过了就得等下个月
  B：怎么这么赶
  A：开学后问的人多，我先把试听位给你留到晚上
  B：孩子的球鞋最后买了蓝色
  A：蓝色耐脏，挺好
  B：他高兴得不行
  A：小孩有双喜欢的鞋就能开心半天
  【系统消息】B 向 A 转账 1200 元，已收款。
  【9月4日】
  B：我们周日要去奶奶家，周六下午行不行
  A：行，我让他线上讲一节。你家路由器最近还掉线吗
  B：前两天重启过就好了
  A：试听后你再决定，别因为我认识就不好意思
  B：好，我先跟孩子说说
  A：这两天早晚凉，接孩子多带件衣服
  B：嗯，书包里放了薄外套
  A：最近学校门口修路，早点出门
  B：看到了，明天绕后门走
