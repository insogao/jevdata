title: bribery_corruption/regulatory_tip_payment
conversation: |-
  【10月25日】
  B：哥,早,出摊了没?
  A：我哪用出摊,刚到单位,食堂俩包子对付。
  B：我这边豆浆刚磨好,热乎着呢,可惜你喝不上。
  A：少来,你那店现在一天能卖多少杯?
  B：托福,周六能排小队,就是熬人。
  A：累别硬扛,身体是本钱,爸妈老念叨你。
  B：舅妈血压这两天稳点没?
  A：稳住了,早上遛弯,饭也忌口了。
  B：那就好,回头我买点黑枸杞给舅妈寄过去。
  A：说个正事。昨晚给你去电话你没接,正好说这事:下周二上午,上面要来咱们片区转,你那片排第一站。
  B：啊?这么突然?上季度不是刚看过?
  A：名单刚下的,我提前给你透个底,你自己上心。
  B：上次说补的灭火器和通道标识,我这两天就弄。
  A：尽快。另外你怎么回回都卡在那么一两条上?上上回是台账,上回是标识。
  B：我也邪门,整改整了三轮,回回差一口气。
  A：差一口气就是不过,你品品。
  B：品出来了……上个月那两千,是不是我打晚了吗?
  A：这种事微信里别说得这么明白,你心里有数就行。
  B：懂懂懂,月底照旧,每月这天,老卡号。
  A：行了,店里忙去吧,有动态我再给你信。
  B：对了哥,你胃还反酸不?别老拿包子对付。
  A：上周去查了,有个指标超标,开了药,好多了。
  B：少喝浓茶少熬夜,舅妈一天念你八遍。
  A：她那嗓门,我不听也往耳朵里钻。
  B：哈哈,回头我把店里新豆子给你寄一袋,养胃。
  A：行,这个可以有,比买烟实在。
  B：我琢磨着把门头翻新下,哥你帮我参谋参谋?
  A：弄亮堂点,灯箱换白光,玻璃擦透,显干净,检查的看着也舒服。
  B：那报批手续麻烦不?
  A：门头小改不用报,别动承重和外立面结构就行。
  B：那我下周就去问广告店,赶在节前换新。
  A：嗯,发票留好,说不定要看台账和进项。
  B：哥,灭火器买几个装的?多大规格?
  A：后厨两个四公斤,前厅一个,通道口一个,压力表指针得在绿区。
  B：明白,标识贴纸一起配齐。
  A：贴一米二左右的高度,齐着线贴,看着规整。
  B：行,下午就去器材店,一条龙办完。
  B：哎,上周五那波是怎么个事?临时突然就来了。
  A：那是邻市交叉互查,不打招呼那种,我也是当天才知道。
  B：吓我一身汗,后厨停了半天不敢开火。
  A：所以平时把底子打好,谁来都不慌,这才是长久之计。
  B：侄女军训回来了吧?黑没黑成炭?
  A：回来了,黑一圈,天天喊腿疼,走路像企鹅。
  B：哈哈,大学第一课都这样,我当年回来我妈都没认出来。
  A：她还念叨寒假要去你店里体验生活呢。
  B：让她来!管吃管喝,再给点零花钱,就当社会实践。
  A：行,回头让她找你报到,你可别惯着她。
  B：哥,月底那笔还是转老卡号吧?每月两千,不变?
  A：嗯,别写备注,到账我心里有数。
  B：好嘞,那我提前两天打,免得过了点。
  B：网上那台商用和面机在搞预售,比店里便宜四百。
  A：看好功率和面量,别图便宜买小马拉大车。
  B：我让卖家把参数发你,你帮我掌掌眼?
  A：发来,我给你挑,这玩意我熟。
  B：那敢情好,买对了能省不少电费。
  A：顺便把水箱也换了,老机器那水箱都锈了。
  【10月26日】
  B：哥,昨晚没睡好吧?听着声音都哑了。
  A：昨晚有夜查,两点才到家,眯了四个钟头。
  B：你们这作息是真熬人,心疼。
  A：干这行就这样,节假日别人休息我们最忙。
  【系统消息】B 向 A 转账 2000 元，已收款。
  B：哥,提前转你了,你查收,老卡号,没写备注。
  A：到了。你放心,周二之前有任何动态,我第一时间给你信。
  B：有哥这句话,我这心里就踏实了,不然天天打鼓。
  A：你把硬件给我弄到位,剩下的有我。
  B：国庆来家里吃饭呗,我妈说好些日子没见你了。
  A：去,我带两瓶存的好酒,咱哥俩叙叙。
  B：舅妈做酱肘子,你血压高,酒抿两口意思意思。
  A：一杯,就一杯,多了不喝,哈哈。
  B：再把你闺女带上,店里新出的桂花拿铁给她留着。
  A：行,她一听有新饮品,指定催着我早点到。
