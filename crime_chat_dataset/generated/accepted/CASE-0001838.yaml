  A：放太久的就别留了
  B：放心，今天就吃掉
  A：那盒汤我今晚热掉
  B：别放太久，注意闻一下
  A：那天说的那份，你有空时帮我看一眼就行。
  A：你妈最近肩膀好点没
  B：好多了，理疗后轻松些
