  A：螃蟹今年贵不，我订了两箱发老家
  B：贵，母蟹都三两往上了
  A：那也得吃，一年就这一季
  A：老韩，备案那事今天再问最后一次哈，到哪步了
  B：我看了下，进公示环节了，明天出结果，该你的跑不了
  A：好，我就问问，不催你
