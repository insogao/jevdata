conversation: |-
  【10月12日】
  A：老陈,下周那边有个单子,还得辛苦你跑跑腿。
  B：哥你说,还是过去那边?
  A：嗯,老客户催得急,要用现的,账上绕不过去。
  B：量多大?
  A：一共十六个,分五天走。
  B：就我一个人跑?
  A：你带俩靠谱的,一人一天两万,卡着数走,别贪多。
  B：人我熟,小刘和跑船的老周,都稳。
  A：提成老规矩,一趟八百,船票路费实报。
  B：成,那我周三先走头一趟。
  A：上回寄你那饼老白茶,开了没?
  B：开了,周末就着它泡了一下午,有枣香。
  A：那茶得煮才出味,你拿壶闷,可惜了。
  B：学到了,回头入个煮茶器,你推荐个牌子。
  A：我用的是老铁壶,烧水都香,回头拍照片给你。
  B：行,照着抄作业,哈哈。
  【10月13日】
  B：哥,今天第一趟,东西交到王姐手上了,收条拍你了。
  A：收条我看了,对。明天起你和小刘错开,一人一天一趟。
  B：五天一共几趟?
  A：你四趟,他俩各两趟,凑够八次,正好收尾。
  B：那每趟顶格两万?能不能多带点,少跑两趟?
  A：顶格就是顶格,一分别多加,稳当第一。
  B：懂,稳字当头,听你的。
  B：周四那边有雨,过海怕颠。
  A：不急,安全第一,王姐那边我打过招呼了。
  B：行,我看下船期,避开风最大那班。
  A：改签的票都留着,回头一起报。
  B：好,我这人证物票俱全,哈哈。
  A：你小子,报销还挺专业。
  A：你爸那腰,理疗做完一疗程没?
  B：做完了,好多了,能绕小区遛两圈了。
  A：那就好,老腰这毛病,三分治七分养。
  B：他还念叨你送那护腰,说比医院的玩意好使。
  A：下次回去我再给他带两贴膏药,老配方那个。
  B：他指定高兴,你就他嘴里的「别人家孩子」。
  【10月14日】
  B：今天两趟跑完,小刘那趟也交割了,都顺。
  A：辛苦,晚上吃点好的,记你卡上。
  B：王姐问,剩下的量什么时候能齐。
  A：就这两天。让她收货的人手排开点,别扎堆签收。
  B：明白,我提醒她分批来,一天一批。
  A：昨晚那球看了没?最后那脚单刀,气死我。
  B：看了,我血压都看高了,白瞎那机会。
  A：咱这岁数,看个热闹,别真动气。
  B：下回还是看乒乓球,稳,心脏受不了。
  A：哈哈,你这是输怕了。
  B：是怕自己再买一份降压药。
  【10月15日】
  B：哥,今天出状况了,关口抽查,小刘被叫去问了两句。
  A：问什么了?
  B：常规的,带多少、干嘛用。小刘说是给姨带生活费,就放行了。
  A：应变可以,没露怯吧?
  B：没有,出来还跟我比了个耶。
  A：行,明天照旧,你那趟正常走。
  B：那边有什么要捎的?你嫂子上回要的药油。
  A：带两瓶,再来盒杏仁饼,王姐爱吃那口。
  B：行,我顺路捎,记你账上。
  A：这几十块还记账,你小子账比会计还细。
  B：咱这叫亲兄弟明算账,哈哈。
  A：行,周三见了货一起清。
  【10月16日】
  B：哥,第八趟交割完,王姐点收齐了,十六个整,一张不差。
  A：好,辛苦兄弟们,今晚我摆一桌,酒随便点。
  B：那可不客气,老周点名要喝好的。
  【系统消息】A 向 B 转账 6400 元，已收款。
  A：转6400,八趟的辛苦费加路费,你分下去。
  B：收到。小刘和老周一人一千六,剩下一趟我的加路费我收。
  A：行,分完把数报我一声。
  B：晚上六点半,老地方那家湘菜?
  A：对,包间订好了。下个月那边还有个大的,细节饭桌上说。
