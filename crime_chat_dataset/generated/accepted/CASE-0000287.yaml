title: fraud_scam/second_hand_deposit_run
conversation: |-
  【9月1日】
  A：那台相机还在，价格比同款便宜不少。
  B：能走平台验货吗？
  A：我急着搬家，今天定再少两百。
  B：配件和票据有吗？
  A：这两天降温挺快。
  B：早晚有点凉，我拿了薄外套。
  A：我还穿短袖，早上有点后悔。
  B：办公室放件外套方便。
  A：嗯，记下了。
  B：这周天气变化挺快。
  A：配件齐，平台手续费高，直接转定金我给你留。
  【9月2日】
  B：我只走平台担保，不私下转。
  A：我先发你物流号，放心。
  A：附近新开了家面馆，你吃过没？
  B：还没，同事说汤底挺清爽。
  A：我中午去试试，别又排队。
  B：早点去吧，十二点后人多。
  A：好，回来给你反馈。
  B：要是不错我也去。
  B：这个单号查不到揽收信息。
  A：系统可能晚点更新，我已经寄了。
  B：请在平台上传凭证，我不会另付钱。
  【9月3日】
  A：你家那盆绿植最近怎么样？
  B：新长了两片叶子，挪到窗边了。
  A：我办公室那盆还没动静。
  B：别浇太勤，土干了再浇。
  A：好，回头试试。
  B：希望它快点长起来。
  A：先撤申请，我再补截图。
  B：截图不能代替平台记录，按平台核验。
  A：相机我给别人了。
  B：请在平台取消订单并退款。
  【9月4日】
  A：你最近午饭还点那家盖饭吗？
  B：换成楼下的馄饨了，出餐快。
  A：我周末想把书架整理一下。
  B：先把不用的书装箱，桌面会清爽很多。
  A：今天早高峰地铁人多吗？
  B：还好，我提前一站下车走过来的。
  A：附近超市的梨最近挺甜。
  B：我上周买过，价格也还行。
  A：你那双鞋修好了吗？
  B：好了，换了鞋跟还能穿一阵。
  A：周末天气预报说会晴。
  【9月5日】
  B：那正好把被子拿出去晒晒。
  A：你最近晚上还在看书吗？
  B：睡前看几页，眼睛累了就停。
  A：我想换个保温杯，旧的漏水。
  B：买个简单的就行，容量别太大。
  A：楼下早餐店换了菜单。
  B：我看到多了豆浆和饭团。
  A：这周办公室空调有点冷。
  B：我放了件薄外套在椅背上。
  A：你家猫还喜欢蹲窗台吗？
  B：喜欢，早上总盯着外面的鸟看。
  【9月6日】
  A：我昨晚做了番茄鸡蛋面。
  B：简单又快，适合下班晚的时候。
  A：你上次推荐的播客我听了两期。
  B：还不错吧？我通勤时经常听。
  A：门口那家修车铺还开着吗？
  B：开着，我昨天去给车打了气。
  A：最近晚上风大，晾衣服要夹牢。
  B：是啊，我昨天差点把袜子吹走。
  A：周末你准备去哪里走走？
  B：可能去河边，不想跑太远。
