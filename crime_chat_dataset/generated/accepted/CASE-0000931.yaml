conversation: |-
  【9月3日】
  A：能不能查下另一个学生的档案？
  A：班主任系统点一下就能看到吧。
  A：先说个别的，我刚把自行车送去补胎。
  B：哈哈，这事倒简单。
  A：你最近忙吗？
  B：还行，手头都收尾了。
  A：那挺好，别熬太晚。
  B：嗯，等会儿去弄。
  【9月4日】
  A：红包我已经转了，你发张截图就行。
  B：不行，我不会私自查阅或转发学生成绩。
  A：对了，下午茶要不要点无糖的？
  B：我也觉得。
  A：你一般怎么安排？
  B：看当天吧，不赶时间。
  A：好，那我记一下。
  B：行，回头再聊。
  【9月5日】
  B：请由监护人向学校官方窗口提交申请。
  A：插一句，窗台那盆花开了两朵。
  B：真的？我还不知道。
  A：你试过吗？
  B：上周刚弄过，挺方便。
  A：收到，我也试试。
  B：嗯，别忘了就好。
  【9月6日】
  A：换个轻松的，周末家里要来客人，我得提前买菜。
  B：听着不错。
  A：你什么时候有空？
  B：周末应该可以。
  A：那到时再确认。
  B：好呀。
