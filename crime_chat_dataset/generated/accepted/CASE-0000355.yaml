conversation: |-
  【11月1日】
  A：部门发的卡你都用了吗？
  B：还有几张京东卡和苏果卡，公司福利发多了
  A：我这边可以收，九四折实结
  B：怎么结？
  A：核对余额后转给你，卡密即付
  B：我先看看面值和有效期
  B：办公室打印机又卡纸了
  A：先把后盖打开看看
  B：同事弄好了，是纸放歪
  A：这机器天天闹脾气
  【11月2日】
  B：今天降温了，办公室空调还开得很足
  A：我都穿外套了，你别着凉
  B：我带了围巾。卡券这事能不能等周末？
  A：可以，你把京东卡苏果卡都整理下
  B：我想先问下财务，福利卡转让有没有规定
  A：问清楚也好，别影响报账
  A：你上次说想换保温杯
  B：买了个小的，放包里正好
  A：冬天喝热水方便
  B：颜色还是你推荐的绿色
  【11月5日】
  A：问到规定了吗？
  B：财务说个人福利卡可以自用，转让要自己确认
  A：那你自己决定，我按九四折收
  B：其中两张我留给家里买东西
  A：剩下的也行，卡密即付
  B：等我核对好再发
  B：爸妈周末要来我这吃饭
  A：准备做什么菜
  B：番茄牛腩和青菜
  A：牛腩炖久一点更软
  【11月6日】
  B：我把剩下的一张京东卡给你，余额核过了
  A：收到，我按九四折转了
  B：到账了，谢谢
  A：下个月还有的话跟我说
  B：不一定，之后看公司怎么发
  A：行，早点下班，外面降温
  【系统消息】A 向 B 转账 940 元，已收款。
