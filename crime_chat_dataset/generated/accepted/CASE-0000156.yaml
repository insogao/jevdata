conversation: |-
  【10月12日】
  A：同学你好，看你在新生群里问兼职的事，加你了
  B：你好，是学校那个卡推广的兼职吗
  A：对，我们跟运营商合作做校园推广，正规项目
  B：具体干什么呀，我课不多，想搞点生活费
  A：不耽误上课，就帮着办卡开卡，办成一张就返现两百
  B：两百？！一张卡就两百？
  A：对，四件套那种，电话卡加储蓄卡一起办下来就算一张
  B：那么好赚，为啥不找社会上的人办
  A：社会上的人征信花了办不出来，学生干净呀。而且你还能拉同学，拉一个人办成再给你八十
  B：让我想想哈
  A：行，不着急，下午食堂门口我们摆了个点，你可以过来看看
  B：食堂门口是不是新开了家柠檬茶
  A：对，我今天排队买了一杯，还行，第二杯半价
  B：哈哈那正好，我下午去买一杯顺便看看你们点位
  A：成，来了报我微信名就行
  【10月13日】
  A：昨天那个点你去看了吗
  B：去了，看你们办了好几单。我想问下，办卡要用谁的身份证
  A：原则上谁办都行，但我建议你别用你自己名下的
  B：啊为什么，我自己办不是更方便
  A：你听我的，用你家里人的，或者同学的，让他们本人到场拍个照就行
  B：用别人的证，这不会有事吧
  A：能有什么事，就是办卡嘛。卡我们统一收上去激活，用完就注销了
  B：收上去干嘛，不是说办来自己用吗
  A：公司统一管理，月底统一销户。你只管办，办一张我结一张的钱
  B：那行吧，我下午带室友一起去，他正好要换卡
  B：说到下午，我上午还有门期中考，考完才过去
  A：你们这么快就期中了，注意别挂科哈哈
  B：高数是真顶不住，考完这门我至少能睡一天
  A：年轻人身体要紧，别学我们熬夜干活
  【10月14日】
  A：你和室友那两张卡我核对过了，照片信息没问题，卡都在我这了
  B：嗯，那返现什么时候给我
  A：现在就给你结，两百一张，两张四百。你室友那份你一起拿着吧，就当我给你的人头费
  B：那多不好意思，还是分开给他吧
  A：行，那这四百是给你的，回头我再单独转他
  【系统消息】A 向 B 转账 400 元，已收款。
  A：收到没，以后这种单子多的是，你拉一个办成的，我这边再补你八十提成
  B：好嘞，我班里还有几个想赚生活费的
  A：慢慢来，别一锅里端。记住啊，来的都要本人带证拍照，信息得跟卡对得上
  B：懂了懂了
  B：对了，明天降温，你们点位还摆外面吗
  A：摆，下雨才好，人家都躲屋里，我们正好干活哈哈
  B：行，那我明天把球鞋带上，下午去你们那边打球
  A：来呗，旁边就有球场
