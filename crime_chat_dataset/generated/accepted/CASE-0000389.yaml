  A：哈哈那您是真稳得住
  B：明天上午十点公示就贴出来了，你给我安稳点
  A：好的。那件事我明天上午一并办妥
  B：办完就翻篇，以后正常处
  【10月14日】
  A：组长，公示看到了！真心感谢
  B：恭喜。说过的，办完翻篇
  A：那必须的，我这就去办
  【系统消息】A 向 B 转账 46000 元，已收款。
  A：组长，一点心意，您收好，别嫌少
  B：你这是干什么，快撤回去
  A：不能撤，这是我早备好的，跟您也说句直白的，没有您就没有我这个位子
  B：……下不为例。数目的事，出了这个门谁也别提
  A：就咱俩知道，我连媳妇都没说
  B：中午一起吃个饭，食堂二楼新开的窗口
  A：好嘞，我下楼等您
  B：以后把新部门带好，比什么都强
  A：一定，您放心。您那腰也记得去我舅那儿养养
