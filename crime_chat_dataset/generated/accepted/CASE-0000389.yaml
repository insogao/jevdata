  【10月10日】
  A：组长，昨晚您那句话，我琢磨一晚上了
  B：我什么都没说，就说了句'别自己瞎折腾'
  A：懂了懂了。您那腰怎么样了，上次看您贴着膏药
  B：老毛病，阴天就酸。你舅不是开推拿馆的吗
  A：对，他手法确实好，我给他打个招呼，您去报我名字就行
  B：那行，回头去看看
  A：顺带说一句，下周二述职，我按您上次点的那几条准备
  B：嗯，数字做扎实，别整花活
  A：明白，我就讲降本那块，别的都收着
  B：还有，这几天别往人堆里凑，少说话
  A：知道，这几天我谁家都不串
  【10月11日】
  B：上午有空吗，水库那边走一圈
  A：有空，我七点半到您楼下
  B：不用接我，我自己开车，你在东坝口等
  A：今天口不错，您那条草鱼得有六斤
  B：多年没这么好手感了，晚上拿回家让我那口子炖了
  A：那必须的。对了，您那天说的那个安排，还算数吧
  B：我说什么安排了？
  A：行行，当我没问，我自己心里有数
  B：你这人就是急。周二先把述职弄利索
  A：好，全听您的
  【10月12日】
  A：组长，睡了没
  B：说事
  A：今天考评委那边过得怎么样
  B：名单内部已经过了一遍，就三个人
  B：你排第二，别声张
  A：收到，我嘴严。真到那天，我肯定得表示表示
  B：你心里有数就行，不用跟我说这些
  A：懂的，到时候您看数目就行，我来安排
  B：前提是公示别出幺蛾子，这几天谁也别去找
  A：明白，我连部门群都不冒泡
  B：早点睡，明天述职别掉链子
  【10月13日】
  A：组长，述职完了，问答那几分钟我扛住了
  B：听说了，姓孙的那个没难为你吧
  A：他问了两个成本问题，我拿数字顶回去了
  B：行。哎对了，你儿子家长会什么时候开
  A：上礼拜开了，老师又告状，说他上课撕纸
