conversation: |-
  【6月11日】
  A：直属员工，节前你哪天方便？节前想当面跟你问问进度
  B：这两天事情有点多，怎么突然想见面？
  A：阳台那盆薄荷活了吗
  B：活了，最近长得还挺快
  A：我那盆叶子发黄了
  B：少浇点水试试，前阵子雨多
  A：我晚点换个位置，看看会不会好些
  B：那就行，别让盆一直积水
  A：想问问验收那份的进展，也好提前安排一下。
  B：验收那份都按统一顺序处理，我只能看流程到哪一步。
  A：咱们平时在一个组，就是想当面谢谢你平时照应。
  A：你晚饭吃啥
  【6月12日】
  B：煮面吧，回来晚了
  A：加个蛋就行，别只吃泡面
  B：知道啦，冰箱还有青菜
  A：我回家就煮，十分钟搞定
  B：不错，青菜别忘了洗
  B：吃饭可以，带东西就不用了。
  A：我给你带了张购物卡，面值没问，节前一点心意。
  【系统消息】A 向 B 转账 300 元，已收款。
  A：今天路上堵不堵
  B：桥那边在修路，有点慢
  A：我绕小路走了
  【6月13日】
  B：明早我也早点出门
  A：我把导航收藏一下
  B：好，明早看路况再决定
  B：私人给的我不能留，单位统一发的福利卡才按公司规矩登记。
  A：我那份验收那份，能不能有消息时帮我留意一下？
  A：你上次说的鞋到了吗
  B：到了，码数刚好
  A：那不错，走路舒服不
  B：还行，先穿两天看看
  A：那先穿着试试，不磨脚就好
  B：对，走多了再看
  【6月14日】
  B：我不能因为认识或收礼就给谁调顺序，都是照同一套要求办。
  A：嗯，我知道，就是问问。
  B：你把东西拿回去，按正常流程等通知。
  A：周末要不要去逛书店
  B：可以啊，下午人少点
  A：那我把地址发你
  B：收到，顺便喝杯咖啡
  A：正好我也想买支笔
  A：前两天提的验收那份，现在有消息了吗？
  B：我会按提交顺序看，有变化走正常通知，不会单独插队。
  A：明白，那就照规矩来。卡我带回去。
