  B：不用特意，按流程来就行
  B：年会合唱定了三首歌
  A：都是老歌吗
  B：一首老歌，两首新歌
  A：多练几遍就不怕忘词
  【12月19日】
  B：最近在准备年会，节目还没定
  A：你上次唱歌不是挺好，报个合唱吧
  B：我怕忘词哈哈
  A：大家图开心，不用紧张
  B：那我问问同事有没有人一起
  A：对了，明天下午咖啡店见十分钟
  A：年底快递是不是特别慢
  B：是，我买的桌布还在路上
  A：最近物流都堆着
  B：不急，过两天再看
  【12月22日】
  A：卡给你了，你收着，别问面值
  B：这个我不能收，单位有规定
  A：就节日人情往来，别想太多
  B：我可以收公开的公司福利，个人送的还是不合适
  A：你帮我看过材料，我就是感谢一下
  B：相关事情我会按流程处理，不因为这个改
  B：我妈让我买点坚果寄回去
  A：挑无盐的，她血压高
  B：记下了，周末去超市
  A：别买太大包，容易放软
  【系统消息】A 向 B 转账 500 元，已收款。
  【12月23日】
  A：上次那份申请进度有消息吗？
