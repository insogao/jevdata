  A：卡的事你考虑好了没
  B：我已经退回了，按规定不能收
  A：短信我看到了，事情就拜托你了
  B：我会照流程办，礼物和申请分开
  A：跨年你们怎么安排
  B：应该在家吃饭
  A：清静点挺好
