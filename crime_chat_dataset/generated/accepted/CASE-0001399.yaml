conversation: |-
  【8月2日】
  A：小敏 你在票务那边上班对吧
  B：嗯 咋了
  A：能帮我查个人不 他这礼拜飞哪了
  B：查别人的? 这不行吧 有规定的
  A：我知道不合规 就查一次 我实在没别的办法了
  B：出啥事了 你先说
  A：我怀疑他外面有人 想知道他去哪了
  B：……你把他名字和大概日期给我
  A：名字我发你 就这两天 最好今天之前
  【8月3日】
  B：我早上一查 他昨天飞了趟南边
  A：南边? 和谁一起的
  B：座位挨着一个人 我再看看是谁
  A：对 我就想知道这个 同行的到底是谁
  B：你别激动 我看看能不能拉出来
  A：拜托了 这事对我太重要
  A：中午吃不下饭 一直等他消息
  B：你先吃饭 我午休帮你弄
  A：吃不下 你快点
  B：急也没用 系统不是我一个人管
  B：查到了 同行的是个女的 登记的另一个名字
  A：我就知道 那他们住哪
  B：住哪我这儿看不到 得从酒店系统
  A：你不是有内部系统吗 帮我想想办法
  B：你别得寸进尺 查航班已经够冒险了
  A：我晚上睡不着 你要什么条件都能说
  B：不是条件的事 是风险
  A：我懂 我不会连累你
  【8月4日】
  B：我找了个朋友 能看酒店的 但要花钱
  A：钱不是问题 多少
  B：你等消息吧 别催
  B：搞到了 截图我发你
  A：谢谢你 真的
  B：截图你别往外发 也别跟人说是我给的
  A：放心 我一个人看
  A：中午也没胃口 先转你点辛苦费
  【系统消息】A 向 B 转账 1500 元，已收款。
  A：转你了 一点心意 别嫌少
  B：收到 但下不为例 这事太危险
  A：知道 我就这最后一次
  B：我把聊天记录清了 你也清
  A：我留个截图做证据 别的删
  B：你还想干嘛 别去闹
  A：我自己有数
  【8月5日】
  B：你今天请假了? 没看你上班
  A：嗯 在家躺着
  B：想开点 别做傻事
  A：不会 就想静一静
  A：下午去我妈那待几天
  B：那挺好 换个环境
  A：嗯 谢谢你这两天
  B：以后这种事别找我了 我压力大
  A：好 不找你了
