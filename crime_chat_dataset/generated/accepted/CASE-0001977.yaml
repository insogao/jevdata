conversation: |-
  【3月10日】
  A：老朋友，节前喝杯茶聊聊，你哪天有空？
  B：我看看安排，怎么了？
  A：耳机的声音恢复了吗
  B：清了下灰，好多了
  A：那就不用换新的
  B：先用两天观察下
  A：我把耳机盒也充上了
  B：这样路上就够用
  A：今天听歌没断过
  A：我之前交的活动报名材料还想问问进度，后面好安排。
  B：这类材料都按时间顺着看，我不方便替谁单独调整。
  A：你之前说能帮我带句话，节前想当面谢谢你。
  A：楼下那棵桂花开了吗
  【3月11日】
  B：开了，晚上挺香的
  A：路过时我也闻到了
  B：今年开得比去年早
  A：我拍了张照片
  B：发我看看呀
  A：晚上灯下颜色更好看
  B：见面没问题，别专门准备东西。
  A：本来想带张购物卡，面值没看，想节前送给你。
  A：早上公交挤不挤
  B：还好，我坐了前一班
  A：提早十分钟确实好些
  B：我明天也试试
  【3月12日】
  A：我看了下实时到站
  B：省得站台等太久
  A：对，天气热不想多等
  B：单位发的福利卡要按单位的办法登记，私人送的我不收。
  A：我那份活动报名材料到你手上时，方便帮我留意下吗？
  A：你买的咖啡豆是哪种
  B：中度烘焙的，不太酸
  A：我也喜欢这种
  B：下次给你分一点
  A：我这包还挺香的
  B：闻着像坚果味
  A：是的，早上现磨
  B：我只按统一顺序跟进，不会因为礼物或熟悉就提前。
  【3月13日】
  A：好，我就是问问，没别的意思。
  B：卡先别带来，后续按正常通知走。
  A：阳台的小番茄熟了吗
  B：还青着呢，再晒两天
  A：别着急，熟了才甜
  B：嗯，我先不摘
  A：我给它搭了个小架
  B：枝条不容易倒
  A：我明天也搭一个
  A：上次提的活动报名材料有新进展了吗？
  B：有更新我会照平时的方式通知，顺序不变。
  A：明白，那卡我就不带了，节前正常见面。
