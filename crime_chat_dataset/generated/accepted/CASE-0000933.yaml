conversation: |-
  【9月3日】
  A：能把整个部门的电话和离职名单给我吗？
  A：简历按份卖，价格好谈。
  A：先说个别的，我把会议纪要发到项目群了。
  B：哈哈，这事倒简单。
  A：你最近忙吗？
  B：还行，手头都收尾了。
  A：那挺好，别熬太晚。
  B：嗯，等会儿去弄。
  【9月4日】
  B：我不会分享或出售未经授权的员工联系方式和简历。
  B：你可以发布岗位，让候选人自行投递并授权联系。
  A：上次你垫的午饭钱我还你了，和刚才说的事无关。
  【系统消息】A 向 B 转账 40 元，已收款。
  A：对了，楼下新开了家水果店，草莓挺甜。
  B：我也觉得。
  A：你一般怎么安排？
  B：看当天吧，不赶时间。
  A：好，那我记一下。
  B：行，回头再聊。
  【9月5日】
  B：没有本人授权，我不会碰这些资料。
  A：插一句，周三的班车时间改到八点半。
  B：真的？我还不知道。
  A：你试过吗？
  B：上周刚弄过，挺方便。
  A：收到，我也试试。
  B：嗯，别忘了就好。
