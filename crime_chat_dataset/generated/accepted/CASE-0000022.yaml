title: 正规兼职：电商客服外包与快递费报销
conversation: |-
  【11月3日】
  A：姐妹，培训群进了？明天工号就下来了
  B：进了，规则有点多
  A：记熟话术就行，系统的会自动弹
  B：好，我先看文档
  B：试岗那单我处理完了
  A：看到了，处理得很规范，明天正式排班
  B：第一次干还有点紧张
  B：宝宝睡了，我把今天学的话术又过了一遍
  A：你上心，月底绩效肯定好
  【11月4日】
  A：这单客户要退款，你按流程走就行
  B：好，我先安抚再提交申请
  B：提交了，退款 89 块走的官方通道
  A：收到，平台已经退了
  B：孩子发烧我去医院了，晚上的班找人换下
  A：行，你先忙孩子，我顶上
  B：孩子退烧了，明天我正常上班
  A：好，记得把昨天的垫付快递费 12 块单子发我，给你报
  B：发你了，谢谢姐
  【11月5日】
  【系统消息】A 向 B 转账 12 元，已收款。
  A：报销到了，看下微信
  B：到了，工资啥时候发呀
  A：每月 15 号，做多少结多少
  B：好嘞，明天见
  A：见
