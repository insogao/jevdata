conversation: |-
  【1月20日】
  林工：陈工，节前想跟你约个便饭，最近辛苦啦。
  陈工：好呀，最近确实一直在忙。
  林工：快过节了，想当面打个招呼，也顺便问下负责登记合作方资料。
  陈工：可以啊，明天下班后我有空，别特意准备什么。
  林工：好，那我订个附近的家常菜馆，带份小小的节日心意。
  A：这两天风挺大的
  B：早上出门差点把伞吹翻
  A：我这边还好 就是晚上降温
  B：我妈非让我穿厚点 哈哈
  A：最近预报说周末晴
  B：那正好可以洗晒被子
  陈工：吃饭就行啦，别客气。
  A：你最近还开车上班吗
  B：没呢 地铁快一些
  A：我也是 停车位太难找了
  B：下雨天打车又堵
  A：我现在提前一站下走过去
  B：挺好 当锻炼了
  【1月21日】
  A：最近颈椎还酸吗
  B：好点了 少低头就好
  A：我也在练拉伸 每天十分钟
  B：能坚持就不错
  A：晚上早点睡也有用
  B：知道啦 这周争取不熬夜
  林工：我到了，在门口等你。
  陈工：我刚下楼，看见你了。
  林工：顺手把一张购物卡给你，没特意讲面值，就是节日问候。
  【系统消息】B 向 林工 转账 135 元，已收款。
  陈工：你太客气了，心意我收下，下回别专门带东西。
  陈工：这顿咱们分一下，我把我那份转你，省得每次你抢着付。
  林工：收到啦，那就各付各的，下次我再约你。
  【1月22日】
  A：你爸妈今年过节来这边吗
  B：我爸说看天气再定
  A：老人家路上别太赶
  B：是啊 我给他们把车票看好了
  A：家里缺啥我再买点
  B：不用买太多 他们总嫌占地方
  林工：上次聊到我那份申请/材料，后续有空时帮我留意一下进度就好。
  陈工：收到的材料还是按正常顺序走，有消息会按通知联系你。
  林工：明白，我就是问问流程，节前辛苦了。
  陈工：不客气，缺什么材料会统一通知，安心等消息。
