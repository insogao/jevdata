  A：我记在手机里了
  B：到时候提醒自己
  B：材料都是按顺序往下走，我只能照着统一办法处理。
  A：你平时挺关照我，过节前想当面谢谢你。
  B：见面可以，东西真不用带。
  A：那个旧相册找着没
  B：在柜子最下面
  A：有空翻翻看
  B：我找到小时候的照片了
  A：有张照片挺模糊的
  B：但还能看出来是谁
  A：我扫描一下试试
  A：我给你带了张购物卡，面值没看，节前一点心意。
  【系统消息】A 向 B 转账 300 元，已收款。
  【4月23日】
  B：单位发的福利卡按单位办法登记，私人给的我不能收。
  A：周日要不要去江边走走
  B：可以，下午不太晒
  A：带上水就行
  B：我有个小水壶
  A：我查了天气预报
  B：下午会凉快些
  A：那就两点以后吧
  A：我那份转岗申请，你有空时帮我留意一下可以吗？
  B：不管咱们什么关系，我都只能按原来的顺序办。
  A：嗯，明白，我就是问问。
  A：最近开的那家水果店如何
  B：价格还行，桃子挺甜
  A：那我下班也去看看
  B：晚点去选择多些
  A：我买了两只尝尝
  B：挑软一点的
  A：嗯，放厨房了
