conversation: |-
  【4月1日】
  A：今天公交改线了
  B：我早上多走了十分钟
  A：地铁也能到
  B：明天我试试
  A：记得看站牌
  A：我先记下，之后再跟你说。
  B：好，忙完再说。
  A：手里有些旧的人事资料，想问你有没有兴趣。
  B：这些资料里有同事的联系方式和简历吗？
  A：有一整批部门联系方式，还有简历和离职名单。
  B：这涉及个人信息，没有本人同意不能卖。
  A：有人愿意按份收。
  B：我不会买、转发或帮你联系买家。
  A：那我先放着。
  B：请停止传播，并按公司流程删除或交还。
  【4月2日】
  A：食堂今天有蒸鱼
  B：我吃了，味道不错
  A：刺多不多
  B：还好
  A：下次我也点
  A：我先记下，之后再跟你说。
  B：好，忙完再说。
  A：上次午饭拼单的一百二我转你了。
  【系统消息】A 向 B 转账 120 元，已收款。
  B：收到，正好是午饭钱。
  【4月4日】
  A：中间人还在问那批资料。
  B：我已经说过不参与。
  A：他想先看一小部分。
  B：不要发送任何员工信息或简历。
  A：我不发了。
  B：如果资料来自单位，应交给隐私或人事负责人处理。
  【4月5日】
  A：你爸复查怎么样
  B：医生说挺稳定
  A：那就放心了
  B：他最近散步多了
  A：很好
  A：我先记下，之后再跟你说。
  B：好，忙完再说。
  A：我把那份文件交回公司了。
  B：谢谢，后续请勿保留副本。
  A：我也告诉对方不再联系。
  B：好，员工信息只能在授权范围内使用。
  A：明白。
  B：有正当招聘需求可以走公开渠道。
