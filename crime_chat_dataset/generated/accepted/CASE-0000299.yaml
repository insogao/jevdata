  B：对，还是那张老卡
  A：那这两天就安排，别走公司，私下给我
  B：知道，个人对个人
  A：公司组织秋游，你去不，就爬个后山
  B：你们家属院后山那个？有索道没
  A：没有，全程腿儿着，两小时登顶
  B：那我去不了，膝盖不好，我在山下给你们看包
  A：哈哈行，给你带瓶山泉水
  B：再带俩野果，之前你带那酸甜口的不错
