  【10月14日】
  A：张经理，预算批下来了，460万，这周关账前要出询价
  B：好，参数就按上次那份？
  A：嗯。还有，这批就你们一家能做，别家体系对不上，你懂的
  B：明白，独家供应，价格我报得体面点
  A：报到440左右，留点余地，评审那边我去说
