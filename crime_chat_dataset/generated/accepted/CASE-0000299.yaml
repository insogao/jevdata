  A：够拼的，中午食堂将就一哈
  B：行啊，听说你们食堂卤肉饭一绝
  A：那是招牌，走，给你多打一勺
  B：哈哈那我可就不客气了
  【10月15日】
  B：报价单发你了，438万
  A：收到。发票记一下，品名开“设备技术服务费”，明细别拆那么细，统一大类
