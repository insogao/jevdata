conversation: |-
  【6月10日】
  A：周姐 孩子工作的事考虑得咋样了
  B：还在看 现在考试太难了
  A：我这边有内部名额 就差最后一个了
  B：内部名额? 靠谱吗
  A：我做了八年了 送进去的孩子没有一百也有八十
  B：要多少钱
  A：这个数 先交一半定金 剩下的入职再补
  B：得先签个合同吧
  A：先交后签 我们这行都这样 合同是走个形式
  B：中午跟孩子他爸商量了下 他不太信
  A：不信很正常 等入职了你就知道我是干嘛的了
  B：那笔试面试呢 孩子成绩一般
  A：走过场 题我都打过招呼了 别紧张
  【6月11日】
  B：名额真的只剩一个了吗
  A：骗你干啥 昨天还有人要 我先给你留着
  B：那我交定金 你别给我弄丢了
  A：放心 你转我 我今天就把名单报上去
  【系统消息】B 向 A 转账 20000 元，已收款。
  B：转过去了 20万的一半 剩的入职给
  A：收到 合同我下午发你电子版 你签个字就行
  B：好 我等你
  B：中午没啥胃口 一直盯着手机
  A：别急 走流程要几天
  B：我就怕耽误了
  A：耽误不了
  【6月12日】
  A：对了 你妹妹家孩子不是也毕业了吗
  B：是啊 她也愁
  A：拉她一起报 一起报我给你各减五千
  B：这还能团购?
  A：名额是我手里的 我想给谁给谁
  B：我妹说再看看 她怕是骗子
  A：她不信算了 反正名额不等人
  B：合同收到了 我签了发你
  A：收到 接下来等笔试通知 到时候我告诉你几号去
