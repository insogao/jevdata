conversation: |-
  【10月9日】
  A：老白?张哥介绍来的,说你这边现金方便。
  B：对,一直做这个。你量多大?
  A：先小走一单,五千个上下,啥价?
  B：7.16,所里才7.13。周三交U,周五现金,老规矩。
  A：高三分,可以。定金怎么给?
  B：首单两千锁价,周五面交时算进货款。
  B：你那边今天下雨没?我这边涝了半天。
  A：下午下了一阵,闷得很,地都不干。
  B：明天还有雷阵雨,出门带伞。
  A：好,车正好保养,顺路买两把。
  B：你们那雨季还没完?
  A：早该完了,这雨下得没完没了。
  【10月10日】
  【系统消息】A 向 B 转账 2000 元，已收款。
  A：定金转了,价就锁到周五。
  B：收到,周三上午十点划U,我盯着。
  B：你家那只橘猫还拆家不?
  A：新沙发俩抓痕,气得我想炖了它。
  B：哈哈,我家那只咬断我三根数据线。
  A：猫粮钱都够我半张沙发了。
  B：改天约个猫友局,交流下主粮。
  A：行,只要别让我家猫听见,哈哈。
  【10月11日】
  A：划了,五千个,你盯一下。
  B：到账,账对上了。周四我把现金备出来,周五上午茶楼包间,当面点钞,点完两清。
  B：包间那款蜜兰香给你留着,你懂行。
  A：就爱单丛,别拿普洱糊弄我。
  B：放心,老茶客的口粮,我懂。
  A：周五正好带两泡给张哥,他引荐的人情。
  B：应该的,人情要走动才亲。
  A：回头你也来我那边坐坐。
  【10月12日】
  B：现金备好了,三万六,整捆,你带个袋子来。
  A：你上次链接那双跑鞋我买了,今天到。
  B：码正不?
  A：正,半码大,跟踩棉花似的。
  B：那双适合你天天暴走。
  A：昨天两万步,真不累。
  B：下次上新我再甩你链接。
  【10月13日】
  B：到哪了?我在包间,茶泡上了。
  A：停好车就到,五分钟。
  B：三万六,当面点钞,你慢慢数。
  A：点完了,分毫不差,两清。
  B：你最近练得勤,胳膊都紧了。
  A：一周三练,出出汗,睡得香。
  B：哪天带我练练,别嫌我菜。
  A：菜怕啥,谁不是从菜过来的。
  B：那说定了,下周二晚上。
  A：行,地点发你,先从腿练,哈哈。
  【10月14日】
  A：昨天那单舒服,价比所里划算,以后常走。
  B：行,量大再给你优半分,下周三老时间。
