conversation: |-
  【8月21日】
  A：表弟，节前你哪天方便？节前见一面，顺便把东西给你
  B：这两天事情有点多，怎么突然想见面？
  A：想问问摊位那份的进展，也好提前安排一下。
  A：周末要不要去逛书店
  B：可以啊，下午人少点
  A：那我把地址发你
  B：收到，顺便喝杯咖啡
  A：正好我也想买支笔
  B：那家文具区挺全的
  【8月22日】
  A：顺路看看吧，不急
  B：摊位那份都按统一顺序处理，我只能看流程到哪一步。
  A：咱家里人之间，就是想当面谢谢你平时照应。
  B：吃饭可以，带东西就不用了。
  A：你家猫还挑食吗
  B：好多了，换了新粮
  A：别一下换太多吧
  B：嗯，我掺着旧的喂
  【8月23日】
  A：旧粮我还留了一点
  B：慢慢掺就好，别换太突然
  A：那张卡你先收着，里面多少我没看，节前一点心意。
  【系统消息】A 向 B 转账 300 元，已收款。
  B：私人给的我不能留，单位统一发的福利卡才按公司规矩登记。
  A：这两天降温了
  B：早上出门差点穿少
  A：我把薄外套找出来了
  【8月24日】
  B：我也是，晚上风挺凉
  A：晚上回去把外套挂门口
  B：挺好，早上不容易忘
  A：那天说的那份，你有空时帮我看一眼就行。
  B：我不能因为认识或收礼就给谁调顺序，都是照同一套要求办。
  A：嗯，我知道，就是问问。
  A：冰箱是不是该清一下
  B：昨天剩菜我都装盒了
  【8月25日】
  A：放太久的就别留了
  B：放心，今天就吃掉
  A：那盒汤我今晚热掉
  B：别放太久，注意闻一下
  B：你把东西拿回去，按正常流程等通知。
  A：前两天提的那件事，有空帮我瞅一眼进度？
  B：我会按提交顺序看，有变化走正常通知，不会单独插队。
  A：明白，那就照规矩来。卡我带回去。
