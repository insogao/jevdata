conversation: |-
  【9月3日】
  A：相机还要不 平台上那个链接我先下架了
  B：要啊 你怎么下架了
  A：平台上问的人太多 我想留给你 加个微信细聊
  B：行 我加你
  A：机子九成新 快门才三千多 发票盒子都在
  B：行情一万二 你卖六千五 有点太便宜了吧
  A：急用钱 亏本出 不信你去查价格
  B：那为啥不走平台 平台有保障
  A：平台抽成高 到手少好几百 咱私下都省点
  B：东西靠谱吗
  A：靠谱 我一直玩摄影的 你翻我朋友圈
  B：今天下班下雨 堵死了
  A：我这也下 收摊都晚了
  B：你下班挺晚啊
  A：做小生意的 没办法
  B：注意别淋着
  【9月4日】
  A：哥 你要的话得交点定金 别人也在问
  B：定多少
  A：五百 我给你留着 三天内发货
  B：五百走微信?
  A：对 微信方便 定金到了我就把帖子彻底删了
  B：那尾款呢
  A：尾款到付 收到货再给 你放心
  B：行 那我转你
  【系统消息】B 向 A 转账 500 元，已收款。
  A：收到 这机子就是你的了 我晚上打包
  B：你家那猫还养着吗
  A：养着呢 天天拆家
  B：我家孩子也想要 他爸不让
  A：养了就知道累了
  B：还是你潇洒
  【9月5日】
  A：包裹发了 单号发你
  B：好 我查下
  B：这单号查不到啊 是不是录错了
  A：可能网点还没揽收 你再等等
  B：中午吃啥了
  A：下了碗面 凑合
  B：我等单号等得没心思做饭
  A：别急 物流慢是常态
  B：到现在还是没记录啊
  A：我这边显示已发货 系统慢 明天就有了
  【9月6日】
  B：单号还是查不到 你到底发没发
  A：发了 可能快递把单子弄丢了 我再问网点
  B：你要是没货就把定金退我
  A：货肯定有 你等我消息 我今天就去网点问
  B：这话你说了两天了
  A：哥你别催 我比你还急
  B：有结果了吗
  A：网点说件在分拨 让我明天再来
  B：我再等你一天
