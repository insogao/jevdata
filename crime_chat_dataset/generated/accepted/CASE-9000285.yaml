title: other_illicit_coordination/homework_ghostwriting_ring
conversation: |-
  【12月8日】
  A：表弟，降温了吧，你们办公室空调舍得开没？
  B：开了，但暖气片是摆设，我裹着军大衣改论文。
  A：哈哈哈哈，给师弟们留个好形象。
  B：形象值几个钱，暖和要紧。
  A：你上次感冒好利索没？妈还念叨你咳嗽。
  B：好了，就是晚上改稿改太晚，又有点鼻塞。
  A：让你熬夜！妈说让你买点梨炖着。
  B：知道了知道了，家里那箱梨还剩仨。
  A：说正事。你那个「论文门诊」还接单不？我这边有个学妹，开题被导师打回来两次，急得睡不着。
  B：接啊，让她把开题报告和导师的批注意见都发来，我看看是思路问题还是格式问题。
  A：我让她今晚整理好发你。说好，先小人后君子，你咋收费？
  B：先看材料再报价，不看不报，这是规矩。
  A：行，规矩挺正。
  B：必须的，咱做的是手艺活。
  A：对了，今年考研人数又降了，你们学院招生紧不紧？
  B：还行，我们方向还算热，导师今年又要了俩。
  A：那我让我侄子好好学，以后投奔你。
  B：让他先学高数，别到时候我救不了。
  【12月9日】
  B：学妹材料我看了，问题不大，思路是有的，就是文献综述偷懒，方法那章没写透。
  A：那能救不？
  B：能。这样：框架我帮她重新搭，批注三轮，她自己改。全套辅导1500一篇，含查重——润色完我保她压到8%以下，过不了线退钱。
  A：你这是「查重我保过」啊，口气不小。
  B：我改了五六年了，手上有数。但丑话说前头：纯代写我不接，谁介绍都不接，别给我挖坑。
  A：知道知道，同学圈里那种「一条龙」我才不给你介绍，我就要你这种批注式的。
  B：那就成。让她这周把重写的第二章发我。
  A：家里开始灌香肠腌腊肉了，你那份给你留着，过年带回去。
  B：婶子手艺没得说，去年那批我室友抢着吃。
  A：那就多腌点，你这口福值钱。
  B：嘿嘿，回头给你寄点我们学校后山的茶。
  A：学妹问能不能快一点，她导师月底要中期检查。
  B：批注周三前给她。但稿子得她自己改，一个字一个字过，不然答辩一问就露馅。
  A：我跟她说。
  B：还有，别拿我的批注当答案抄，她得明白为什么这么改。
  【12月10日】
  A：学妹凌晨两点还在改，发朋友圈了，配文「重生之我在改综述」。
  B：哈哈，年轻真好，熬得动。
  A：她说批注比她导师还细，就是有点怕你。
  B：怕就对了，批注狠是为了她好。
  A：你春运票抢了吗？
  B：抢了，腊月二十八的高铁，就是折腾。
  A：回来直接来家吃饭，妈说给你留腊肉。
  B：必须的，我还惦记那口萝卜炖羊肉。
  A：对了，学妹她导师那关，你有没有门路递个话？她怕中期检查又被劈。
  B：她导师跟我导师是球友，我周末饭局上可以提一嘴「这学生最近很拼」。就这一句，算润滑，不算打招呼，改稿子的活还得她自己干。
  A：够了够了，有个好印象比啥都强。
  B：但你也跟她讲清楚，导师真指出硬伤，还得老老实实改，没人能替她答辩。
  A：她明白，就是心里没底，想求个稳。
  B：稳就来日方长，学问没有捷径。
  B：昨晚那场球看了没？最后那脚绝平，我嗓子喊哑了。
  A：看了！我就说你别提前退，非要去洗漱。
  B：亏得没退，不然得后悔一年。
  【12月11日】
  A：报喜！学妹开题过了，导师评语「进步显著」，截图发你了。
  B：看到了，替她高兴。让她把文献那章再顺一遍，中期还得用。
  A：她说要给你寄锦旗，哈哈哈。
  B：别，寄箱橙子就行，润喉。
  A：毕业季我手上还有五六个单子，老价格，一篇一千五？
  B：辅导可以。但你在外面宣传把词给我拿捏好：「论文批注辅导」「润色降重」，别给我写「包过」「代写」，那是要砸饭碗的事。
  A：懂，我都说「博士一对一辅导」，也算实话。
  B：行，单子发来，我按排队顺序接。期末事多，一次别超三个。
  A：你们学校食堂对外的窗口开放不？我去蹭那个八块钱的糖醋里脊。
  B：刷校友卡能进，你的卡过期没？过期我给你借个师弟的。
  A：哈哈哈，那周末就去，顺便看看你这条「论文门诊」的门脸。
  【12月12日】
  B：早上顺，今天第二条批注发学妹了，她回了个「痛并快乐着」。
  A：她快乐就说明你手下留情了。
  B：第三条周日给，让她抓紧。
  A：对了，费用那块，学妹想走淘宝拍「资料整理服务」，行不？
  B：让她直接转你，你收了再给我结算就行，我不跟客户直接走钱，省得说不清。
  A：也行，那她这周先把这单的1500给你结了？
  B：服务完三期批注再结，按老规矩，先干活后收钱。
  A：你这做派，难怪回头客多。
  B：晚上食堂换了新师傅，麻辣香锅排队二十米。
  A：流口水。周末我带橙子去蹭饭，顺便把学妹下一单的材料给你。
  B：成，再帮我把篮球带上，吃完打半场。
  A：好嘞，腊肉换辅导，橙子换批注，咱这亲缘经济链拉满了。
