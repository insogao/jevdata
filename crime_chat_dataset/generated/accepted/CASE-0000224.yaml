  A：收到了，名额从现在起就是丫头的
  B：唉，钱花出去我这心里才算落一半
  【8月22日】
  B：给你寄了两箱阳光玫瑰，孩子他舅园子里摘的
  A：客气了客气了，回头我这边的新茶给你留着
  B：哈哈你这来而不往非礼也用得好
  A：做人嘛，就是相互想着
  A：材料模板我微信发你，让她照着一字一句写
  B：好，晚上就让她改
  A：笔试那天别紧张，正常发挥就行
  B：场子里真有照应？
