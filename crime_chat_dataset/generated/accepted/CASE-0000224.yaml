  B：模板？履历还能用模板？
  A：表述上的事，突出匹配度，专业的来
  【8月21日】
  A：我后天去你那边，顺道把协议签了
  B：来了一定来家里吃饭，让你尝尝嫂子做的藕汤
  A：藕汤免了，正事要紧，吃完就走
  B：费用咱先对个数，别到时候扯皮
  A：一共六万八，含全部环节，录用通知下来再结尾款
