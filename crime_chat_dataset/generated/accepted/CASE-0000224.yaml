  A：市里那个参公的事业单位，今年就放两个名额，一个已经内部定了
  B：那就剩一个了？
  A：对，名额就剩一个，你要，这两天就得定下来
  B：丫头倒是很想要个稳定岗，今年硕士毕业，考了两回都没上
