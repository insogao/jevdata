  B：人才引进不是也有笔试面试吗
  A：形式不一样，回头细说，你先跟家里通个气
  B：好，中午我给孩她妈打电话
  A：午了吗，最近这桑拿天，出门五分钟流汗两小时
  B：谁说不是，我仓库里四十度，跟蒸笼一样
  A：你们建材生意现在是旺季吧，装修的多
