  A：底就是：定金转了，名额锁死，协议我后天当面跟你签
  B：……行吧，生意场上我也懂，占位费嘛
  B：笔试面试总得过吧，丫头底子一般
  A：笔试就是走过场，题不难，别有心理负担
  B：面试呢？她见了生人就结巴
