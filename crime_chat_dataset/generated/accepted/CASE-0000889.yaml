  B：我看到门口贴了新海报。
  B：再放几天，最近天气不稳。
  A：不用标名字，家长能认出来。
  A：有空可以去尝尝。
  B：不行，仍然属于未经授权的分享。
  B：等我这周忙完。
  A：那我让家长走正式流程。
  B：请这样做。
  A：今天公交来的挺快。
  B：楼下的咖啡机修好了没？
  B：我也没等多久。
  A：修好了，今天早上我试了一下。
  B：那午休我去买一杯。
  A：省下来的时间正好买早餐。
  A：好像还换了新的豆子。
  【13月8日】
  A：谢谢提醒。
  B：不错。
  B：我会按学校规定处理。
  A：以后不再私下问了。
  A：家里的台灯灯泡要换了。
  B：好。
  B：挑个亮度柔和的。
  A：我周末去看看。
  B：别买太冷白的。
  A：手机空间快满了，我得整理照片。
  B：把不重要的删掉就行。
  A：我先从截图开始。
  B：这样会快很多。
