  poacher：下回我也去
  A：周末家里说想吃火锅
  B：我可以带点蘑菇过去
  A：别买太多，冰箱都满了
  B：行，那我带饮料就好
  【9月4日】
  poacher：对方说不需要完整资料，电话就可以
