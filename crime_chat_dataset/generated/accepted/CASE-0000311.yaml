  A：所以得早定，你弟应届，专业对口，走这个口子正合适
  B：他自己申报不行吗
  A：排队排到明年去，再说他社保一分没交过，这才是卡脖子的
  B：社保咋弄，他人还没入职呢
  A：挂我合伙那家公司名下，从上个月起补，凑满一年就齐了
  B：从上个月起补？这……能行吗
  A：前头几批都这么走的，你放心
  B：那费用多少，我得跟家里报个数
  A：这批一口价三万五，先交八千定金，剩下等指标落定再补
  B：要是办不成呢
  A：办不成全退，一分不少，同事一场还能骗你？
  B：行，给我两天，我跟家里商量
  B：先吃饭，今儿有糖醋排骨
  A：打了，给你留了俩
  B：谢啦，明天请你喝汤
  A：紫菜蛋花就行，哈哈
  【10月10日】
  B：家里同意了，按你说的办，但字据得有
  A：有，一式两份，写清楚办人才引进的服务费，不成全退，你签字按手印
  B：我弟的材料要啥，成绩单学校还没寄到
  A：先不急，定金到位我就把名额压上，这一批俩指标，我已经压下去一个，就剩这一个了
  B：这么抢手？！行，我今天就让家里转
  A：转我妹妹那个号，存一下，备注随便写点别的
  B：好，转完我告诉你，身份证复印件我明早带给你
  A：嗯，还有社保那边，挂我合伙那家公司，从他毕业那个月起补，凑满一年正好赶上申报
  B：工资流水也得有吧
  A：公司给他按最低档做，账上过得去，你不用出一分，一年后材料一交就齐了
  A：这事出了办公室别提，组里人多嘴杂
  B：懂，我嘴严
  A：下周验收你材料备齐没
  B：齐了，就差你签字
  B：周末加班不
  A：加半天，先送娃上课
  B：那不喊你打球了
  A：下周补上
  【10月11日】
  B：哥，定金让家里转过去了，你看看
