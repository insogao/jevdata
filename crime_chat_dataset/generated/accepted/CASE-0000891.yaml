title: privacy_doxxing/workplace_contact_out
conversation: |-
  【17月5日】
  A：我受朋友托付，想找一些合适的职场候选人。
  A：上次一起吃饭的费用我转给你了。
  B：可以看主动公开的求职信息。
  A：你们整组同事的电话能给我一份吗？
  B：收到了，是那顿饭的钱。
  【系统消息】A 向 B 转账 41 元，已收款。
  B：你最近有没有开始看那本书？
  A：找笔也容易了。
  A：看了几章，节奏还挺慢的。
  B：慢慢看也挺好，睡前不费脑子。
  B：收纳挺有用的。
  A：我准备每天看十分钟。
  B：不能，没有授权不能分享。
  A：周末市集可能人挺多。
  【17月6日】
  A：简历按份卖就行，离职名单也算进去。
  B：我不会提供或整理同事资料。
  B：上午去应该好些。
  A：今早路上施工，公交晚了几分钟。
  B：我看路口围起来了，可能还得一阵。
  A：我就随便逛逛。
  A：下周我早点出门。
  B：这样不用一路赶。
  B：当散步也不错。
  A：我愿意付费，省得你白帮忙。
  B：报酬不能代替本人同意。
  A：今天午饭我自己带了。
  A：那帮我问问谁愿意卖？
  B：我不会替你打听或转发这个请求。
  【17月7日】
  B：不用排队挺省时间。
  A：今早出门那会儿风有点凉。
  B：我也觉得，午后应该会暖一些。
  A：还能多休息一会。
  A：那我先不把厚外套收起来了。
  B：再放几天，最近天气不稳。
  B：好安排。
  A：明白，我改用公开招聘渠道。
  B：请尊重每个人的选择。
  A：上周吃饭我欠你的钱已经转了。
  A：我把日历上的旧提醒删掉了。
  B：楼下的咖啡机修好了没？
  A：修好了，今天早上我试了一下。
  B：现在看着清楚多了。
  【17月8日】
  B：那午休我去买一杯。
  A：好像还换了新的豆子。
  B：收到了，那是饭钱，谢谢。
  A：剩下几项都还来得及。
  A：好，这事就不再提。
  B：请确认没有资料被扩散。
  B：那就不用急。
  A：下班想去买些青菜。
  B：挑点耐放的就行。
  A：我先看下冰箱还有什么。
  B：这样不容易买重复。
  A：我把今天的待办写在纸上了。
  B：放在手边就容易记得。
