  B：吃饭可以，东西真不用特意准备。
  A：你家小狗最近还挑食吗
  B：这周好点了 换了个碗
  A：哈哈它还挺会挑
  B：猫也一样 不喜欢就不碰
  A：看来得慢慢试
  B：嗯 先不折腾它了
  A：它现在一听开罐声就跑来
  B：哈哈这个反应很快
  A：我给它买了个新玩具
  B：别一次买太多
  A：对 先看看它玩不玩
  B：有意思就够了
  【9月25日】
  A：你那边月底也要补台账吗
  B：要啊 这周在核一遍
  A：我们刚换了新版表格
  B：我也收到了 看着清楚些
  A：就是填起来多两栏
  B：熟悉了就快了
  A：我把旧表也留了一份
  B：留着对照确实方便
  A：同事说下周要培训
  B：那你到时问清楚版本
  A：行 我先把手头这版弄完
  B：忙完早点休息
  A：我到门口了，你慢慢来。
  B：刚出来，马上到。
  A：这个给你，一张小购物卡，过节图个方便。卡面金额我也没仔细看。
  B：你太客气了，心意我收下，下次别这么见外。
  B：饭钱我分一半给你吧，别总让你请。
  【系统消息】B 向 A 转账 190 元，已收款。
  A：好，收到啦，这样刚好。
  【9月26日】
  A：这几天早晚温差也太大了
  B：是啊 我中午还穿短袖呢
  A：我早上出门带了件外套
  B：带着好 晚上风一吹就冷
  A：预报说明天会晴一点
  B：那我把阳台衣服洗了
  A：我把外套放包里了
  B：这个办法稳妥
  A：刚看窗外又起风了
  B：那你下班慢点走
  A：好 我不赶时间
  【9月27日】
  A：前几天顺带提过的我交的资料，我这边先等着，有空再说哈。
