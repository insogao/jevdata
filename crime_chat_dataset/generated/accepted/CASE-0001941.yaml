  B：这听着不太正规啊
  A：现在都这样 名面上走流程 里头早定了
  B：得多少钱
  A：三十个 先交二十个 剩下的入职后给
  B：三十万?这么多
  A：进这么个好单位值 名额就剩一个了
  B：能不能先签个合同再说钱
  A：先交后签 这行规矩 你不交名额立马给别人
  B：中午吃什么
  A：随便吃点 我下午还要去见人
  B：见谁
