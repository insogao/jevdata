title: privacy_doxxing/workplace_contact_out
conversation: |-
  【10月12日】
  A：合作方要一份整个部门电话和离职名单，先拿给他们。
  B：我不能分享内部员工名单。
  A：简历按份卖也可以，按数量给服务费。
  B：未经授权的简历我不会转交。
  A：刚看到关于团队晨会的通知。
  B：我也收到了。
  A：怎么安排比较合适？
  B：先按原来的来，有变再说。
  A：行，到时互相提醒。
  B：没问题。
  A：我把相关时间记下来了。
  A：你上次说的文件备份定下来了？
  B：定了，时间挺合适。
  A：需要我帮你确认一下吗？
  B：不用，已经安排妥了。
  A：好，那就不打扰你。
  B：没事，谢啦。
  【10月13日】
  A：我负责这个项目，你不用担心。
  B：即便是项目安排，也需要本人同意。
  A：那你让他们先把岗位公开出来。
  A：另外，快递签收安排好了吗？
  B：好了，刚刚确认完。
  A：要改时间吗？
  B：不用，照原来计划。
  A：那省心了。
  B：是啊，这周事情不少。
  A：想起你提到周末休息，有消息了吗？
  B：有，今天处理好了。
  A：顺利不？
  B：挺顺的，没耽误太久。
  A：那不错。
  B：嗯，可以放心了。
  【10月14日】
  B：好，让候选人自愿投递并授权联系。
  A：知道了，名单不发。
  B：谢谢理解。
  A：对了，午餐预订别忘了留时间。
  B：记到日历里了。
  A：你最近忙吗？
  B：还好，周五后能松一点。
  A：也得记得休息。
  B：好，听你的。
