conversation: |-
  【10月17日】
  A：主管，节前找你说两句，你哪天有空？
  A：早上公交挤不挤
  B：还好，我坐了前一班
  A：提早十分钟确实好些
  B：我明天也试试
  A：我看了下实时到站
  B：省得站台等太久
  A：对，天气热不想多等
  B：我看看安排，怎么了？
  A：我之前交的供应商资料还想问问进度，后面好安排。
  A：你买的咖啡豆是哪种
  B：中度烘焙的，不太酸
  A：我也喜欢这种
  B：下次给你分一点
  A：我这包还挺香的
  B：闻着像坚果味
  A：是的，早上现磨
  B：这类材料都按时间顺着看，我不方便替谁单独调整。
  A：阳台的小番茄熟了吗
  B：还青着呢，再晒两天
  A：别着急，熟了才甜
  B：嗯，我先不摘
  A：我给它搭了个小架
  B：枝条不容易倒
  A：我明天也搭一个
  【10月18日】
  A：我记着你之前的提醒，节前想当面谢谢你。
  B：见面没问题，别专门准备东西。
  A：你们家周末去公园吗
  B：可能下午走一圈
  A：带瓶水，最近挺晒
  B：好，我放包里
  A：我把水和帽子备好了
  B：那就不容易晒着
  A：嗯，下午太阳没那么大
  A：本来想带张购物卡，面值没看，想节前送给你。
  A：那本书你看到哪了
  B：看到一半，节奏挺慢
  A：后面会快起来的
  B：那我再读几章
  A：我今晚多看一会儿
  B：别熬太晚就行
  B：单位发的福利卡要按单位的办法登记，私人送的我不收。
  A：你昨晚做饭了没
  B：煮了点粥，简单吃
  A：天热胃口也一般
  B：是啊，先吃清淡点
  A：我明天再煮些
  B：多放点南瓜也不错
  A：我那份供应商资料到你手上时，方便帮我留意下吗？
  【10月19日】
  B：我只按统一顺序跟进，不会因为礼物或熟悉就提前。
  A：你那双雨鞋找到了吗
  B：在鞋柜最里面
  A：下雨天记得穿
  B：嗯，放门口了
  A：还擦干净放好了
  B：鞋底先看看有没有裂
  A：好，我就是问问，没别的意思。
  A：周末球场还有位置吗
  B：下午那场还没满
  A：那我带双备用鞋
  B：好，别太晚到
  A：我六点前就出门
  B：路上可能会堵
  B：卡先别带来，后续按正常通知走。
  A：上次提的供应商资料有新进展了吗？
  A：阿姨最近睡得好些吗
  B：好多了，晚上不咳了
  A：那就继续按时吃药
  B：我帮她记着呢
  A：医生说状态稳定
  B：真好，家里都放心些
  B：有更新我会照平时的方式通知，顺序不变。
  A：明白，那卡我就不带了，节前正常见面。
