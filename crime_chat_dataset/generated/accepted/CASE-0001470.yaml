  A：收到，今晚收拾屋子时放着。
  B：这个安排挺合适。
  B：收到。以后有岗位信息可以发公司招聘邮箱。
  A：好，我不再问离职名单。
  B：谢谢，授权前别碰内部资料。
  A：你今天通勤还顺利吗？
