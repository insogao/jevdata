title: bribery_corruption/intermediary_payment_after_result
conversation: |-
  【10月10日】
  A：周总你好，我是老蔡介绍的郑师傅，说你想了解物流园区那个项目
  B：郑师傅你好，对，我们公司想投标，听说你熟悉园区的情况
  A：我在那边干了十几年基建，园区里里外外都熟，具体情况见面聊
  B：好，明天方便吗，我请你吃饭
  A：明天中午行，就城西那家面馆，简单点
  B：好嘞。对了城西是不是新开了个高铁站，我明天坐高铁过去快一些
  A：对，通车一年多了，你到站打车过来十分钟
  B：那方便多了
  【10月11日】
  A：周总，昨晚回去高铁方便吧
  B：方便，四十分钟就到了。昨天聊的我都记下了，园区的地质资料麻烦你帮忙对接一下
  A：行，资料在档案室，要交两百块调档费，这个我平时都是自己先垫的
  B：该多少是多少，你先垫着，回头一起算
  A：还有投标保证金两万，园区要求开户交，我也可以先帮你垫上，出结果后你补给我就行
  B：那太好了，我们走账还要一周，你先垫上救个急，我给你写个条子
  A：条子要写，亲兄弟明算账嘛哈哈
  B：你周末还去水库钓鱼不，老蔡说你钓龄三十年了
  A：去，每周日雷打不动，改天带你，那里面翘嘴多
  B：成，我买了套新竿还没开张呢
  【10月12日】
  B：郑师傅，投标文件我让小刘送到你那儿了，你帮忙递给园区
  A：收到了，材料齐，我下午就交上去，进度我每天跟你说
  B：辛苦。那评审大概什么时候出结果
  A：快的话三五天，你等等消息
  B：好，有动静随时告诉我，我这边等着定生产计划呢
  A：理解，你订单压着呢嘛
  A：你家闺女今年该毕业了吧
  B：大四了，在实习，说不想回来接班，气人
  A：年轻人有想法是好事，我儿子也是，在外地不愿意回来
  B：哈哈咱俩同命
  【10月13日】
  A：周总，今天园区开协调会，你那个标进了第二轮，就剩两家比方案了
  B：好消息！那你觉得我们把握大吗
  A：你方案里那个仓库改造的报价有优势，我把园区方的关注点也跟你透过了，你照着改
  B：改了改了，昨晚改到两点，就是按你说的那个思路
  A：那就成了，下周出结果
  B：郑师傅，说好的居间服务费八千，我这边都备好了，出结果当天就结给你
  A：嗯，咱先把话说在前面：服务费归服务费，垫的两万零两百另算，两笔别混
  B：清楚，一笔居间费八千，一笔垫付款两万零两百，合同里都写了的
  B：你老家那核桃下树没，去年那箱我吃完了还想再买
  A：正好，我弟这几天在收，给你留二十斤，还是老价格
  B：行，钱跟货一起结
  A：客气啥
  【10月14日】
  B：郑师傅，群里又有人问园区进度，我看群里同行都在
  A：群里别提这单的事，人多嘴杂，回头让同行看了去抢，咱俩私下说就行
  B：懂，我就在群里说还在等通知
  A：对，就这么回
  B：出结果了？？小刘看到园区公众号发了公示
  A：恭喜！你们中了，我刚才在会上就说这结果稳了
  B：托您的福！这下生产计划敢排了，晚上我安排一桌，你务必来
  A：饭就不吃了，家里等着呢，心意领了
  B：那改天，咱约场球，园区旁边不是有个足球场嘛
  A：行啊，我这把老骨头守门还行，你别踢我脸上
  B：哈哈一定轻点
  【10月15日】
  B：郑师傅，我财务今天有空，两万零二百垫付款加八千服务费，一共两万八千二，我现在转你，对吗
  A：对，两万零两百是垫的调档费加保证金，八千是居间服务费，合同编号你在转账备注里写一下
  【系统消息】B 向 A 转账 28200 元，已收款。
  A：收到了，备注我看了，没问题。收据我今天拍照给你，发票让公司下周开
  B：好，合作愉快，以后园区有事还找你
  A：合作愉快，核桃到了我喊你
