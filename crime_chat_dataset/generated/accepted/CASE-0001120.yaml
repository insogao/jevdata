  【7月14日】
  A：小刘，这个项目的合同你跟进一下
  B：好的张总，主体还是写咱们？
  A：主体写我，回款先走你那个账户
  B：走我个人卡吗
  A：嗯，你卡方便，公司账户流程太慢
  B：那中间那部分怎么算
  A：居间费按到账抽两个点，还是老规矩
  B：税呢
  A：税点你们出，我这只是过个名义
  B：行，我先照做
  B：张总中午吃饭吗，我下楼带
  A：带个盖饭就行，简单点
  B：好，还是青椒肉丝
  A：嗯，顺便把发票抬头确认下
  A：合同草稿出来了吗
  B：出来了，金额和主体都按你说的填
  A：回款账户记得填你自己的
  B：填了，但这种大额进我个人卡我有点怵
  A：怕什么，过一下账就转走，走量而已
  B：那我记个流水，回头对得上
  A：对，别留明细在公开的地方
  A：这月绩效我帮你争取了，别掉链子
  B：谢谢张总，我肯定配合
  【7月15日】
  A：甲方说下周走流程，你把材料备齐
  B：好，居间协议也一起附吗
  A：附上，按到账分成那条写清楚
  B：税那条还是写我方承担？
  A：写你们出，跟之前一样
  B：外面太阳挺大，你出门记得打伞
  A：不了，我开车
  B：那你注意别中暑
  A：首笔款到账后先别动，等我招呼
  B：好，那笔我先记着
  A：嗯，稳妥点
  A：上回你垫的打印费我转你了
  A：别跟项目款混一起
  B：收到，打印费八十六，我对上了
  【系统消息】A 向 B 转账 86 元，已收款。
  B：谢谢张总
  【7月16日】
  A：流程过了，合同用印了
  B：首笔多少
  A：三成，十几万，月底到
  B：到了我按两个点留，剩下转你
  A：对，税点你们担，别再问一遍
  B：记住了，我盯着到账
  B：张总，周末你有空吗，组里说聚一下
  A：看情况，先别算我
  B：好，定了再跟你说
  A：这笔完了还有下一批，你稳定做
  B：行，只要别让我公开明细就行
  A：放心，口径统一对外就说代收
