  A：省得两头跑了。
  B：是啊。
  A：我把相关时间也记下来了。
  B：好，临时有调整再联系。
  A：最近天气变化快，出门前看下预报。
  【10月3日】
  B：是否授权要由每个人自己决定，我不能替同事点头。
  A：那让他先发岗位，等候选人自己联系？
  B：对，公开招聘才是合适的做法。
  A：行，我就回复这条，不发名单。
  B：好，多谢理解。
  A：对了，洗衣机维修后来定了吗？
  B：定好了，我刚收到确认。
  A：时间合适不？
  B：挺合适的，不用改。
  A：那就省事了。
  B：是呀，最近事情多，能定下来最好。
  A：我把相关时间也记下来了。
  B：好，临时有调整再联系。
  A：最近天气变化快，出门前看下预报。
  A：想起来你提过家人来访，有消息吗？
  B：有，刚刚处理完。
  A：比预想的麻烦吗？
  B：没有，按步骤来就行。
  A：那挺顺利的。
  B：嗯，心里踏实了。
  A：我把相关时间也记下来了。
  B：好，临时有调整再联系。
