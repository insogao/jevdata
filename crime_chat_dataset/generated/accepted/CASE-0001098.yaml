  B：不行，简历和联系方式都得本人同意才能分享。
  A：他做招聘很久了，肯定知道分寸。
  A：顺便说下，停车位调整别忘了留时间。
  B：记着呢，我写进日历了。
  A：你最近日程是不是很满？
  B：还好，周五之后松一点。
  A：那也记得休息。
  B：会的，谢谢提醒。
  A：我把相关时间也记下来了。
  B：好，临时有调整再联系。
  A：最近天气变化快，出门前看下预报。
  A：今天路过时看到办公室收纳的通知。
  B：我也看见了，信息挺清楚。
  A：你准备怎么安排？
