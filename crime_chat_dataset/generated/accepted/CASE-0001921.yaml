conversation: |-
  【6月15日】
  A：哥，节前回去时想跟你聊聊，你哪天有空？
  B：这周还好，怎么了？
  A：午饭吃的什么
  B：附近新开了家盖饭
  A：味道还行吗
  B：挺清淡的，下次可以去
  A：下回我早点去
  B：人少就不用等位
  A：我之前交的送审材料还没听到消息，想问问大概到哪儿了。
  B：我这边看到的都是按先后流转，不能单独给谁改顺序。
  A：你之前一直挺关照我，我一直记得你对我的照应。
  A：你那个保温杯找到没
  【6月16日】
  B：在车后座，昨晚忘了拿
  A：还好没落在外面
  B：我现在就收进包里
  A：我放到副驾驶了
  B：这样进门就能拿
  B：见面没问题，东西真的不用带。
  A：我原想带张卡，里头多少我也没看，节前一点心意。
  A：周末要不要去看花市
  B：可以呀，上午早点去
  A：好，避开中午人多
  B：我到时发你消息
  【6月17日】
  A：我查了下公交路线
  B：直达那班更方便
  B：私人送的我不能收，单位发的福利卡要按单位的办法来。
  A：那件你知道的事，之后有空帮我提一句就行。
  A：你家小狗最近乖不乖
  B：还行，最近不乱叫了
  A：邻居应该省心些
  B：是，晚上安静多了
  A：它现在爱趴门口
  B：估计等你回家
  B：不管认识多久，我都只能照同一套流程往下办。
  【6月18日】
  A：懂，我就是顺口问问。
  B：就先别拿卡来了，等有消息会照常告诉你。
  A：外头风挺大吧
  B：刚才骑车回来有点冷
  A：戴个围巾吧
  B：我找找抽屉里那条
  A：找到了，颜色都褪了
  B：能用就先用着
  A：上次聊的那件事有回音没？我这边还等着安排。
  B：我会按提交的先后看，有变化走原来的通知方式。
  A：好，我明白了，卡我就不带了，节前正常见面。
