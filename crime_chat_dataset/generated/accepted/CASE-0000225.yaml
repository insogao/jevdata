  A：好，我请。
  B：不用，AA吧。
  【8月4日】
  A：对方说愿意约时间在中介处把账对清。
  B：那就只你本人和第三方在场，保持正常沟通。
  A：我把之前说的按天请人取消了。
  B：谢谢，别把兄弟们牵进来。
  A：周末球赛你还去吗？
  B：去啊，票在我这。
  A：那周六地铁站见。
  B：好，别迟到。
  【8月5日】
  A：中介定了下周一，我们带账目去。
  B：保持冷静，有分歧就继续走调解。
  A：明白，不带其他人。
