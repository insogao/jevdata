conversation: |-
  【10月21日】
  B：张师傅吗？康居苑物业，我们D区要统一换防盗门锁
  A：老小区那种十字老锁我们做得最多，一口价含安装
  B：多少户都能接？
  A：接，一次上门全弄完，不给业主添第二回事
  B：报个价
  A：锁体加安装每户45，含三把钥匙，材料我全包
  B：成，物业先贴通知，业主自愿登记
  A：好，登记表你给我一份，按表上门
  B：时间呢，工作日白天业主都在上班
  A：傍晚五点半到八点最合适，下班都在家
  B：行，就按这个点
  A：你们小区门口快递又堆成山了
  B：双十一预售开始了，没办法
  A：我那两个快递还被压丢了
  【10月22日】
  B：通知贴了，登记了96户，先干1栋和3栋
  A：行，周四五点半我先到1栋
  B：需要物业出人配合不
  A：每栋来个楼管核对登记表，换完让业主签字确认
  B：确认单你带还是我们印
  A：我带，一式两份，物业留一份
  B：想得周到
  B：又有人投诉广场舞音响，你们小区没这情况吧
  A：也有，后来居委划了时间段
  B：回头我也提个时段公约
  【10月23日】
  A：到1栋了，楼管呢
  B：小刘在单元门口等你
  A：1栋32户换完，确认单签齐了，明天3栋
  B：辛苦，业主群里有人说锁挺顺滑
  A：老小区那种锁型闭眼都能装，干了十几年
  B：明天老时间？
  A：老时间，五点半
  B：明晚降温，你户外作业穿厚点
  A：带了军大衣，师傅人手一件
  B：哈哈装备齐
  【10月24日】
  A：到3栋
  B：小刘等着呢
  A：64户全换完，两栋一共96户，确认单都在
  B：我核下表……齐了，尾款我现在转你
  【系统消息】B 向 A 转账 4320 元，已收款。
  B：转4320，96户的工程款，你点点
  A：收到。发票我明天开好送物业，抬头写你们公司全称
  B：好，这笔从公共收益里走，发票和确认单一起交财务
  A：行，单据我装订好一并给你
  B：干得利索，E区明年预算下来还找你
  A：随叫随到，老小区的活我熟
  B：对了你丢的那俩快递，驿站说找到了，明天来拿
