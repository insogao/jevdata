  A：最近早高峰地铁好挤，我都改骑车了。
  B：注意安全啊，路口那段在修路。
  A：知道，今天绕了一下还挺顺。
  B：午休想去吃那家砂锅，你去不去？
  A：今天排队太长了，我打包回办公室。
  B：那我也点个外卖吧，省点时间。
  A：行，少放辣，我最近胃不太舒服。
  B：那边下周应该就通了。
  A：你方便的时候帮我多看一眼就行，我不是催你。
  B：所有人都按同一标准，我不会因为礼物改顺序或结果。
  A：明白，礼物跟那件事没关系，你照常办。
  B：好，材料齐全后会按流程通知。
  A：周末家里要包饺子，你来不来？
  B：我尽量，最近事情有点多。
  【3月5日】
  A：不用赶，来吃口热的就行。
  B：好，那我到时带点水果。
  A：那卡你看怎么处理合适，我不想让你为难。
  B：我按规定处理，之后咱们也照常沟通工作。
  A：你上次借我的保温杯我洗好了，明天带给你。
  B：不急，我家还有一个备用的。
  A：那我放在会议室柜子里了。
  B：看到了，谢啦。
