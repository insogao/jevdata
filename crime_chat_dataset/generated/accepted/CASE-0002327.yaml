  【3月3日】
  A：节前想当面跟你问候一下，哪天方便？
  B：可以，林经理。我周三下午在办公室。
  A：好，我路过时把节日东西带给你，不占太久。
  A：这两天风大，你出门记得带外套。
  B：早上还挺暖的，下午就降温了。
  A：我昨天没看天气，差点冻着。
  B：我包里常放个薄围巾，方便。
  B：不用专门准备礼物，见面聊会儿就行。
  A：就是个那张小卡，我没留意面值，图个节日气氛。
  B：收到啦，谢谢。不过你先别急着走，我得确认下单位对这类礼物怎么处理。
  A：你家猫最近还挑食吗？
  B：好多了，换了个口味就肯吃。
  A：小动物真会挑。
  B：可不是，昨天还把零食袋扒拉出来了。
  A：没啥贵重的，你别有负担，大家节前都互相问候一下。
  B：我会按规定登记或退回，免得之后说不清。
  【系统消息】B 向 A 转账 36 元，已收款。
  【3月4日】
  A：对了，我前阵子提交的材料是不是还差点什么？
