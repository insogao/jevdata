  【10月13日】
  A：小号也给你翻了，相册原图时间也看过吧。
  B：我不再看这些线索，也不会拿来认人。
  A：对了，出差改签别忘了留时间。
  B：记到日历里了。
  A：你最近忙吗？
  B：还好，周五后能松一点。
  A：也得记得休息。
  B：好，听你的。
  A：我把相关时间记下来了。
  B：好，有变动再说。
