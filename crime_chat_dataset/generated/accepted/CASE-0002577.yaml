conversation: |-
  【9月24日】
  A：表哥，节前哪天有空，一起吃顿饭吧。
  B：可以呀，正好最近都没见着。
  A：明晚方便吗？我来定地方，离单位不远。
  B：明晚可以，别订太正式的地方。
  A：好，就附近那家家常菜馆。顺便带一点节日小心意。
  B：吃饭可以，东西真不用特意准备。
  A：你家小狗最近还挑食吗
  B：这周好点了 换了个碗
  A：哈哈它还挺会挑
  B：猫也一样 不喜欢就不碰
  A：看来得慢慢试
  B：嗯 先不折腾它了
  A：它现在一听开罐声就跑来
  【9月25日】
  A：你那边月底也要补台账吗
  B：要啊 这周在核一遍
  A：我们刚换了新版表格
  B：我也收到了 看着清楚些
  A：就是填起来多两栏
  B：熟悉了就快了
  A：我把旧表也留了一份
  A：我到门口了，你慢慢来。
  B：刚出来，马上到。
  A：这个给你，一张购物卡，过节图个方便。卡面我也没留意。
  B：你太客气了，心意我收下，下次别这么见外。
  B：今天饭钱我分一半给你吧，别总让你请。
  【系统消息】B 向 A 转账 194 元，已收款。
  A：好，收到啦，这样刚好。
  【9月26日】
  A：我看了下这周日程，空出来的时间还挺多。
  B：是啊 把事情一项项排开就好些。
  A：那我先把要带的东西列一下。
  B：行，别忘了看天气再决定。
  【9月27日】
  A：这两天早晚风挺大的
  B：是啊 白天又有点热
  A：我包里常放件薄外套
  B：这样挺好 下班时能用上
  A：预报说周末会降温
  B：那我把厚衣服拿出来
  【9月28日】
  A：附近新开了家面馆你去过没
  B：去过一次 汤还不错
  A：我上次点的拌面有点咸
  B：那你下次试试番茄鸡蛋面
  A：好 我记下了
  B：中午人少点再去
  【9月29日】
  A：见面时顺带聊到的我家店的续办资料，我这边先等着，有空再说哈。
  B：材料都按顺序处理，有消息会照常通知。
  A：明白，我就是问问，节前事情多辛苦啦。
  B：不客气，缺什么会统一联系，不用专门跑一趟。
