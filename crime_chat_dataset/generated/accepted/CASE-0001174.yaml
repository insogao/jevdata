title: privacy_doxxing/workplace_contact_out
conversation: |-
  【10月8日】
  A：朋友的招聘项目缺人，问我能不能搞到整个部门电话和离职名单。
  B：我不能提供内部员工资料。
  A：说到日程，客户电话会别忘了留时间。
  B：记着呢，我写进日历了。
  A：你这周安排得满吗？
  B：周四以后就松一点。
  A：那也记得休息。
  B：好，听你的。
  A：我把时间也记下来了。
  B：好，临时有变化再说。
  A：最近天气转凉，出门多带一件。
  【10月9日】
  A：简历按份卖，价钱还能商量。
  B：候选人的个人资料不可以这样转手。
  A：我刚看到家里修门锁的通知。
  B：我也看见了，信息蛮清楚。
  A：你想怎么安排？
  B：先照原计划来，之后再确认。
  A：行，有变化互相说。
  B：好呀。
  A：我把时间也记下来了。
  B：好，临时有变化再说。
  A：最近天气转凉，出门多带一件。
  A：上次你先垫的午饭钱我还你了，和前面说的事无关。
  【系统消息】A 向 B 转账 44 元，已收款。
  【10月10日】
  A：那猎头正常触达怎么做？
  B：用公开求职信息，先介绍岗位，再问本人是否愿意沟通。
  A：今天想到楼下早餐，上次说还没定。
  B：现在定下来了。
  A：需要我搭把手吗？
  B：不用，已经弄好了。
  A：那太好了。
  B：嗯，少一件惦记的事。
  A：我把时间也记下来了。
  B：好，临时有变化再说。
  A：最近天气转凉，出门多带一件。
  【10月11日】
  A：懂了，我让他发职位信息。
  B：对，别从公司名单里拿人。
  A：顺便问下，文件归档定了吗？
  B：刚收到确认，按原计划。
  A：时间方便吗？
  B：还行，不需要再调整。
  A：那就好，省点心。
  B：嗯，最近事情有点多。
  A：我把时间也记下来了。
  B：好，临时有变化再说。
  【10月12日】
  A：我会把名单请求拒掉。
  B：谢谢。
