conversation: |-
  【12月5日】
  A：有人问一张卡多少钱，还说开网银带U盾就行。
  B：账户给他用？这种事千万别答应。
  A：他说强调无风险，借几天就还。
  B：卡和网银设备只能自己控制，不能交出去。
  A：按张收费听着像真兼职，我差点信了。
  B：正规工作不会要你出租账户，先拒绝并留记录。
  A：学校图书馆今天人好多。
  B：期末周嘛，我占到靠窗的位置。
  A：晚上一起复习？
  B：好，带上统计课笔记。
  【12月6日】
  A：我回绝了，他又保证不会有事。
  B：不要再回复，必要时向平台或警方咨询。
  A：银行提醒我改了密码，也确认没有授权。
  B：很好，U盾一直自己收好。
  【系统消息】A 向 B 转账 500 元，已收款。
  A：复习完去吃饭吗？
  B：去，想吃馄饨。
  A：那我先去排队。
  B：马上到。
  【12月7日】
  A：对方账号我举报了，聊天也留着。
  B：做得好，以后找学校就业中心核实岗位。
  A：嗯，不会把卡交给任何人。
  B：安心准备考试吧。
  【12月8日】
  A：考试结束啦，终于能睡个好觉。
