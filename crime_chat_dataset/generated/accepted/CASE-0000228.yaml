title: fraud_scam/account_lending
conversation: |-
  【9月10日】
  A：同学说有兼职，一张卡给几百，强调无风险。
  B：他让你开网银还带U盾吗？这明显不是发传单。
  A：说只是帮忙收快递款，账户给他用几天。
  B：账户和U盾都不能交给别人，拒绝并联系银行确认。
  A：我还没给资料，先问问你。
  B：别提供密码、验证码或设备，正常兼职不会要这些。
  A：食堂今天有糖醋里脊。
  B：我排队半天才买到，确实还行。
  A：下午小组会别忘了。
  B：我做完幻灯片了，发你看。
  【9月11日】
  A：我回绝了，对方还说我想多了。
  B：别争辩，保存记录，把招工信息报给平台。
  A：银行客服也说不要把账户交别人使用。
  B：听银行的，网银设备自己保管。
  A：组会改到下午三点，你有空吗？
  B：有，我把数据图再改一下。
  A：我请奶茶。
  B：无糖就行哈哈。
  A：打印社团宣传单的钱我先转你了，收据回头报销。
  【系统消息】A 向 B 转账 75 元，已收款。
  【9月12日】
  A：那人还发消息，我已经拉黑并举报。
  B：好，账户没给出去吧？
  A：没有，密码和U盾一直在我这。
  B：那就好，兼职还是走正规招聘。
  【9月13日】
  A：招聘平台回复会核查那个虚假兼职。
