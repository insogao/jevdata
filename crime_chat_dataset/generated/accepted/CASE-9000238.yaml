conversation: |-
  【10月9日】
  A：周三靠岸那批,数量点齐了,成色也好。
  B：哥,这条多少?
  A：一类三百六,整件拿再让五个点。市里店里都卖六百多,所以让你先看货再谈。
  B：成,那明早我去,怎么看?
  A：北门进,我带你上三号库,眼见为实。
  B：行,怎么结算?
  A：老规矩现金,这边账上走不了,你懂的。
  B：定金先转你两万,余款当天补齐?
  A：可以。周四上午十点,就留一上午,别迟到。
  【系统消息】B 向 A 转账 20000 元，已收款。
  B：转了啊哥,你点点。对了,上回那罐单丛我快喝见底了。
  A：喜欢就好,回头再给你拿罐新的,蜜兰香。
  B：你这茶叶比我库里的货都齐,改行得了。
  A：好茶配好烟,干我们这行的讲究个口碑。
  B：我同事闻着都馋,一直问我在哪买的。
  A：问他要不要,熟人价,哈哈。
  B：你们码头这几天风大不大?听说一刮风就歇工。
  A：今天还行,后天才来六七级,咱赶得巧。
  B：那你多穿点,海边湿冷,往骨头缝里钻。
  A：嗯,我这老寒腿比你家天气预报还准。
  B：秋裤安排上,别硬撑。
  A：滚,我就比你大三岁。
  【10月10日】
  B：到北门了,蓝色那台。
  A：看见了,五分钟,下来带路。到了,就这排,自己拆箱验,条装随你抽。
  B：我开两条看看……烟丝紧实,干爽,不是回潮货。就这批,二十件,现金我都带来了,当面点两遍。
  A：行,点完我给你开出库单,路上拿着。
  A：中午别急着走,食堂今天红烧狮子头,大师傅是广东请的,烧腊一绝。
  B：你们伙食比我们那强多了,我们食堂的菜,狗看了都摇头。
  A：哈哈,那你今天算蹭对日子了。
  B：有豆浆油条没?我早点就没吃舒坦。
  A：有,明早你来,带你去窗口吃现炸的。
  B：行,那我明天还来,验货吃早饭两不误。
  B：昨晚那场球看了没?最后十分钟连追三个。
  A：看了,我这暴脾气差点把遥控器捏碎。
  B：那个单刀是真该进,门将都懵了。
  A：下轮踢谁?约你食堂看,大厅有投影。
  B：成,输的人请奶茶。
  A：一言为定。
  B：出门这段在修路,堵得我绕了高架。
  A：晚高峰别走高架,地面反而快。
  B：学到了,下次听你的。
  A：货捆牢了没有?
  B：捆了三层绳,稳得很。
  A：行,慢点开,下批到了给你信。
