  B：收到，正好我有外套。
  A：那我先去忙啦。
  B：行，晚点聊。
  【10月10日】
  B：让学生监护人联系学校正式窗口申请。
  A：好，我把公开联系方式发给她。
  B：可以，只发学校对外公布的渠道。
  A：说到日程，天气降温别忘了留时间。
  B：记着呢，我写进日历了。
  A：你这周安排得满吗？
  B：周四以后就松一点。
