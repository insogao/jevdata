  【9月1日】
  poacher：上周整理旧电脑，翻到以前部门留的电话表和几份简历
  assistant：离职同事的资料吗？这不是公共通讯录吧
  poacher：嗯，都是以前合作时存的，我没删
  poacher：有个外部招聘的人问我能不能介绍些人
  assistant：他们同意你把电话和简历给出去了吗
  poacher：没专门问，猎头说按份算介绍费
  assistant：这两件事得分开，认识不等于授权
  A：你上次说的咖啡机修好了没
  B：好了，换了个小零件
  A：那挺好，早上不用排队买了
  B：就是豆子快没了，周末补点
  【9月2日】
  poacher：那边又问了，整个部门的号码有用
  assistant：你别把表发过去
  poacher：我还没发，只是问问
  assistant：简历也别挑几份先试，里面有私人信息
  poacher：我本来想先给两份看看
  assistant：先停一下，至少得问本人
  poacher：你说得也有道理
  B：这两天忽冷忽热的
  A：我早上还穿短袖，晚上后悔了
  B：我包里塞了件薄外套
  A：我也得学你，办公室空调太凉
  【9月3日】
  assistant：今天去买咖啡排了好久
  poacher：楼下那家新店快一点
  assistant：我试了，拿铁还行
  poacher：下回我也去
  A：周末家里说想吃火锅
  B：我可以带点蘑菇过去
  A：别买太多，冰箱都满了
  B：行，那我带饮料就好
  【9月4日】
  poacher：对方说不需要完整资料，电话就可以
