  B：设个闹钟试试
  A：我今天回去就设
  A：我先记下来，回头再确认。
  B：行，不急，忙完再说。
  A：罗，节前有空见一面吗？想聊聊客户活动的座位确认。
  B：哪天方便？我下班后可以。
  A：周四吧，我顺便把卡片带给你。
  B：不用特意准备东西，谈工作按流程就好。
  A：就是一点小心意，不占你多少时间。
  B：那在楼下咖啡店见吧，公共区域方便。
  A：好，六点半，我准时到。
  B：行，到时见。
  【12月23日】
  A：你的包裹到了没
  B：到了，放前台了
  A：下班顺路拿吧
  B：嗯，应该不重
  A：我帮你拿到车边
  A：我先记下来，回头再确认。
  B：行，不急，忙完再说。
  A：午饭拼单的钱我刚转你，一百二。
  【系统消息】A 向 B 转账 120 元，已收款。
  B：收到了，正好是我那份午饭钱。
  A：昨天那张卡片你收到了吧？
  B：收到了，但你没说面值，我也没问。
  A：卡上也没写，不用专门查。
  B：这东西我不太方便收。
  A：节前互相问候一下，别多想。
  B：我会按单位规定处理，工作上的事照旧走流程。
  A：好，你看着办。
  B：我先放好，之后会退回。
  A：节后那份“那件还没定下来的事”你有空看一下吗？
  B：我看到了，相关内容还在正式流程里。
  A：上次见面也聊过，能不能帮我往前排一排？
  B：我只能按公开标准和顺序处理。
  A：卡的事你不用再提了。
  B：我已经按规定退回，礼物和工作要分开。
  A：知道了，等正式结果。
  B：结果出来会按流程通知。
