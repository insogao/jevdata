title: privacy_doxxing/workplace_contact_out
conversation: |-
  【9月22日】
  A：我们在找候选人，是否能拿到一个部门的联系方式？
  B：我没有授权，不能提供员工资料。
  A：招聘页的岗位描述谁来定稿？
  B：我先整理职责，再请业务负责人确认。
  A：薪资范围要不要公开？
  B：可以和HR确认后写区间。
  A：我不确定福利怎么表述。
  B：写清楚假期和培训政策就行。
  A：今晚我改完发你。
  B：我明早看。
  A：谢谢。
  B：没问题。
  【9月23日】
  A：简历也能按份报价，离职名单一起给我吧。
  B：我不会出售或转发个人资料。
  【9月24日】
  A：如果把名字去掉，客户就看不出来了。
  B：联系方式和经历组合仍可能识别到人。请用公开岗位邀请自愿申请。
  A：中午想吃点清淡的。
  B：园区旁边新开了粥铺。
  A：走路远吗？
  B：五分钟就到。
  A：那我下楼看看。
  B：可以点小份试试。
  A：味道挺好的。
  B：下回我也去。
  A：我把地址记下了。
  B：周围还有家卖豆花的。
  【9月25日】
  A：好，那不碰这份名单了。
  【9月26日】
  B：谢谢，之后只处理明确授权的简历。
  B：周末那场电影你看了吗？
  A：看了，节奏比预告片慢一点。
  B：结尾怎么样？
  A：留了点想象空间。
  B：那我也找时间看。
  A：别看剧透就好。
  B：我会注意。
  A：片尾曲挺好听。
  B：我去找找歌名。
  A：回头发你。
