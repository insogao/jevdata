conversation: |-
  【9月24日】
  A：表姐，我是小叶。家里最近都还好吧，节前想找你吃个便饭。
  B：都挺好呀。你怎么突然想起请我吃饭了。
  A：明晚方便吗？我来定地方，离单位不远。
  B：明晚可以，别订太正式的地方。
  A：好，就附近那家家常菜馆。顺便带一点节日小心意。
  B：吃饭可以，东西真不用特意准备。
  A：这几天早晚温差也太大了
  B：是啊 我中午还穿短袖呢
  A：我早上出门带了件外套
  B：带着好 晚上风一吹就冷
  A：预报说明天会晴一点
  B：那我把阳台衣服洗了
  A：附近新开了家面馆你去过没
  B：去过一次 汤还不错
  A：我上次点的拌面有点咸
  B：那你下次试试番茄鸡蛋面
  A：好 我记下了
  B：中午人少点再去
  A：你最近还坐地铁吗
  B：基本都坐 开车找位太费劲
  A：我这两天改骑车了
  B：路上注意点 早高峰车多
  A：就两站路 还挺方便
  B：嗯 下雨我就不骑了
  【9月25日】
  A：家里老人最近身体还好吧
  B：挺好的 就是老问我啥时回去
  A：节前路上票不好买
  B：我提前看了一下 还没放票
  A：放票那天记得设个提醒
  B：好的 我叫我弟也盯着
  A：最近肩膀还酸吗
  B：好多了 我换了个枕头
  A：我也是坐久了就僵
  B：每隔一会儿起来走走
  A：对 我现在设了个闹钟
  B：挺好 别硬扛
  A：我到门口了，你慢慢来。
  B：刚出来，马上到。
  A：这个给你，一张小购物卡，过节图个方便。卡面金额我也没仔细看。
  B：你太客气了，心意我收下，下次别这么见外。
  B：今天聊得挺轻松的，回去路上注意。
  A：好呀，你也早点休息。
  A：前几天见面聊到的我家小店那份续办材料，之后你有空时帮我留意下进度就行。
  B：材料都按顺序处理，有消息会照常通知。
  A：明白，我就是问问，节前事情多辛苦啦。
  B：不客气，缺什么会统一联系，不用专门跑一趟。
