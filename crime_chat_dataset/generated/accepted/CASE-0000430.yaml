  B：用我小号接行吗
  A：行，就用小号
  B：明白。那车什么时候发
  A：明晚装车，后天上午到站，你直接去站上提
  B：提完回我那仓库换箱？地方够不够
  A：就你那仓库，门一关慢慢换，别找人帮忙
  B：一个人得换到半夜吧
