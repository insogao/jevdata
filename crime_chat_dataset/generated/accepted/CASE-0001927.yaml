  A：你家窗台的香葱长出来没
  B：长了一点，得再等几天
  A：炒蛋时候剪一点就行
  B：嗯，我种着玩
  A：我准备再种一小盆
  B：阳台还能放得下吗
  A：放得下，我把旧花盆腾出来
  【8月10日】
  A：我之前交的活动点位申请还没听到消息，想问问大概到哪儿了。
  B：我这边看到的都是按先后流转，不能单独给谁改顺序。
  A：午饭吃的什么
  B：附近新开了家盖饭
  A：味道还行吗
  B：挺清淡的，下次可以去
  A：下回我早点去
  B：人少就不用等位
  A：咱们认识好多年了，我一直记得你对我的照应。
  【8月11日】
  B：见面没问题，东西真的不用带。
  A：你那个保温杯找到没
  B：在车后座，昨晚忘了拿
  A：还好没落在外面
  B：我现在就收进包里
  A：我放到副驾驶了
  B：这样进门就能拿
  A：我带了那张卡，里头多少我没看，就当节前一点心意。
  【系统消息】A 向 B 转账 300 元，已收款。
  【8月12日】
  B：私人送的我不能收，单位发的福利卡要按单位的办法来。
  A：周末要不要去看花市
  B：可以呀，上午早点去
  A：好，避开中午人多
  B：我到时发你消息
  A：我查了下公交路线
  B：直达那班更方便
  A：那件你知道的事，之后有空帮我提一句就行。
  B：不管认识多久，我都只能照同一套流程往下办。
  【8月13日】
  A：你家小狗最近乖不乖
  B：还行，最近不乱叫了
  A：邻居应该省心些
  B：是，晚上安静多了
  A：它现在爱趴门口
  B：估计等你回家
  A：懂，我就是顺口问问。
  B：卡你先拿回去，等有消息会照常告诉你。
  A：外头风挺大吧
  【8月14日】
  B：刚才骑车回来有点冷
  A：戴个围巾吧
  B：我找找抽屉里那条
  A：找到了，颜色都褪了
  B：能用就先用着
  A：上次聊的那件事有回音没？我这边还等着安排。
  B：我会按提交的先后看，有变化走原来的通知方式。
