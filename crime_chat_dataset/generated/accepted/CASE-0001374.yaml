  【9月6日】
  A：同学家长在问成绩公布没，我想起你在学校做事，能不能看看公告？
  B：公告是公开的，我可以把学校发布的链接给你。
  A：我说的是系统里那条具体记录，不是我家孩子。
  A：中午吃啥？楼下那家面馆开门了。
  B：我刚吃过，今天带了饭。
  A：又是自己做的？
  B：昨晚剩的咖喱，微波一下还行。
  【9月7日】
  B：下次我带你去试试，听说新换了厨师。
  A：好啊，等我这周忙完。
  B：那我不能查给你，公开页面没有个人分数。
  A：明白，是我问得不合适。你发公开查询说明就好。
  B：我把学校通知转你了，按官方流程查。
  B：周末降温了，你那边记得带外套。
  A：我看天气说晚上有雨。
  【9月8日】
  B：我把薄外套放门口了，出门就能拿。
  A：好，别又忘在办公室。
  B：那把伞还在你车上吗？
  A：在呢，前阵子你落下的那把。
  A：谢谢，省得家长一直催。
  B：没别的了吧？我不会看个人档案。
  A：没了，收到通知就够了。
  【9月9日】
  B：好，别把公开线和个人成绩混在一起。
  A：我爸还说要带点自家种的菜。
  B：那我回去前给你发消息。
  A：家里问你端午回不回去。
  B：看排班，周六应该能走。
  A：我可以顺路接你。
  B：先别定，我确认完车票再说。
  【9月10日】
  A：你那边忙完了吗？
  B：差不多了，等会儿回你。
  A：你那边忙完了吗？
  B：差不多了，等会儿回你。
  A：你那边忙完了吗？
  B：差不多了，等会儿回你。
  A：辛苦，喝点水。
  【9月11日】
  B：嗯，桌上有杯子。
  A：你那边忙完了吗？
  B：差不多了，等会儿回你。
  A：行，不急。
  B：刚把表格交了。
  A：辛苦，喝点水。
