title: privacy_doxxing/exam_score_lookup
conversation: |-
  【12月4日】
  A：我想问下之前说的那位学生，最近情况出来了吗？
  B：我不能把学生记录告诉无关的人。
  A：我把今天要处理的小事列出来了。
  A：班主任那边能不能帮我看一下？我就想知道大概。
  B：要由监护人按学校渠道查询。
  B：一项项来，别着急。
  A：群里的红包已经发了，你看见了吧？
  A：家里那盏灯最近有点闪。
  A：刚才打印的几页我重新装订好了。
  B：可能灯泡松了，先检查一下。
  【12月5日】
  A：我晚上回去看看。
  B：别踩高凳子，找人帮忙。
  B：这样放包里就不容易散。
  B：看见了，但这跟学生的成绩是两回事。
  A：给我一张截图就行，不用写名字。
  A：午休想出去走一走。
  B：遮掉姓名也不能随意分享。
  A：我只是想帮忙了解一下，不会传出去。
  B：未经授权我不会查看或转发。
  B：可以，坐久了活动一下。
  【12月6日】
  B：你周末一般怎么放松？
  A：在家听听播客，偶尔做饭。
  B：挺好的，能换换脑子。
  【系统消息】A 向 B 转账 35 元，已收款。
  A：我把提醒设置成响铃了。
  A：是啊，最近想少看屏幕。
  A：你就不能通融一次吗？
  B：不行，这涉及学生隐私。
  B：好，重要消息就不容易错过。
  【12月7日】
  A：好，那我让家里人自己问。
  B：这样合适，请不要再向我索要截图。
  A：外面刚停雨，路面还有点湿。
  A：知道了，我不再追问。
  A：今早公交比平时快，我还提前到了。
  B：今天路上车少，难得。
  A：我顺便买了杯热豆浆。
  B：走路慢点，别滑了。
  B：天气凉喝热的正好。
  B：谢谢理解。
  【12月8日】
  A：红包是发在群里的，大家都有。
  A：我晚上准备煮点面。
  B：收到，但成绩还是只能通过正式渠道了解。
  A：明白，我会让监护人去联系学校。
  B：好，之后也请不要私下传成绩信息。
  B：放点青菜就挺好。
  A：快递柜今天人很多。
  B：可能赶上大家下班了。
  A：我把桌上的书归到架子上了。
