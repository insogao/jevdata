  A：你翻我台账干嘛
  B：职责所在。提醒你一句，别让小事耽误大事
  A：先不说了，我儿子高三开家长会，老师又点名
  B：高三苦，熬过去就好了
  A：借你吉言
  【9月10日】
  B：想得怎么样，周五验收会就定了
  A：多少合适，你给个数
  B：辛苦费嘛，老规矩，一万
