title: privacy_doxxing/workplace_contact_out
conversation: |-
  【5月9日】
  A：几家客户又在问招聘的事，想要一份完整的部门联系人。
  B：我不能给通讯录，员工没有授权。
  A：离职名单也没有吗？他们想找刚出来的人。
  B：离职后的个人信息仍然不能随便提供。
  A：有人跟我说简历按份卖，报价还挺高。
  B：这类资料不该按份卖。我可以问问谁愿意主动联系。
  A：附近新修了条步道，你去过吗？
  B：还没，听说傍晚风景不错。
  A：周末不下雨就去走走。
  【5月10日】
  B：可以，带瓶水就行。
  A：我再叫上小周？
  B：好，人多也热闹。
  A：整个部门电话我先不提了，怕你为难。
  B：谢谢，岗位信息公开出去让候选人自己报名。
  A：我刚转了90，昨天打车我先垫的那笔。
  B：收到了，你还多算了十块。
  A：算上路边停车那个小票了。
  【5月11日】
  B：好，我核一下再退差额。
  A：你妈上次说要换个电饭煲，买了吗？
  B：还没，先把旧的清理了再看。
  A：我家那个内胆涂层有点花了。
  B：那最好别继续用，挑个容量合适的。
  A：周末去商场转转？
  B：行，顺便看看有没有活动。
  A：客户问能不能今天拿离职名单，我回他没有。
  B：对，别帮他找内部文件。
  【系统消息】A 向 B 转账 90 元，已收款。
  【5月12日】
  A：那我发岗位描述，愿意聊的再自己报名。
  B：把公司名称和岗位写清楚，别用模糊的邀约。
  A：他们说先电话聊比较快。
  B：候选人愿意留下电话再联系。
  A：你们这周排班改了吗？
  B：周四换到下午，其他没动。
  A：那我把会议挪到周五上午。
  B：可以，我那会儿有空。
  【5月13日】
  A：邀请发你了。
  B：收到了，回头确认材料。
  A：那个简历报价我拒了，让对方走招聘平台。
  B：这样处理省心。
  A：他说别人都能弄，我也没接话。
  B：不用比较，资料边界一样。
  A：后续有自愿投递我再提醒你。
  B：可以，让本人直接发最好。
  A：你家猫最近还挑食吗？
  【5月14日】
  B：好多了，换回之前那种粮就肯吃。
  A：我朋友也遇到过，换粮要慢慢来。
  B：对，混着旧粮一点点换。
  A：我把这招告诉她。
  B：希望有用。
  A：今天总算没那么赶。
  B：早点下班吧。
  A：对了，办公室打印机也修好了，明天不用排队。
