conversation: |-
  【5月6日】
  A：这批稿子排出来了，还是按一篇一千五结。
  B：先说清楚，学生要的是辅导还是整篇？
  A：整篇交付，查重我保过，导师那边我打招呼。
  B：我不接代写，也不能保证绕过学校核验。
  A：你只写内容，学生自己提交，大家都这么做。
  B：最后署谁的名字不改变谁实际完成了作业。
  A：那至少帮我把大纲扩成完整初稿。
  B：我能做的是提纲讨论和修改意见，学生要自己写。
  A：早高峰地铁挤不挤？
  B：今天还好，站着有位置。
  A：我上车晚了一站就好多了。
  B：就是多走几分钟。
  A：当锻炼了。
  B：下雨天我还是不想走。
  A：到时候再看天气吧。
  A：一篇一千五，时间很紧，你再考虑下。
  B：报酬再高也不接整篇，别把我排进去。
  A：导师那边我能打招呼，你真不用担心。
  B：这种承诺我不参与，辅导内容也要公开透明。
  A：好，我把你从写稿名单里拿掉。
  B：谢谢，之后有正规辅导可以再联系。
  A：你新买的耳机怎么样？
  B：降噪挺明显的。
  A：戴久了耳朵疼吗？
  B：目前还好，重量比较轻。
  A：那我也去店里试试。
  B：最好别只看网上评价。
  A：对，耳型不一样。
  A：那你能不能先看一下这几份提纲？
  B：可以讨论结构，但需要学生本人参加。
  A：有些人不想露面，只想拿现成稿。
  B：这种需求我不接，不能把成果替别人完成。
  A：那就只做逐段批注。
  B：可以，意见要让作者自己消化和改写。
  A：我之前说一千五一篇确实容易让人误会。
  A：午餐分摊我现在补给你。
  【系统消息】A 向 B 转账 92 元，已收款。
  【5月7日】
  B：服务内容和收费要对应，不要按整篇交付报价。
  A：午饭点了什么？
  B：鸡肉饭，味道一般。
  A：那下次换一家。
  B：旁边面馆还行。
  A：我记得你不吃香菜。
  B：可以备注不要。
  A：好，我记下来。
  A：查重保证我也会删掉。
  B：还要说明不承诺任何检测结果。
  A：导师那边我不再提打招呼。
  B：学术评价应该走正常沟通渠道。
  A：我把群里那几个人也说明一下。
  B：让他们知道这是辅导，不是代写。
  A：窗边那盆花开了吗？
  B：开了两朵小白花。
  A：拍照看看。
  B：等下阳光好一点拍。
  A：一定很好看。
  B：还挺香的。
  A：我去闻了下，淡淡的。
  A：如果学生不愿意参与，我就不排这个服务。
  B：对，学习过程必须由本人完成。
  A：这样单子会少很多。
  B：做清楚边界比做不合适的业务重要。
  A：收到，我会把之前的宣传改掉。
  B：改好后发我看看表述。
  A：周五要下班聚餐吗？
  B：我可能赶不上，家里有事。
  A：没关系，下次再约。
  B：你们先吃。
  A：我把菜单发群里。
  B：别点太辣的。
  A：我会备注。
