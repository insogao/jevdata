conversation: |-
  【12月6日】
  A：合作方，节前我想找你见一面，你哪天方便？
  B：这阵子还行，怎么突然约我？
  A：我交的门店入驻申请一直没等到消息，想问问现在大概什么情况。
  A：午休还会睡过头吗
  B：现在定两个闹钟
  A：挺好，下午不容易迟到
  B：我把手机放远点了
  A：下午精神好多了
  B：晚上别再刷太久
  【12月7日】
  A：我把视频关掉了
  B：我这边只能按收到的先后看，不能单独改顺序。
  A：之前咱们有过几次合作，我一直记得你平时的照应。
  B：见面没问题，真不用带东西。
  A：你常坐的那家车行方便吗
  B：挺方便，等车不久
  A：我下周可能要用车
  B：提前预约就行
  A：我用手机看了路线
  【12月8日】
  B：公交直达比较快
  A：那挺省事的
  A：我给你准备了张购物卡，面值没问，就当节前一点心意。
  【系统消息】A 向 B 转账 300 元，已收款。
  B：单位发的福利卡按单位规矩登记，私人送的我不能收。
  A：你上次借的那本书呢
  B：看到最后两章了
  A：不急，慢慢看
  B：周末我还给你
  【12月9日】
  A：后面挺有意思的
  B：那你继续看吧
  A：我今晚看完
  A：我那份门店入驻申请，你有空时帮我留意一下行吗？
  B：我只能按正常流程来，不会因为关系或礼物提前。
  A：嗯，我懂的。
  A：你那台电动车补胎了吗
  B：补好了，师傅说扎了个小钉子
  A：慢点骑，路边碎石多
  【12月10日】
  B：嗯，现在打气也正常了
  A：我把打气筒也放车筐里
  B：路上遇到问题能处理
  A：不过还是先找修车店
  B：卡你先带回去，有进展会照平时方式告诉你。
  A：上次说的门店入驻申请，最近有进展吗？
  B：我会照先后跟进，有变化再按原来的方式通知。
  A：好，我拿回去，节前就正常见面。
