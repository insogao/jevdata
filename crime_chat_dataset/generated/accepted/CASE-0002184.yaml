conversation: |-
  【5月12日】
  A：姐，节前我想找你见一面，你哪天方便？
  B：这阵子还行，怎么突然约我？
  A：冰箱里的馄饨还吃吗
  B：还有一盒，周末煮掉
  A：别放太久了
  B：知道，我今晚就拿出来
  A：我放冷藏室解冻了
  B：晚上煮的话正合适
  A：我交的集市摊位申请一直没等到消息，想问问现在大概什么情况。
  B：我这边只能按收到的先后看，不能单独改顺序。
  A：咱俩是亲戚，我一直记得你平时的照应。
  A：你办公室那盆小树怎么样
  B：新叶子长出来了
  A：看来换位置有效
  B：是，靠窗但不晒直射
  【5月13日】
  A：我每周转一下花盆
  B：这样长得会均匀些
  B：见面没问题，真不用带东西。
  A：本来想带张购物卡，面值没问，想节前送你。
  A：水壶烧水还会响吗
  B：声音小多了，清理过水垢
  A：那就不用换新的
  B：用着挺顺手的
  A：我买了个滤网
  B：清水垢更省事
  B：单位发的福利卡按单位规矩登记，私人送的我不能收。
  A：我那份集市摊位申请，你有空时帮我留意一下行吗？
  A：手机壳颜色选好没
  B：选了深蓝色
  A：耐脏，挺适合你
  【5月14日】
  B：我也是这么想的
  A：到货了我拍给你看
  B：不用急，慢慢挑
  B：我只能按正常流程来，不会因为关系或礼物提前。
  A：嗯，我懂的。
  B：那就先别带卡来，后续有进展照常通知。
  A：咳嗽好些了吗
  B：夜里已经不怎么咳
  A：温水多喝点
  B：嗯，药也按时吃
  A：今天白天也好多了
  B：那挺好，晚上早点休息
  A：上次说的集市摊位申请，最近有进展吗？
  B：我会照先后跟进，有变化再按原来的方式通知。
  A：明白，那卡就不带了，节前正常见面。
