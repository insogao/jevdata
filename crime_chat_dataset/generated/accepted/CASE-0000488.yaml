  B：会不会是那种要先交钱或者办卡的
  A：不用卡不交押金，就扫码登记入库，账我这边都留着，随时对
  B：那我先去看看环境
  A：行，明晚六点驿站见
  【11月5日】
  B：学长，昨晚谢谢你占的座，我八点去差点没位置
  A：客气啥，我今天不去图书馆，你随意
  B：那你常坐那角我给你留上，你晚上来不
  A：晚上不去，全天守驿站，你帮我留着我改天去自习
  B：好
  B：我到北门了
  A：来吧，直接进
  B：店里件好多啊，都堆到门口了
  A：这还算少的，双十一得翻三倍
  B：扫码入库复杂吗
  A：一学就会，你先看我一单
  B：我试了十单了，挺顺手
  A：挺灵，今晚你就正式上，时薪另算
  B：成
  A：今晚收工，你入了260件，工时3小时，账先记着，跟后面的一起结
  B：行，不急这一晚
  A：单子我都留着，回头一笔笔给你对
  【11月6日】
  A：今晚还来不，预报件量更大
  B：来，正好晚上没课
  A：好，六点到
  B：学长，食堂新开那个麻辣香锅窗口你去过没
  A：去了，排半小时，味道还行，就是油大
  B：那我晚上下班去试试，你们驿站附近还有吃的没
  A：北门一条街都是，你收工顺路吃
  B：好嘞
  A：今晚单量破千，你入了480件，工时4小时，接着记账上
  B：好嘞，胳膊都有点酸了
  A：明天量还大，你掂量着来，别累着
  【11月7日】
  B：今晚照旧，我室友也想来，还有活吗
  A：来，正缺人，让她也六点到
  B：她问要不要带什么证
  A：啥证都不用，学生卡都不看，到场扫码上岗就行
  B：好，那她跟我一起
  A：恩
  A：中午吃了吗
  B：在图书馆啃面包，赶论文
  A：别糊弄自己，中午吃口热的
  B：晓得，晚上去吃香锅再上岗
  A：带上你室友，完事一起干活
