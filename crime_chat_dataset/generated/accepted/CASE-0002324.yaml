  A：嗯，分两天做，腰不行了。
  B：不用专门准备礼物，见面聊会儿就行。
  A：就是个那张小卡，我没留意面值，图个节日气氛。
  B：收到啦，谢谢。不过你先别急着走，我得确认下单位对这类礼物怎么处理。
  B：你上次推荐的茶我买到了，味道不错。
  【9月7日】
  A：那个不太苦，晚上喝也还好。
  B：我泡淡一点，正合适。
  A：喜欢就好，我也常买。
  A：没啥贵重的，你别有负担，大家节前都互相问候一下。
  B：我会按规定登记或退回，免得之后说不清。
  A：对了，我前阵子提交的材料是不是还差点什么？
  B：我可以提醒你公开清单里的材料要求，具体进度还是按队列走。
  A：这两天风大，你出门记得带外套。
  B：早上还挺暖的，下午就降温了。
  A：我昨天没看天气，差点冻着。
  B：我包里常放个薄围巾，方便。
  【9月8日】
  A：你方便的时候帮我多看一眼就行，我不是催你。
  B：所有人都按同一标准，我不会因为礼物改顺序或结果。
  A：明白，礼物跟那件事没关系，你照常办。
  B：好，材料齐全后会按流程通知。
  A：那卡你看怎么处理合适，我不想让你为难。
  B：我按规定处理，之后咱们也照常沟通工作。
  B：不急，我家还有一个备用的。
  A：那我放在会议室柜子里了。
  B：看到了，谢啦。
  B：对了，楼下咖啡店换菜单了。
  A：有啥新口味？
