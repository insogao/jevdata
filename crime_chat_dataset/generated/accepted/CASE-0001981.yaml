  B：那我把阳台衣服洗了
  【9月29日】
  A：前几天见面聊到的我那份摊位申请，之后你有空时帮我留意下进度就行。
  B：材料都按顺序处理，有消息会照常通知。
  A：明白，我就是问问，节前事情多辛苦啦。
