  B：你好，记得的。你最近怎么样。
  A：明晚方便吗？我来定地方，离单位不远。
  B：明晚可以，别订太正式的地方。
  A：好，就附近那家家常菜馆。顺便带一点节日小心意。
  B：吃饭可以，东西真不用特意准备。
  A：最近肩膀还酸吗
  B：好多了 我换了个枕头
  A：我也是坐久了就僵
  B：每隔一会儿起来走走
  A：对 我现在设了个闹钟
  B：挺好 别硬扛
  【9月25日】
  A：你上次说的那个保温杯买了吗
  B：买了 挺轻的 不漏水
  A：我还在挑颜色呢
  B：深色耐脏一点
  A：那我去店里看看实物
  B：行 线上图有时不准
  A：我到门口了，你慢慢来。
  B：刚出来，马上到。
  A：这个给你，一张小购物卡，过节图个方便。卡面金额我也没仔细看。
  B：你太客气了，心意我收下，下次别这么见外。
  B：今天聊得挺轻松的，回去路上注意。
  A：好呀，你也早点休息。
  【9月26日】
  A：你家小狗最近还挑食吗
  B：这周好点了 换了个碗
  A：哈哈它还挺会挑
  B：猫也一样 不喜欢就不碰
  A：看来得慢慢试
  B：嗯 先不折腾它了
  【9月27日】
  A：你那边月底也要补台账吗
  B：要啊 这周在核一遍
  A：我们刚换了新版表格
  B：我也收到了 看着清楚些
  A：就是填起来多两栏
  B：熟悉了就快了
  【9月28日】
  A：这几天早晚温差也太大了
  B：是啊 我中午还穿短袖呢
  A：我早上出门带了件外套
  B：带着好 晚上风一吹就冷
