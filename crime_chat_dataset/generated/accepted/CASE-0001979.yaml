conversation: |-
  【9月24日】
  A：何老师您好，我是小林，之前朋友介绍我们认识的。节前有空一起吃个便饭吗。
  B：你好，记得的。你最近怎么样。
  A：明晚方便吗？我来定地方，离单位不远。
  B：明晚可以，别订太正式的地方。
  A：好，就附近那家家常菜馆。顺便带一点节日小心意。
  B：吃饭可以，东西真不用特意准备。
  A：附近新开了家面馆你去过没
  B：去过一次 汤还不错
  A：我上次点的拌面有点咸
  B：那你下次试试番茄鸡蛋面
  A：好 我记下了
  B：中午人少点再去
  A：我同事说那家早上也卖豆浆
  B：那可以试试看
  A：周末我路过买一份
  A：你最近还坐地铁吗
  B：基本都坐 开车找位太费劲
  A：我这两天改骑车了
  B：路上注意点 早高峰车多
  A：就两站路 还挺方便
  B：嗯 下雨我就不骑了
  A：我现在会提前十分钟出门
  B：这样不容易慌
  【9月25日】
  A：家里老人最近身体还好吧
  B：挺好的 就是老问我啥时回去
  A：节前路上票不好买
  B：我提前看了一下 还没放票
  A：放票那天记得设个提醒
  B：好的 我叫我弟也盯着
  A：我姐说能帮我一起看票
  B：有人一起弄省心
  A：我到门口了，你慢慢来。
  B：刚出来，马上到。
  A：这个给你，一张小购物卡，过节图个方便。卡面金额我也没仔细看。
  B：你太客气了，心意我收下，下次别这么见外。
  B：今天聊得挺轻松的，回去路上注意。
  A：好呀，你也早点休息。
  A：前几天见面聊到的园区那份申请，之后你有空时帮我留意下进度就行。
  B：材料都按顺序处理，有消息会照常通知。
  A：明白，我就是问问，节前事情多辛苦啦。
  B：不客气，缺什么会统一联系，不用专门跑一趟。
