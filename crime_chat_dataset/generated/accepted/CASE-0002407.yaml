  A：玻璃的重一点，塑料的轻便。
  B：那我先买个轻的试试。
  A：挺好，记得看下能不能微波。
  A：我把上周的文件夹也归档了，桌面终于清爽点。
  B：我也该整理一下，找东西太费时间。
  【10月18日】
