title: other_illicit_coordination/homework_ghostwriting_ring
conversation: |-
  【5月6日】
  A：这周有三篇要排给你，按篇一千五，老规矩。
  B：是给他们看提纲，还是整篇都要写？
  A：整篇交付，查重我保过，导师那边我打招呼。
  B：这个已经不是润色了，我不能替学生完成作业。
  A：你只负责稿子，学生自己交，流程一直这样。
  B：我可以做结构辅导，但不能做成可直接提交的文章。
  A：每篇一千五，交稿后再结，时间也不长。
  B：费用不重要，关键是不能冒充学生的成果。
  A：那你先帮忙改语言，别在群里说太多。
  B：我可以公开做语言反馈，身份和边界都写明。
  【5月7日】
  A：你上次买的书到了吗？
  B：到了，封面没有折。
  A：我准备周末开始看。
  B：前几章挺轻松的。
  A：那不错，通勤也能看。
  B：我先放包里了。
  A：别忘了带回家。
  A：导师那边我能沟通，你不用担心查重。
  B：别替我承诺这种事，我不参与代写。
  A：行，那这批我找别人，你只接辅导。
  【5月8日】
  B：可以，辅导要学生本人参与讨论和修改。
  A：明白了，后面我把服务内容分清楚。
  B：写清楚范围，大家都省得误会。
  A：如果只做辅导，你想怎么安排？
  B：学生本人参加，先讲思路，再给修改建议。
  A：那就不按整篇的价格算了。
  B：收费要对应实际辅导时长和内容。
  A：最近食堂换窗口没？
  B：多了个砂锅档。
  A：味道怎么样？
  【5月9日】
  B：汤还行，米饭有点软。
  A：下回我试试面。
  B：中午去要早点。
  A：我知道，十二点最挤。
  A：查重保障那句我会从介绍里删掉。
  B：也不要暗示能影响老师的判断。
  A：好，服务说明我重新写。
  B：把学生要完成的部分也写清楚。
  A：我会跟他们说必须自己写主体。
  B：这样才是学习辅导，不是代替完成。
  【5月10日】
  A：这几篇我已经取消了，不让你接。
  B：谢谢，之后只按公开说明接辅导。
  A：你键盘清理了吗？
  B：用刷子清了一遍。
  A：灰好多吧。
  B：真的，差点能种菜。
  A：我也该清理桌面了。
  B：周五收一下。
  A：好，别拖到月底。
