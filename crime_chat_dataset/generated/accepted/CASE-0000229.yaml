  B：早卖了，你要买去闲鱼看
  A：算了，懒得折腾
  B：你那车不是还挺好
  A：费油
  【9月6日】
  A：第一批三个点都好了
  B：这么快，没人看见吧
  A：早上人少，两分钟一个
  B：那第二批什么时候上
  A：等第一批回本再说，稳点
  B：嗯，慢就是快
  B：楼下新开了家面馆，去尝没
  A：还没，好吃吗
  B：一般，牛肉切得薄
  A：那不去踩雷了
  B：还是老地方靠谱
  【9月7日】
  A：这两天数据开始回来了，你那边盯着点
  B：嗯，安全起见周末先停一停
