  A：这周先别急，等东西到位
  B：嗯，我这边把时间摸清楚
  A：中午又吃那家黄焖鸡？
  B：便宜量大，主要是快
  A：你行，天天吃不腻
  B：月底钱紧，将就下
  【9月3日】
  A：东西到了
  B：全到了？试过没
  A：到了，跟你上回量的那个口子对得上
  B：那就好，别到时候卡不进去白忙
  A：不会，型号早就对过了
  B：你那孩子这学期还报奥数不
  A：报，周末两天全搭进去了
  B：现在孩子苦，家长也苦
  A：没办法，班里都报
  【9月4日】
  B：算了三天，取款高峰就那两段
  A：哪两段，发我
  B：早上上班前，还有傍晚下班的点
  A：那个点人杂，正好
  B：人多才不好盯着一个人
  A：对，我就等你这句话
  B：晚上风大，你那窗户关没
  A：关了，我媳妇嫌吵
