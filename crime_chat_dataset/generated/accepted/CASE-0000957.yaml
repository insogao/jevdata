conversation: |-
  【11月2日】
  A：你表弟还在做招聘中介吗？我有个需求想问你。
  A：手机提示快没电，我找了根线。
  B：是，不过我不碰同事个人资料。
  B：包里常备一根挺方便。
  A：我想要你们部门电话和简历，按份给钱。
  B：这周要不要找时间去吃那家新开的店？
  A：午饭我打算带点水果。
  A：可以，我听说他们午市不太挤。
  B：这个天气吃点水果正好。
  B：那就挑个工作日去。
  A：好，我提前把时间空出来。
  A：家里水壶需要除一下水垢。
  B：那些信息没有授权不能给。
  B：泡一会儿就好，别用太硬的刷子。
  A：离职名单也算在内，方便筛选。
  A：我周末准备把阳台收拾下。
  A：我晚上回去弄。
  B：最近落叶多，扫一下就清爽了。
  B：不急，慢慢来。
  A：还得把几盆花挪个位置。
  B：别一次搬太多，慢慢来。
  A：楼下新装了个快递柜。
  【11月3日】
  B：我不会整理或转发任何同事资料。
  A：你就当帮家里人个忙。
  B：取件应该比以前方便。
  B：关系归关系，个人信息还是要保护。
  B：你最近有在听什么节目吗？
  A：我刚才已经试过一次。
  A：听了个讲城市生活的，挺轻松。
  B：我也找来听听，通勤时正好。
  B：操作顺不顺？
  A：每集不长，可以试试。
  A：那你至少告诉我谁最近想换工作？
  A：今天阳光不错，我把窗户开了一会儿。
  B：我不能替别人透露求职意向。
  A：好吧，我去招聘网站找。
  B：屋里空气流通会舒服些。
  A：今早买的面包还挺新鲜。
  B：哪家店？我下次路过买点。
  A：晚上可能有风，我会记得关。
  A：车站出口那家，早上刚出炉。
  B：记下了。
  B：好。
  B：用公开渠道更合适。
  【11月4日】
  A：我不会再问你要资料。
  A：这周我想早点休息。
  A：早晨风有点凉，你今天走哪条路上班？
  B：我坐公交，正好不用在外面等太久。
  A：那挺好，我也想少开几次车。
  B：最近确实容易累。
  B：天气再暖些骑车会舒服。
  B：谢谢理解。
  A：把手机放远一点试试。
  A：晚点我把公开岗位发你看看。
  B：可以，求职者主动联系就行。
  B：这样挺好。
  A：我把旧日历提醒清理掉了。
  B：留下需要的几项就行。
  A：现在看着没那么乱。
  B：一目了然。
  A：公交今天来得很及时。
  B：我早上也没等多久。
  A：出门时间刚刚好。
  B：挺顺的。
  A：晚上准备做个简单的炒菜。
