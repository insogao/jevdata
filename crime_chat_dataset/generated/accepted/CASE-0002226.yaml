conversation: |-
  【7月9日】
  A：师傅，节前我想找你碰个面，你哪天有空？
  B：这两天还好，你有什么事？
  A：那双棉鞋合脚吗
  B：合脚，里面挺暖和
  A：走路别穿太厚的袜子
  B：知道，试过了
  A：穿着走路不磨脚吧
  B：不磨，鞋底也软
  A：那挺好的
  A：之前交的临时摊位登记表一直没听到动静，想问问进度。
  B：我能看到大概进到哪一步，具体还是按统一次序走。
  A：上次你说可以再来问，节前想当面跟你道个谢。
  A：你最近在阳台种什么
  B：种了点香菜和葱
  A：做菜时摘一点正好
  B：长得慢，先等等
  A：我浇水没浇太多
  B：叶子看着还不错
  A：香菜出苗慢些
  B：见面可以，不用带什么。
  A：我备了张购物卡，面值没问，节前一点心意。
  【系统消息】A 向 B 转账 300 元，已收款。
  A：今天地铁人多吗
  B：还好，我错开了早高峰
  A：那你路上轻松点
  【7月10日】
  B：是，比昨天快些
  A：我听了会儿播客
  B：路上时间快些
  A：最近听什么主题
  B：单位发的福利卡按单位规定走，个人送来的我不能收。
  A：我交的临时摊位登记表，你有空时能帮我留意一下吗？
  A：你买的茶杯盖严实吗
  B：挺严实，倒过来也不漏
  A：那正好带去上班
  B：我已经放包里了
  A：装热水后还挺方便
  B：喝完盖好就行
  B：我只按同一套规则办，不会因为认识就提前。
  A：嗯，知道的，我就是问问。
  B：这张你拿回去，后面有消息我照常告诉你。
  A：周末要不要去旧书店
  B：可以，下午一起去
  A：我想找本菜谱
  B：那边有个旧书区
  A：上回买的那本还没读完
  B：那就先别买新的
  A：之前那份临时摊位登记表现在有消息了吗？
  B：我会按提交先后跟进，有变化就按原来方式通知。
  A：好，那东西我拿回去，节前正常见面。
