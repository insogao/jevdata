conversation: |-
  【9月3日】
  A：你能从学校系统看下那孩子的成绩吗？
  A：班主任系统点一下就好，红包已发。
  A：插一句，快递到了，我放门卫室了。
  B：真的？我还不知道。
  A：你试过吗？
  B：上周刚弄过，挺方便。
  A：收到，我也试试。
  B：嗯，别忘了就好。
  【9月4日】
  A：截图就行，家长只是想提前知道升学情况。
  B：我不能越权查成绩或发截图。
  A：上次你垫的午饭钱我还你了，和刚才说的事无关。
  【系统消息】A 向 B 转账 42 元，已收款。
  A：换个轻松的，这两天降温，记得带外套。
  B：听着不错。
  A：你什么时候有空？
  B：周末应该可以。
  A：那到时再确认。
  B：好呀。
  B：请监护人通过学校正式渠道申请查询。
