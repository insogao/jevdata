  A：周末水库去不去，老周说口不错
  B：去，正好我新买的竿子没开张
  A：说定了，周六早上六点我接你
  B：六点太狠，六点半
  A：行，六点半，带上回那罐酒
  B：下月那个车展你参展不
  A：参，你行里不也订了展位
  B：到时候给你留两张内场票
  A：行，正好看车
