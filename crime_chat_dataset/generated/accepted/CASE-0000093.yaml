  A：对对，就那种，你那儿有货？
  B：有，上批车队管理剩了几个
  A：那正好，别浪费
  B：不过那哥们一周一换车，你这玩意儿得跟着挪，麻烦
  A：挪就挪，每挪一回加五百辛苦钱
  B：你这是铁了心要盯他
  A：合同的事卡在他手里，不摸清底细我心里没数
  B：理解，生意人嘛
  A：对了，你行里洗车那位还在不，我那车该保养了
  B：在，我让他周四给你留位
  A：行，顺便把轮胎前后调换下
  B：那手艺没问题
  A：那玩意儿什么时候能上
  B：明晚，他后天一早取车，今晚我提前弄
  A：行家。装完你给我个能看的位置，我手机上瞅个大概就行
  B：我给你开个子账号，只看这一台
  A：稳
  A：他手机上也帮他装一个呗，他天天用导航，回头想想辙
  B：手机的事急不得，先把车上的弄利索
  A：也行，一步步来
  【10月9日】
  B：昨晚齐活了，位置发你小程序了
  A：我看看……嘿，这会儿停在他家小区
  B：准着呢
  A：这钱怎么算
  B：磁吸那几个成本八百，头回装算两千，往后每挪一次加五百
  A：行，先转三千定金，后头月结
  【系统消息】A 向 B 转账 3000 元，已收款。
  B：收到
