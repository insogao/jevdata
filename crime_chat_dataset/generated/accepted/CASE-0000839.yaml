  A：我差点穿短袖去上班。
  B：中午热一点，带件薄的方便。
  A：我把围巾也放包里了。
  B：这个季节挺实用。
  A：下周看起来会降温。
  B：那就提前把厚衣服翻出来。
  A：周末整理一下。
  B：别忘了晒晒。
  【9月11日】
  A：我转个红包，你截个图就行，不用写名字。
  B：我把红包退回，任何学生成绩都不会私下截屏。
  【9月12日】
  A：我只是想有个参考。
  B：请看学校发布的匿名统计，个人档案要由监护人正式申请。
  B：最近听说社区有旧书交换。
  A：我有几本闲置的小说。
  B：周六下午可以拿过去。
  A：需要提前登记吗？
  B：群公告里有表格。
  A：我晚上填。
  B：我也找几本带去。
  A：到时一起过去。
  B：好。
  A：顺便喝杯咖啡。
  【9月13日】
  A：好，我会按流程问，不再私下打听。
  【9月14日】
  B：这样就可以。
  A：中午想吃点清淡的。
  B：园区旁边新开了粥铺。
  A：走路远吗？
  B：五分钟就到。
  A：那我下楼看看。
  B：可以点小份试试。
  A：味道挺好的。
  B：下回我也去。
  A：我把地址记下了。
  B：周围还有家卖豆花的。
