conversation: |-
  【10月11日】
  B：周哥，好久没聚了
  A：忙，厂里三个单子赶一起了
  B：旺季了，你们满负荷吧
  A：满负荷，工人三班倒
  B：那利润可观
  A：利润是有，就是进项富余出一块，票压手里也烫手
  B：富余多少
  A：这季度能匀出六十万的量，老规矩，点数八个
  B：我这边正好缺成本这块，对得上
  A：那就细聊
  B：你们厂今年主要给哪几家做
  A：老主顾，量稳账期也稳
  B：我们今年也扩张，华东新开了仓
  A：好事，规模上去，这块需求也水涨船高
  B：可不，量一大缺的就是这块
  【10月12日】
  B：昨天的事，我心里有点打鼓
  A：打鼓正常，我先看受票方靠不靠谱，你们公司开三年了，业务真实报表干净，在我这算可靠的
  B：这话怎么讲
  A：票出去不是一张纸的事，合同、货单、资金，三样我都给你配齐，三流一致，谁来都对得上
  B：我这边要准备什么
  A：什么都不用备，按老规矩，票面金额的资金走一遍对公，点数单独结
  B：行，先来六十万的量试试
  A：好，我让财务把品名规格列给你，你们仓库认一下
  B：我在高速上堵死了，去苏州谈仓的事
  A：节后都这样，今晚几点到
  B：顺利八点，不顺利住服务区
  A：服务区泡面加火腿肠，出差标配
  B：你可太懂了
  【10月13日】
  A：品名规格发你邮箱了，让仓库看一眼
  B：看了，都对得上，就按这个来
  A：那把点数结了，我往下排
  B：八个点，六十万，四万八对吧
  A：对，四万八
  B：我现在转
  【系统消息】B 向 A 转账 48000 元，已收款。
  B：转了，查收
  A：收到，票周三前安排好，一次开齐
  B：中，合同货单一并给我
  A：都配好，一个袋子装齐
  B：周末去水库钓了没
  A：去了，空军，就俩白条
  B：哈哈，你这技术还交场地费
  A：钓的是心境，你不懂
  【10月14日】
  A：票开好了，明天人来拿还是发顺丰
  B：让人来拿，顺带把合同货单带走
  A：行，到时候对下份数，别少页
  B：你们这服务比正主还周到
  A：干这行靠细节，拿人点数就得办瓷实
  B：走账那边呢
  A：你财务按合同上的数走对公就行，别的不用管
  B：中，下季度还这个量，稳着来
  A：成，细水长流
