conversation: |-
  【5月13日】
  A：楼下新开了包子铺
  B：我买了豆沙包
  A：味道怎样
  B：不太甜
  A：我也买点
  A：我先记下，之后再跟你说。
  B：好，忙完再说。
  A：手里有些旧的人事资料，想问你有没有兴趣。
  B：这些资料里有同事的联系方式和简历吗？
  A：有一整批部门联系方式，还有简历和离职名单。
  B：这涉及个人信息，没有本人同意不能卖。
  A：有人愿意按份收。
  B：我不会买、转发或帮你联系买家。
  A：那我先放着。
  B：请停止传播，并按公司流程删除或交还。
  【5月14日】
  A：今天阳光不错
  B：中午出去走了走
  A：园区人多吗
  B：还好
  A：我下午也出去
  A：我先记下，之后再跟你说。
  B：好，忙完再说。
  【5月15日】
  A：中间人还在问那批资料。
  B：我已经说过不参与。
  A：他想先看一小部分。
  B：不要发送任何员工信息或简历。
  A：我不发了。
  B：如果资料来自单位，应交给隐私或人事负责人处理。
  【5月16日】
  A：周会提前了吗
  B：改到九点半
  A：我更新日历了
  B：我也收到了
  A：好
  A：我先记下，之后再跟你说。
  B：好，忙完再说。
  A：我把那份文件交回公司了。
  B：谢谢，后续请勿保留副本。
  A：我也告诉对方不再联系。
  B：好，员工信息只能在授权范围内使用。
  A：明白。
  B：有正当招聘需求可以走公开渠道。
