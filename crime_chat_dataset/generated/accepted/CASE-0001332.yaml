conversation: |-
  【9月3日】
  A：你好，听说你们部门近期有人离职
  A：我们不讨论员工个人情况
  B：有整个部门电话，做个触达名单很快
  【系统消息】B 向 A 转账 38 元，已收款。
  A：奶茶钱收到了，刚才你垫的我补给你了。
  A：联系方式不能未经同意转给外部
  B：简历按份卖的资源我能给你
  A：你家猫好点了吗
  B：好多了，已经肯吃饭
  A：那就放心了
  B：医生让再观察两天
  【9月4日】
  A：我补充一句，别误会
  A：不需要，候选人自己提交即可
  B：离职名单给个大概也行
  A：这类信息我们不会分享
  B：我只是帮你们补人，省点时间
  A：可以转发公开岗位链接
  A：午饭订哪家
  B：我选了那家盖饭
  A：别加香菜，记得备注
  B：放心我也不吃香菜
  【9月5日】
  A：你有空再回我就行
  A：那你给我HR私人号码呢
  B：请用网站上的公共联系入口
  A：我把那份表删掉了
  B：谢谢，也别再转发
  A：明白，以后只发公开职位
  A：最近在看什么剧
  B：一部轻松的生活剧
  A：好看吗，别太虐就行
  B：不虐，适合下饭
  【9月6日】
  A：今天那边有新消息吗
  A：下班要买菜吗
  B：买点青菜和鸡蛋
  A：我冰箱还有豆腐
  B：那我顺路带点水果
  【9月7日】
  A：我把范围重新想了下
  A：你家猫好点了吗
  B：好多了，已经肯吃饭
  A：那就放心了
  B：医生让再观察两天
  B：别把猜测写成事实
  【9月8日】
  A：最后确认一下
  A：午饭订哪家
  B：我选了那家盖饭
  A：别加香菜，记得备注
  B：放心我也不吃香菜
  B：那我只留公开且必要的部分
  B：就按公开、授权、和讨论本身有关的范围来，其他内容我不参与。
