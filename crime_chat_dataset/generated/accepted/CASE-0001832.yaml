conversation: |-
  【9月25日】
  A：堂妹，节前你哪天方便？节前回家吃饭时顺便聊聊
  B：这两天事情有点多，怎么突然想见面？
  A：你晚饭吃啥
  B：煮面吧，回来晚了
  A：加个蛋就行，别只吃泡面
  B：知道啦，冰箱还有青菜
  A：我回家就煮，十分钟搞定
  B：不错，青菜别忘了洗
  A：已经泡上了，哈哈
  A：想问问那份资料的进展，也好提前安排一下。
  B：那份资料都按统一顺序处理，我只能看流程到哪一步。
  A：咱们是亲戚，就是想当面谢谢你平时照应。
  A：今天路上堵不堵
  B：桥那边在修路，有点慢
  A：我绕小路走了
  B：明早我也早点出门
  A：我把导航收藏一下
  B：好，明早看路况再决定
  A：嗯，别到时候又迟到
  B：吃饭可以，带东西就不用了。
  A：我给你带了张购物卡，面值没问，节前一点心意。
  【系统消息】A 向 B 转账 300 元，已收款。
  A：你上次说的鞋到了吗
  B：到了，码数刚好
  A：那不错，走路舒服不
  【9月26日】
  B：还行，先穿两天看看
  A：那先穿着试试，不磨脚就好
  B：对，走多了再看
  A：嗯，周末再告诉你
  B：私人给的我不能留，单位统一发的福利卡才按公司规矩登记。
  A：我那份那份资料，能不能有消息时帮我留意一下？
  A：周末要不要去逛书店
  B：可以啊，下午人少点
  A：那我把地址发你
  B：收到，顺便喝杯咖啡
  A：正好我也想买支笔
  B：那家文具区挺全的
  B：我不能因为认识或收礼就给谁调顺序，都是照同一套要求办。
  A：嗯，我知道，就是问问。
  B：你把东西拿回去，按正常流程等通知。
  A：你家猫还挑食吗
  B：好多了，换了新粮
  A：别一下换太多吧
  B：嗯，我掺着旧的喂
  A：旧粮我还留了一点
  B：慢慢掺就好，别换太突然
  A：前两天提的那份资料，现在有消息了吗？
  B：我会按提交顺序看，有变化走正常通知，不会单独插队。
  A：明白，那就照规矩来。卡我带回去。
