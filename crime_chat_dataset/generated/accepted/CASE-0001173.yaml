conversation: |-
  【10月8日】
  A：我认识的中介说缺名单，想要整个部门电话和离职名单。
  B：同事资料不能随便给。
  A：我刚看到部门聚餐的通知。
  B：我也看见了，信息蛮清楚。
  A：你想怎么安排？
  B：先照原计划来，之后再确认。
  A：行，有变化互相说。
  B：好呀。
  A：我把时间也记下来了。
  B：好，临时有变化再说。
  A：最近天气转凉，出门多带一件。
  B：收到，正好我有外套。
  A：那我先去忙啦。
  【10月9日】
  A：他说简历按份卖，按份结算。
  B：我不会拿别人的简历换钱。
  A：今天想到文具采购，上次说还没定。
  B：现在定下来了。
  A：需要我搭把手吗？
  B：不用，已经弄好了。
  A：那太好了。
  B：嗯，少一件惦记的事。
  A：我把时间也记下来了。
  B：好，临时有变化再说。
  A：最近天气转凉，出门多带一件。
  B：收到，正好我有外套。
  A：那我先去忙啦。
  【10月10日】
  A：说不定有人正好想换工作呢。
  B：是否求职要本人决定，不能替他人做选择。
  【10月11日】
  A：我让中介放招聘信息，等人来投。
  B：这样才合适。
  A：顺便问下，地铁延误定了吗？
  B：刚收到确认，按原计划。
  A：时间方便吗？
  B：还行，不需要再调整。
  A：那就好，省点心。
  B：嗯，最近事情有点多。
  A：我把时间也记下来了。
  B：好，临时有变化再说。
  A：最近天气转凉，出门多带一件。
  B：收到，正好我有外套。
  A：那我先去忙啦。
  【10月12日】
  A：好，名单我不传。
  B：谢谢。
