  A：班主任系统点一下，升学信息也能一起确认。
  B：没有监护人授权，不能打开或转发。
  A：红包已发，截图就行，咱们认识这么久了。
  A：对了，午后散步你打算什么时候弄？
  B：我准备周末处理。
  A：需要提前准备吗？
  B：不用，我都列好清单了。
  A：你做事还是挺有条理的。
  B：哈哈，怕临时忘记。
  A：我把午后散步的时间记下来了。
  B：好，免得临时忘。
  A：最近天气变化快，出门看一眼预报。
  A：对了，办公桌整理你打算什么时候弄？
  B：我准备周末处理。
  A：需要提前准备吗？
