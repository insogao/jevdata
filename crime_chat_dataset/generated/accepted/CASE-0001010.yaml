  A：最近日程排得满吗？
  B：还好，周四以后松一点。
  A：那就别把自己排太紧。
  B：收到，我留点空。
  A：我把周末聚餐的时间记下来了。
  B：好，免得临时忘。
  A：我路上看到天气降温相关的通知了。
  B：我也看见了，信息挺清楚。
  A：你觉得要改计划吗？
  B：先按原来安排，到时再看。
  A：行，有变化再说。
  B：好，回头联系。
