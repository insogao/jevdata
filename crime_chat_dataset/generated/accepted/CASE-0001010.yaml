  A：你做事还是挺有条理的。
  B：哈哈，怕临时忘记。
  A：我把办公桌整理的时间记下来了。
  B：好，免得临时忘。
  A：刚好想到打印文件，上次你说还没决定。
  B：今天问过了，时间合适。
  A：那结果不错呀。
  B：是的，不用再来回跑。
  A：能一次办妥最好。
  B：我也这么想。
  A：我把打印文件的时间记下来了。
  B：好，免得临时忘。
  【9月16日】
  B：我会退回，不会因为认识就越过流程。
  A：他们担心错过报名安排。
  B：让监护人直接找学校正式窗口问时间和要求。
  A：好，我让家长自己去办。
  B：谢谢，别人的档案我不会动。
  A：今天聊到周末聚餐，我才想起提醒你。
