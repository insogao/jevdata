  B：三月两张到货签收单，签字日期跟物流单差两天；还有一张调试记录没盖骑缝章
  A：日期是库房当天没人、事后补签的，我让人写份情况说明
  B：台账不齐，验收会上被人挑出去，大家都难看
  A：下午我亲自送过来，您给把把关
  B：三点以后吧，上午有个会
  【10月9日】
  A：科长，情况说明和补的章都送来了
  B：放着吧。哎，你们干企业的，也别光埋头干活
  A：您这话怎么讲
  B：这项目从头到尾，台账、验收、放量哪一环不是我盯着？周末加班给你们审资料，图啥
  A：辛苦辛苦。等尾款下来，怎么也得表示表示
  B：我不图表示，就图个心里有数
  A：数我们有。验收过了款一放，该有的辛苦费一分不会少您
  B：话到这份上就行，台账我这两天给你顺顺
  A：等您好消息
  【10月10日】
  A：科长早
  B：腰老毛病，阴天就疼，理疗做完半个疗程了
  A：您这腰得省着用，台账的事让您受累
  B：台账挑不出大毛病了，就剩放量栏要分管领导签，我帮你催
  A：尾款二十一万六，这周有戏不
  B：领导签完走支付流程，快则本周，慢则下周初
  A：那我让财务把发票先备好
  B：国庆回老家没，地里玉米收完没
  A：收完了，我爸非说今年棒子大，拍照发家族群
  B：哈哈，老人家实在
  【10月12日】
  B：领导签字拿了，支付流程今天推，你把收款账号发我对一遍
  A：发您了。科长，咱们之前说的那个数，怎么个给法
  B：公对公像什么话。你按技术服务费备一笔，三万，转我个人卡，卡号私发你
  A：三万，行。就是这个名义……
  B：名义你别管，备注写咨询费，别带公司名，你们项目群里半个字都别提
  A：明白，就咱俩知道，放款一到我就转
  B：先转后放。转了我这边流程推得踏实，省得台账再被谁翻出来说事
  A：……行，下午就转
  A：卡号存好了，四点前转您
  【系统消息】A 向 B 转账 30000 元，已收款。
  B：收到了，明天流程走完
  A：麻烦科长，应该的
  B：以后项目资料做齐整点，我也少翻几遍台账，腰也少疼点
  A：下次一定，让资料员一次做齐
  【10月13日】
  A：科长，款到没
  B：到了，二十一万六，你查下
  A：到了到了。回头请您喝杯茶
  B：茶可以喝，就咱俩，别招呼一帮人
  A：懂，就咱俩
  B：国庆返程你堵没？我看高速堵成一片红
  A：可不，四个钟头的路走了九个钟头，孩子后座都吐了
  B：所以说错峰，初二三再走多好
  A：初二我爸就催着回去了，说要赶秋收
  B：老人勤快一辈子，闲不住
  A：对了，验收会纪要发我一份呗，我们内部归档用
  B：我让人扫描发你，归档归齐点，往后查起来你也省心
  A：好嘞，这单总算圆满收尾
  B：下个项目招标公告出来记得早报名，别又卡着点
