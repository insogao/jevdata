  A：我中午去试试，别又排队。
  B：早点去吧，十二点后人多。
  A：好，回来给你反馈。
  B：要是不错我也去。
  B：我先看，空白栏不会先签。
  A：每一层会留一部分佣金，税点你们承担。
  B：比例、服务内容和税费都要有明细。
  A：你家那盆绿植最近怎么样？
  【系统消息】A 向 B 转账 460 元，已收款。
  A：这是上周会议室耗材的分摊，票据我发你。
  【9月2日】
  B：新长了两片叶子，挪到窗边了。
  A：我办公室那盆还没动静。
  B：别浇太勤，土干了再浇。
  A：好，回头试试。
  B：希望它快点长起来。
  A：做了这么多年，流程大家熟。
  B：熟归熟，账目也要能核对。
  A：那我把各层服务清单补上。
  A：周末你准备做什么？
  B：可能回家看看父母，带点水果。
  A：橙子最近挺甜的。
  B：我妈更喜欢梨，我买一小袋。
  A：挺好，路上别赶。
  B：嗯，坐地铁过去。
  B：请连同合同附件一起发财务。
  A：你看过附件了吗？
  A：你最近还在看那部剧吗？
  B：看完了，后半段比开头好。
  A：我还没看到一半。
