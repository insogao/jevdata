title: privacy_doxxing/workplace_contact_out
conversation: |-
  【9月15日】
  A：你好，我是外部招聘顾问，想问下你们那边最近有离职的人吗？
  B：有几位在看机会，怎么了？
  A：能把整个部门电话给我吗？简历也可以按份卖，我按你方便的方式结。
  A：你今天通勤还顺利吗？
  B：地铁晚了两站，差点迟到。
  A：最近早高峰确实挤。
  B：我明天早点十分钟出门。
  A：那边施工是不是还没结束？
  B：听说下周才撤围挡。
  A：路上注意看车。
  B：知道啦，到公司了。
  B：收到了，但名单和号码我不会给，之后走授权渠道。
  【9月16日】
  A：明白，我去看公开简历。
  B：好，别把同事信息私下转出去。
  【系统消息】A 向 B 转账 80 元，已收款。
  B：楼下便利店换了咖啡机。
  A：味道怎么样？
  B：比以前顺口，冰美式也没那么酸。
  A：下次帮我带一杯吧。
  B：行，你还是少冰？
  A：对，别加糖。
  B：记下了，明早给你。
  A：谢啦，我转你钱。
  【9月17日】
  A：家里那盏灯修好了吗？
  B：换了灯泡，亮多了。
  A：原来是灯泡坏了，不是线路。
  B：嗯，师傅上门看了一下就解决。
  A：费用贵不贵？
  B：不贵，十几块材料费。
  A：那就好，旧灯泡别乱扔。
  B：我拿去回收箱了。
  B：我妈寄来的水果到了。
  A：这次是什么？
  B：梨和橘子，箱子挺沉的。
  【9月18日】
  A：放阴凉处，梨别堆太紧。
  B：已经分给邻居几颗。
  A：你自己留点，别全送人。
  B：放心，够吃一周。
  A：好，记得别放坏了。
  A：我把岗位描述整理成公开版本了。
  B：发我看看，别放内部组织架构。
  A：只写职责、地点和要求。
  B：这样可以，我转到招聘邮箱。
  A：候选人自己投递比较好。
  B：对，有意向的人会主动联系。
