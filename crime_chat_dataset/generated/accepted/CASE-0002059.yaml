conversation: |-
  【10月23日】
  A：老朋友，节前我想找你碰一下，你哪天方便？
  B：这两天还好，什么事？
  A：这周末天气如何
  B：预报说周六有风
  A：那我把窗户关好
  B：下午在家收拾一下
  A：我看了另一家预报
  B：周日下午会转晴
  A：我之前交的场地申请表还没消息，想知道大概到哪了。
  B：我能看到流程走到哪一步，先后次序还是按统一安排。
  A：你之前说可以帮我问问，过节前想当面谢谢你。
  A：你新买的台灯亮不亮
  B：亮度可以，还能调色
  A：写东西眼睛会舒服点
  B：是，晚上不刺眼
  【10月24日】
  A：我放在床头了
  B：睡前别开太亮
  B：见面可以，别特意带东西。
  A：那张小卡我带来了，里面多少我没细看，节前一点心意。
  【系统消息】A 向 B 转账 300 元，已收款。
  A：早上那班车挤吗
  B：比昨天好一点
  A：我明天提早五分钟
  B：可以，路上不那么赶
  A：刚才看实时到站了
  B：省得站台等太久
  B：单位统一发的福利卡另有登记办法，私人送的我不能收。
  A：那天说的那件事，你有空时顺口提一下就行。
  A：你妈的药取到了吗
  B：取到了，先按时吃
  【10月25日】
  A：药盒放在桌上醒目些
  B：我已经摆好了
  A：我设了个手机提醒
  B：挺好，避免忘记
  B：不管熟不熟，我这边都只能照流程往下走。
  A：嗯，懂的，我就是想问问。
  B：那张卡你先拿回去，后面有消息我照常告诉你。
  A：那家面包店换菜单没
  B：多了个咸奶酪口味
  A：听着还行，改天试试
  B：周末路过我买两个
  A：你想吃甜口还是咸口
  A：前两天说的那份有回音了吗？我还在等着安排。
  B：我会按提交先后跟进，有变化走原来的通知方式。
  A：好，我知道了，东西我拿回去，节前正常见面。
