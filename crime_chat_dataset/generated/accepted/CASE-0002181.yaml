title: bribery_corruption/gift_card_channel
conversation: |-
  【3月20日】
  A：主管，节前我想找你见一面，你哪天方便？
  B：这阵子还行，怎么突然约我？
  A：昨天洗的外套干了吗
  B：阳台风大，已经干了
  A：衣服别晾太密
  B：我把间距留出来了
  A：我把窗户开了一会
  B：屋里味道散了
  A：我交的进修名额材料一直没等到消息，想问问现在大概什么情况。
  B：我这边只能按收到的先后看，不能单独改顺序。
  A：平时你挺关照我，我一直记得你平时的照应。
  A：午休还会睡过头吗
  【3月21日】
  B：现在定两个闹钟
  A：挺好，下午不容易迟到
  B：我把手机放远点了
  A：下午精神好多了
  B：晚上别再刷太久
  B：见面没问题，真不用带东西。
  A：本来想带张购物卡，面值没问，想节前送你。
  A：你常坐的那家车行方便吗
  B：挺方便，等车不久
  A：我下周可能要用车
  B：提前预约就行
  【3月22日】
  A：我用手机看了路线
  B：公交直达比较快
  B：单位发的福利卡按单位规矩登记，私人送的我不能收。
  A：我那份进修名额材料，你有空时帮我留意一下行吗？
  A：你上次借的那本书呢
  B：看到最后两章了
  A：不急，慢慢看
  B：周末我还给你
  A：后面挺有意思的
  B：那你继续看吧
  B：我只能按正常流程来，不会因为关系或礼物提前。
  【3月23日】
  A：嗯，我懂的。
  B：那就先别带卡来，后续有进展照常通知。
  A：你那台电动车补胎了吗
  B：补好了，师傅说扎了个小钉子
  A：慢点骑，路边碎石多
  B：嗯，现在打气也正常了
  A：我把打气筒也放车筐里
  B：路上遇到问题能处理
  A：上次说的进修名额材料，最近有进展吗？
  B：我会照先后跟进，有变化再按原来的方式通知。
  A：明白，那卡就不带了，节前正常见面。
