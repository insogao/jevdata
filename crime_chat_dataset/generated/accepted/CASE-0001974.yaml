  B：这类材料都按时间顺着看，我不方便替谁单独调整。
  A：平时你对我挺照顾，节前想当面谢谢你。
  A：你们家周末去公园吗
  B：可能下午走一圈
  A：带瓶水，最近挺晒
  B：好，我放包里
  A：我把水和帽子备好了
  【12月14日】
  B：那就不容易晒着
  A：嗯，下午太阳没那么大
  B：见面没问题，别专门准备东西。
  A：我给你带了那张卡，里面多少没细看，节前一点心意。
  【系统消息】A 向 B 转账 300 元，已收款。
  A：那本书你看到哪了
  B：看到一半，节奏挺慢
  A：后面会快起来的
  B：那我再读几章
  A：我今晚多看一会儿
  B：别熬太晚就行
  A：再看一章就睡
  B：单位发的福利卡要按单位的办法登记，私人送的我不收。
  A：上回提到的那件事，你有空时帮我提一句就好。
  A：你昨晚做饭了没
  B：煮了点粥，简单吃
  【12月15日】
  A：天热胃口也一般
  B：是啊，先吃清淡点
  A：我明天再煮些
  B：多放点南瓜也不错
  B：我只按统一顺序跟进，不会因为礼物或熟悉就提前。
  A：好，我就是问问，没别的意思。
  B：那张卡你带回去，之后还是按正常通知走。
  A：你那双雨鞋找到了吗
  B：在鞋柜最里面
  A：下雨天记得穿
  B：嗯，放门口了
  A：还擦干净放好了
  B：鞋底先看看有没有裂
  A：前几天聊的那个有消息没？我这边还等着安排。
  B：有更新我会照平时的方式通知，顺序不变。
  A：知道了，卡我拿回去，节前正常见面。
