conversation: |-
  【12月13日】
  A：领导，节前想跟你见面聊聊，你哪天有空？
  B：我看看安排，怎么了？
  A：阳台的小番茄熟了吗
  B：还青着呢，再晒两天
  A：别着急，熟了才甜
  B：嗯，我先不摘
  A：我给它搭了个小架
  B：枝条不容易倒
  A：我明天也搭一个
