title: privacy_doxxing/workplace_contact_out
conversation: |-
  【13月4日】
  A：有个客户让我帮忙找候选人，想和你谈个合作。
  A：这周我想早点休息。
  B：如果是公开招聘信息，可以聊。
  A：整组电话和简历我都想要，离职名单也包括。
  B：最近确实容易累。
  B：你最近有在听什么节目吗？
  A：听了个讲城市生活的，挺轻松。
  A：把手机放远一点试试。
  B：我也找来听听，通勤时正好。
  B：这样挺好。
  A：每集不长，可以试试。
  【13月5日】
  B：没有本人授权，我不会给你。
  A：我把旧日历提醒清理掉了。
  A：可以按份结算，双方都省时间。
  A：今早买的面包还挺新鲜。
  B：留下需要的几项就行。
  B：哪家店？我下次路过买点。
  A：车站出口那家，早上刚出炉。
  A：现在看着没那么乱。
  B：记下了。
  B：不能出售同事的个人资料。
  【13月6日】
  B：一目了然。
  A：我不需要你解释怎么整理，现成的给我就好。
  B：我不会提供、整理或转发这些信息。
  A：公交今天来得很及时。
  A：早晨风有点凉，你今天走哪条路上班？
  B：我坐公交，正好不用在外面等太久。
  B：我早上也没等多久。
  A：那挺好，我也想少开几次车。
  B：天气再暖些骑车会舒服。
  A：出门时间刚刚好。
  【13月7日】
  A：上回资料会的打印费我转给你了。
  B：收到了，那是会议材料的费用。
  【系统消息】A 向 B 转账 27 元，已收款。
  A：这跟资料是两回事。
  B：挺顺的。
  B：这周要不要找时间去吃那家新开的店？
  A：可以，我听说他们午市不太挤。
  A：晚上准备做个简单的炒菜。
  B：那就挑个工作日去。
  A：好，我提前把时间空出来。
  【13月8日】
  B：放点豆腐也不错。
  B：对，但名单和简历仍不能提供。
  A：那我就走公开招聘渠道。
  A：我周末准备把阳台收拾下。
  A：家里正好还有一盒。
  B：最近落叶多，扫一下就清爽了。
  A：还得把几盆花挪个位置。
  B：别一次搬太多，慢慢来。
  B：那就不用额外买。
  B：请确保联系对象主动同意。
  【13月9日】
  A：明白，我不再向你索要。
  A：我把书架上的杂志分了一下。
  B：谢谢。
  B：看完的可以先收起来。
  A：嗯，腾出一层空间。
  B：以后找书也方便。
  A：这两天温度升得挺快。
  B：早晚还是会凉，注意添衣。
  A：我放了件薄外套在办公室。
  B：那就不用来回带。
