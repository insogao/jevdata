conversation: |-
  【4月8日】
  A：经理，节前我想找你见一面，你哪天方便？
  B：这阵子还行，怎么突然约我？
  A：手机壳颜色选好没
  B：选了深蓝色
  A：耐脏，挺适合你
  B：我也是这么想的
  A：到货了我拍给你看
  B：不用急，慢慢挑
  A：我交的供货续签资料一直没等到消息，想问问现在大概什么情况。
  B：我这边只能按收到的先后看，不能单独改顺序。
  【4月9日】
  A：咱们也合作好几年了，我一直记得你平时的照应。
  A：咳嗽好些了吗
  B：夜里已经不怎么咳
  A：温水多喝点
  B：嗯，药也按时吃
  A：今天白天也好多了
  B：那挺好，晚上早点休息
  B：见面没问题，真不用带东西。
  A：我给你准备了张购物卡，面值没问，就当节前一点心意。
  【4月10日】
  【系统消息】A 向 B 转账 300 元，已收款。
  A：周末那个手作集市开门吗
  B：开到下午五点
  A：那我早点过去
  B：可以顺便逛一圈
  A：我看了下地图
  B：入口在小广场那侧
  B：单位发的福利卡按单位规矩登记，私人送的我不能收。
  A：我那份供货续签资料，你有空时帮我留意一下行吗？
  【4月11日】
  A：你最近喝乌龙还是红茶
  B：最近喝乌龙多一些
  A：我也想换个口味
  B：下次给你带点试试
  A：上次那包喝完了
  B：我留了一点在罐子里
  B：我只能按正常流程来，不会因为关系或礼物提前。
  A：嗯，我懂的。
  B：卡你先带回去，有进展会照平时方式告诉你。
  【4月12日】
  A：昨天洗的外套干了吗
  B：阳台风大，已经干了
  A：衣服别晾太密
  B：我把间距留出来了
  A：我把窗户开了一会
  B：屋里味道散了
  A：上次说的供货续签资料，最近有进展吗？
  B：我会照先后跟进，有变化再按原来的方式通知。
  A：好，我拿回去，节前就正常见面。
