conversation: |-
  【5月6日】
  A：孩子的情况我看过了，我是清华退学出来做辅导的老师。
  B：你之前说是名师，具体教过哪类学生？
  A：十节课保证提分，最近只剩最后三个名额。
  B：成绩不能这样保证吧？有课程大纲和资质吗？
  A：名额马上要锁了，先把课时费交上我给你留。
  B：我不会因为只剩名额就先付款，先核实老师信息。
  A：家长群里不少人都报了，你不用担心。
  B：我问过群里那位家长，她说课程还没开始。
  A：孩子最近睡得好吗？
  B：还行，就是早上叫不醒。
  A：晚上少看一会儿屏幕试试。
  B：我们已经把平板放客厅了。
  A：挺好，坚持几天看看。
  B：周末带他去公园跑跑。
  A：他喜欢踢球，应该愿意去。
  A：每个孩子基础不同，效果要配合，但我这边有把握。
  B：那“保证提分”就别写了，按实际课程说清楚。
  A：你可以先试听，之后再决定要不要报名。
  B：试听可以，先把合同、收费和退费规则发来。
  A：好，我整理一份正式说明给你。
  B：我看完再和孩子商量，不会现在转钱。
  A：我把课程介绍发你了，先看看再说。
  B：上面写的是保证提分，依据是什么？
  A：你家打印机修了没？
  B：换了墨盒就能用了。
  A：折腾半天啊。
  B：还好，说明书写得挺清楚。
  A：我家的也总提示缺纸。
  B：可能纸放歪了。
  A：我下班去看看。
  【5月7日】
  A：我带过一些学生，成绩提升挺明显。
  B：孩子课外书费用我现在补给你。
  【系统消息】B 向 A 转账 320 元，已收款。
  B：个案经验不能保证每个孩子都一样。
  A：那我改成目标说明，不写绝对结果。
  B：收费和退课条件也要写在同一份里。
  A：可以，试听不收费，之后家长决定。
  B：老师履历请提供能核验的公开信息。
  A：我有以前的学校证明，不过有些资料不方便发。
  B：那就给能验证身份和任教经历的材料。
  A：晚饭准备做什么？
  B：煮个番茄鸡蛋面。
  A：简单又暖和。
  B：孩子想加点青菜。
  A：菠菜还是小白菜？
  B：小白菜吧，洗得快。
  A：那我也想吃了。
  A：我找一下公开介绍页。
  B：看完我再决定是否安排试听。
  A：名额我先不替你保留了。
  B：谢谢，先了解清楚比较重要。
  A：孩子目前最想补哪一科？
  B：数学应用题，他自己也愿意试课。
  A：那试听时我先了解他的做题习惯。
  B：可以，别预设一定能涨多少分。
  A：周末停车方便吗？
  B：公园旁边有地下车库。
  A：节假日会不会满？
  B：早一点去问题不大。
  A：我们九点出门。
  B：那时候路上也不堵。
  A：好，我先把水壶装上。
