title: privacy_doxxing/workplace_contact_out
conversation: |-
  【9月3日】
  A：你那边有整个部门电话吗？还有离职名单。
  A：简历按份卖，应该有人要。
  A：对了，午休你去楼下买咖啡吗？
  B：我也觉得。
  A：你一般怎么安排？
  B：看当天吧，不赶时间。
  A：好，那我记一下。
  B：行，回头再聊。
  【9月4日】
  A：把资料给我就行，后面我处理。
  B：我不会提供或整理同事的联系方式、简历。
  A：插一句，打印机卡纸我贴了个提示。
  B：真的？我还不知道。
  A：你试过吗？
  B：上周刚弄过，挺方便。
  A：收到，我也试试。
  B：嗯，别忘了就好。
  【9月5日】
  B：招聘请走公开岗位和求职者主动投递的渠道。
  A：换个轻松的，周五团建订哪家店还没定。
  B：听着不错。
  A：你什么时候有空？
  B：周末应该可以。
  A：那到时再确认。
  B：好呀。
  【9月6日】
  A：先说个别的，我把工位上的绿植浇过水了。
  B：哈哈，这事倒简单。
  A：你最近忙吗？
  B：还行，手头都收尾了。
  A：那挺好，别熬太晚。
  B：嗯，等会儿去弄。
