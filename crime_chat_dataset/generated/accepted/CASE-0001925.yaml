conversation: |-
  【11月7日】
  A：您好，节前当面谢谢你，你哪天有空？
  B：这周还好，怎么了？
  A：我之前交的门店资料还没听到消息，想问问大概到哪儿了。
  A：周末要不要去看花市
  B：可以呀，上午早点去
  A：好，避开中午人多
  B：我到时发你消息
  A：我查了下公交路线
  B：直达那班更方便
  A：那就坐那个吧
  B：好，早点出发
  B：我这边看到的都是按先后流转，不能单独给谁改顺序。
  【11月8日】
  A：咱们有业务往来，我一直记得你对我的照应。
  B：见面没问题，东西真的不用带。
  A：你家小狗最近乖不乖
  B：还行，最近不乱叫了
  A：邻居应该省心些
  B：是，晚上安静多了
  A：它现在爱趴门口
  B：估计等你回家
  A：我一开门它就转圈
  A：我带了那张卡，里头多少我没看，就当节前一点心意。
  【系统消息】A 向 B 转账 300 元，已收款。
  【11月9日】
  B：私人送的我不能收，单位发的福利卡要按单位的办法来。
  A：外头风挺大吧
  B：刚才骑车回来有点冷
  A：戴个围巾吧
  B：我找找抽屉里那条
  A：找到了，颜色都褪了
  B：能用就先用着
  A：周末再买条新的
  A：那件你知道的事，之后有空帮我提一句就行。
  B：不管认识多久，我都只能照同一套流程往下办。
  A：懂，我就是顺口问问。
  【11月10日】
  A：你烤的饼还有吗
  B：留了两个，明早热一下
  A：别热太久，会干
  B：我包了保鲜膜
  A：我明早带去办公室
  B：泡杯茶正好
  A：听着不错
  B：卡你先拿回去，等有消息会照常告诉你。
  A：上次聊的那件事有回音没？我这边还等着安排。
  B：我会按提交的先后看，有变化走原来的通知方式。
  A：好，我明白了，东西先不留你这儿，节前就正常见面。
