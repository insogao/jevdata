conversation: |-
  【9月10日】
  A：B哥，下午三点老地方见一面
  B：什么事这么急
  A：我弟那条腿的事，得当面说
  B：医药费我一直在垫，走保险不就完了
  A：走保险那套太慢，我等不了
  A：他这月复查单子又出来了，你自己看
  B：复查单我认，但数目得按实际来
  A：按实际？我弟半年干不了活，你算算
  B：中午你那食堂的菜还行不
  A：一般，凑合吃
  B：天热，别上火
  【9月11日】
  A：到了没，兄弟们都在等你
  B：…你们几个人
  A：就几个朋友，来看看你态度
  B：有话好好说，别这样
  A：好好说可以，字据先写了
  B：什么字据
  A：赔偿的数，按手印，省得以后扯皮
  B：这个数我拿不出来
  A：拿不出来也得写，不赔就卸你一条腿
  B：你别乱来
  A：兄弟们等着吃饭呢，别让我为难
  B：我先给一部分，剩下的宽限几天
  A：宽限可以，罚则也写上
  B：…行，我签
  A：这才像话，按手印吧
  【系统消息】B 向 A 转账 30000 元，已收款。
  B：先转三万，字据我留一份
  A：留吧，白纸黑字谁也赖不掉
  B：晚上还去打球不
  A：不去了，累
  B：那改天
  【9月12日】
  A：剩下的这个月内清，别拖
  B：我尽量凑
