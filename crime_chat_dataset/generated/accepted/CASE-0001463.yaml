  latent_intent: 小店主 A 被匿名号连挂半年，没走平台举报的正路，而是私联论坛上懂行的陌生人 B，从公开痕迹倒查对方：先翻出两个跟主号同习惯的影子号，再用一张店面对照原图的拍摄时间坐实先踩点后发帖，排班表般的活跃时段和两年转发点赞脉络最终把线画到受益的同行店——A 拿着 B 画的『路』递材料让平台封了主号，一场私力溯源反制全须全尾收场。
  critical_evidence:
  - A 被同一个号换了花样挂了小半年，私信求 B 帮看，B 让 A 把对方发过的公开内容原样存一份（第1天）
  - B 从行为习惯翻出两个影子号：删改时间点贴着主号走、发帖前都先逛同三家店（第2天）
  - 影子号相册一张店面对照原图的拍摄时间早于挂店帖一天，先踩点后发帖（第3天）
  - 三个号活跃时段像排了班、错峰上线，主号事后专删带脏字的帖（第3-4天）
  - 第5天 B 把三个号两年的转发点赞脉络捋成一张图，路径绕着同一家受益的店走；第6天 A 递材料、主号被停，影子号没了动静
  benign_alternatives:
  - 基于公开信息的网络行为分析讨论
  - 商家应对恶意差评的舆情自查

