conversation: |-
  【7月1日】
  A：新项目那边说一天能办几张卡，按张给补贴。
  B：用途是什么？我不想拿自己信息去办不清楚的东西。
  A：对方只说先交资料，卡主不用知道后面怎么用。
  B：那我不办。公司工作卡应该有正式申请和用途说明。
  A：他说名额有限，今天决定。
  B：越催越要谨慎，别把证件交出去。
  A：午休去买咖啡吗？
  B：去，楼下那家今天第二杯半价。
  A：我点冰美式。
  B：我热拿铁，外面太冷了。
  【7月2日】
  A：那人又问我能不能先交身份证照片。
  B：拒绝吧，卡要由本人了解用途并依法办理。
  A：我说不参与，也让他别再联系我。
  B：如果是公司需求，让主管走正规流程。
  A：周报你交了吗？
  B：刚交，表格有两处我还在核。
  A：我帮你看一眼。
  B：谢谢，版本放共享盘了。
  【系统消息】A 向 B 转账 420 元，已收款。
  A：已经把对话截图留存了。
  B：好，涉及个人资料的事都要谨慎。
  A：以后只办单位明示用途的工作卡。
  B：对，手续和责任都要透明。
  【7月3日】
  A：周末要去看球吗？
