  【9月10日】
  A：早。9月的兼职工时表我核完了，20个人一共22000，什么时候方便走款？
  B：这么快，效率可以啊
  B：我今天下午走审批，明天上午应该能到
  A：行，孩子们月底交房租，你这边别拖太久哈
