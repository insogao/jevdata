  A：哈哈正常，我们家那个三年级，早饭都得催三遍
  B：三年级好多了，熬过这两年就轻松了
  B：审批过了，领导签完字，明早十点前我安排出去
  A：好，到时候你直接转我，我再拆开给孩子们，一人一千一
