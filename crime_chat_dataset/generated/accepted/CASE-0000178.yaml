  B：收到，我存档，辛苦了
  A：对了有个学生的卡是外地的，到账慢点，我跟你报备下
  B：没事，只要你这边转出时间有记录就行
  A：下午没事我去江边跑两圈，去不
  B：不了不了，我这腰，上周走多了疼三天
  A：你就是久坐，得循序渐进，先从快走开始
  B：行，下周一开始快走，你监督我
  B：发票记得这周内给我，财务催了
  A：明天就送。110那笔服务费我单独开
  B：对，别混进劳务费里，账不好做
  A：懂，分开开：一张代办服务费110，再附一页代发说明
  B：嗯。名单加工时表加转账凭证加发票，四样齐了这单就算结了
