conversation: |-
  【11月5日】
  A：新认识的商户，节前你哪天方便？节前当面谢谢你
  B：这两天事情有点多，怎么突然想见面？
  A：冰箱是不是该清一下
  B：昨天剩菜我都装盒了
  A：放太久的就别留了
  B：放心，今天就吃掉
  A：那盒汤我今晚热掉
  B：别放太久，注意闻一下
  【11月6日】
  A：知道啦，闻着没问题
  A：想问问登记材料的进展，也好提前安排一下。
  B：登记材料都按统一顺序处理，我只能看流程到哪一步。
  A：上次你说的那个窗口，就是想当面谢谢你平时照应。
  A：你妈最近肩膀好点没
  B：好多了，理疗后轻松些
  A：那就好，别总提重东西
  B：我提醒她了
  【11月7日】
  A：我让她这周少搬东西
  B：对，缓几天再说
  A：嗯，她自己也说轻松多了
  B：吃饭可以，带东西就不用了。
  A：我本来想带张购物卡，面值没问，节前一点心意。
  A：中午那家小馆还开吗
  B：开着，老板说菜单换了
  A：下次去试试新菜
  【11月8日】
  B：行，我也想吃点清淡的
  A：我收藏一下菜单
  B：下次早点去就不用排队
  B：私人给的我不能留，单位统一发的福利卡才按公司规矩登记。
  A：我那份登记材料，能不能有消息时帮我留意一下？
  A：你最近晚上还散步吗
  B：走二十分钟吧
  A：挺好，别一下走太久
  【11月9日】
  B：嗯，慢慢来
  A：我买了双舒服的鞋
  B：那挺好，慢慢加时间
  B：我不能因为认识或收礼就给谁调顺序，都是照同一套要求办。
  A：嗯，我知道，就是问问。
  B：卡就先别拿来了，等正常通知。
  A：窗台漏水修好了没
  B：师傅昨天来补过了
  【11月10日】
  A：下次下雨再看看
  B：希望这回能行
  A：外面下雨时再观察下
  B：师傅说补过就能好
  A：前两天提的登记材料，现在有消息了吗？
  B：我会按提交顺序看，有变化走正常通知，不会单独插队。
  A：明白，那我就不带卡了，按规矩来。
