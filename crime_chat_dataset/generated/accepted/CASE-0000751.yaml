title: privacy_doxxing/workplace_contact_out
conversation: |-
  【9月5日】
  A：客户想补一批人，你那边能不能给整个部门的电话？
  B：未经同意的员工联系方式我不能给。
  A：先忙了，改天再聊。
  【9月6日】
  A：简历也可以按份算，离职名单有的话一起发我。
  A：这两天降温了，你那边也下雨吗？
  B：早上飘了一阵，出门记得带伞。
  A：好，我把薄外套也拿上。
  B：我今天差点穿短袖，幸好看了天气。
  A：天气预报说周末会放晴。
  B：那正好，趁太阳出来把衣服晒了。
  A：先忙了，改天再聊。
  【9月7日】
  B：简历和离职信息都属于个人资料，不能转卖或转发。
  A：就当猎头正常触达嘛，先给我几份试试。
  A：先忙了，改天再聊。
  【9月8日】
  B：正常招聘也要有授权。我可以发公开职位，让有兴趣的人自己联系。
  B：中午准备吃什么？
  A：楼下新开了家面馆，想试试。
  B：我吃过，还不错，汤别点太辣。
  A：收到，我胃最近有点敏感。
  B：那加个青菜，清淡点。
  A：好，吃完给你说评价。
  A：先忙了，改天再聊。
  【9月9日】
  A：行，那名单和简历都不发了。
  A：先忙了，改天再聊。
  【9月10日】
  B：谢谢。以后只用经本人同意的候选人资料。
  A：你上次说的那本书看完了吗？
  B：看完了，后半段比开头有意思。
  A：我周末找时间也看看。
  B：图书馆有电子版，不用跑一趟。
  A：那我今晚借一下。
  B：行，看完我们再聊。
