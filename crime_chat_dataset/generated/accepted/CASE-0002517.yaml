conversation: |-
  【9月24日】
  A：方经理您好，我是阿成，之前朋友介绍我们认识的。节前有空一起吃个便饭吗。
  B：你好，记得的。你最近怎么样。
  A：明晚方便吗？我来定地方，离单位不远。
  B：明晚可以，别订太正式的地方。
  A：好，就附近那家家常菜馆。顺便带一点节日小心意。
  B：吃饭可以，东西真不用特意准备。
  A：你那边月底也要补台账吗
  B：要啊 这周在核一遍
  A：我们刚换了新版表格
  B：我也收到了 看着清楚些
  A：就是填起来多两栏
  B：熟悉了就快了
  A：我把旧表也留了一份
  B：留着对照确实方便
  A：同事说下周要培训
  【9月25日】
  A：我到门口了，你慢慢来。
  B：刚出来，马上到。
  A：这个给你，一张小购物卡，过节图个方便。卡面金额我也没仔细看。
  B：你太客气了，心意我收下，下次别这么见外。
  B：今天聊得挺轻松的，回去路上注意。
  A：好呀，你也早点休息。
  【9月26日】
  A：这几天早晚温差也太大了
  B：是啊 我中午还穿短袖呢
  A：我早上出门带了件外套
  B：带着好 晚上风一吹就冷
  A：预报说明天会晴一点
  B：那我把阳台衣服洗了
  A：我把外套放包里了
  B：这个办法稳妥
  A：刚看窗外又起风了
  【9月28日】
  A：附近新开了家面馆你去过没
  B：去过一次 汤还不错
  A：我上次点的拌面有点咸
  B：那你下次试试番茄鸡蛋面
  A：好 我记下了
  B：中午人少点再去
  A：我同事说那家早上也卖豆浆
  B：那可以试试看
  A：周末我路过买一份
  【9月29日】
  A：前几天顺带提过的我们公司的申请资料，我这边先等着，有空再说哈。
  B：材料都按顺序处理，有消息会照常通知。
  A：明白，我就是问问，节前事情多辛苦啦。
  B：不客气，缺什么会统一联系，不用专门跑一趟。
