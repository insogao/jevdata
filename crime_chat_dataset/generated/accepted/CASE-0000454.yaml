conversation: |-
  【8月1日】
  A：新开的盖饭店你吃了吗
  B：吃过，鸡肉饭还行
  A：我中午去试试
  B：排队有点长
  A：我早点去
  A：我先记下，回头再聊。
  B：好，忙完再说。
  A：你上次提的退货那事，我不想碰。
  B：怎么了？
  A：你说原包装膜你有，售后只看码，一单赚一千。
  B：那是在骗售后，我不会帮忙。
  A：我以为你在仓库上班能搭把手。
  B：我只按正常退货流程处理，有问题找平台。
  A：好吧，我不该开这个口。
  B：把货和单据照实核对，别弄虚作假。
  【8月2日】
  A：地铁口修好了
  B：早上好走多了
  A：我明天换这条线
  B：比绕路方便
  A：嗯，省十分钟
  A：我先记下，回头再聊。
  B：好，忙完再说。
  A：上次拼饭的一百二我转你了。
  【系统消息】A 向 B 转账 120 元，已收款。
  B：收到了，饭钱正好。
  A：你看了我发的退货消息吗？
  B：看了，不能用假包装或虚假信息退货。
  A：我已经说了原包装膜我有。
  B：这不能改变商品实际情况。
  A：一单赚一千听着挺多。
  B：违法骗款的事我不参与，也不会帮你改材料。
  【8月3日】
  A：你妈最近睡得怎么样
  B：好多了，换了个枕头
  A：那就好
  B：她最近散步吗
  A：每天饭后走一圈
  A：我先记下，回头再聊。
  B：好，忙完再说。
  A：那批东西我先不寄了。
  B：先按平台规则处理，别把不属于你的东西申退。
  A：行，售后我自己问客服。
  B：如实说明情况就好。
  A：知道了。
  B：以后别让我帮忙做假的。
