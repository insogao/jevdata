  【10月12日】
  A：老姜，上次展会上那套巡检方案，报价单还有吗
  B：有，回头发你，你们厂真要上？
  A：先立项，预算得明年了
  B：行，方案我给你留一年有效期
  A：够意思
  A：对了，私事求你帮个忙，心里没底
  B：你说
  A：我爸前天出门买菜没回来，七十多了，记性不好
  B：报警了吗，这个最要紧
  A：报了，派出所登记了，也发了寻人启事
  B：那就对，第一时间就该报警，警察有正规手段，比咱们瞎找强
  A：嗯，就是心里慌，想多几条路
  【10月13日】
  B：寻人启事发我一份，我们员工大群帮你转转，一线师傅到处跑
  A：发你了，太感谢了
  B：顺手的事，我们巡逻的车也都会留意
  A：要是有什么消息，我第一时间同步警方
  B：对，任何线索都先给警方，让他们去核实
  A：懂，不添乱
  B：你也别自己满城乱跑，老人一般走不远
  A：嗯，主要在小区周边和菜市场找过了
  B：桥洞公园也看看，再问问环卫和保安
  A：都问了，派出所说调监控要按流程排队，让我等
  B：正常，他们按流程来，靠谱
  A：嗯，等消息
  B：对了，你厂里那套安防设备明天进场装
  A：好嘞，我让库房腾地方
  B：十六个探头加一套门禁，装完验收再收尾款
  A：按合同来
  B：周日出海不，老周船回来了
  A：去不了，我得守着等我爸消息
  B：应该的，有需要说话
  A：嗯，谢谢兄弟
  【10月14日】
  B：设备装了一半，主线走完了
  A：辛苦，进度挺快
  B：明天装探头调角度，后天调试
  A：不急，装稳当要紧
  B：那是，安防这东西，装完是要用十年的
  A：我爸的事还没消息，一晚上没睡
  B：别慌，七十多老人身上有身份证，救助站医院都能对上
  A：派出所也这么说，让我手机保持畅通
  B：对，真找到了，第一时间就是联系家属
  A：嗯，我在菜市场又贴了几张启事
  B：好样的，多一分曝光多一分希望
  B：别提烦心事了，我家那位在家长群跟人吵起来了
  A：为啥
  B：争论值日表，你说可笑不可笑
  A：家长群就是修罗场
  B：我都退了，清净
  【10月15日】
  A：有消息了！派出所凌晨来电话，我爸在邻市救助站找到了
  B：太好了！人没事吧
  A：没大事，就是饿瘦了，医生说没大碍，我现在坐车过去接
  B：你看，报警就是对的，救助站一对照身份就锁定了
  A：是，还是正规渠道管用，多亏听你的
  B：回来给老爷子接风，设备我也装完了
  A：调试得怎么样
  B：明天最后调一遍，验收合格你再付尾款
  【10月16日】
  B：调完了，你哪天来验收
  A：明天下午行不，我把我爸安顿好
  B：行，我把检测报告和点位图给你备好
  A：嗯，发票也一起，财务要入账
  B：昨晚跑现场到两点，眼都花了
  A：辛苦费少不了你的
  B：合同价，一分不多收，哈哈
  A：等老爷子缓过来，海我陪你出
  B：对了，寻人启事我让群里撤了，老爷子找到了就别再传了
  A：对，麻烦你了，也替我谢谢师傅们
  【10月17日】
  B：验收单我发你，十六个探头都正常，门禁也联调过了
  A：看了，没问题，尾款三千按合同转你
  【系统消息】A 向 B 转账 3000 元，已收款。
  B：收到，发票明天给你寄过去
  A：好，这次多亏你，报警加你们帮忙转发，老爷子才这么快回来
  B：客气，以后设备有问题随时喊我，售后管到底
