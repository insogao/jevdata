  A：数量你定，我只谈量和批号，别的你清楚
  B：懂，老规矩嘛，一手能拿多少
  A：二百件往上，少了不好配
  B：价格呢，别跟我整虚的
  A：二百八一件，市面上三百六，你自己算
  B：低这么多，来路稳不稳
  A：问那么多干嘛，两年了哪次坑过你
  B：行，那先来二百件
  A：可以，老地方交
  B：物流园后头那个口？
  A：对，还是那排库房边上
  B：现结还是月结
  A：现结，现金，不留账，你我知道就行
  B：周五晚行不
  A：周五晚八点，定金先打一半
  B：国庆你们放几天
  A：三天，还得留人看货，放假比上班还操心
  B：我们商场国庆全员上岗，惨
  A：谁让咱干这行，节假日正是走货的时候
  【10月9日】
  B：定金转你了，你查收，备注没写啊
  【系统消息】B 向 A 转账 20000 元，已收款。
  A：收到，以后转账啥都别写，这聊天记录看完也删了
  B：至于么，搞得跟地下工作似的
  A：谨慎没坏处，货对货钱对钱，别留把柄
  B：行，周五我开车去
  A：开面包车来，二百件你那轿车塞不下
  B：那我借我小舅子那台
  A：你家老大开学适应没，住校习惯吗
  B：头两周天天哭着打电话，现在好了，就是费生活费
  A：都这样，我家那个一月生活费比我烟钱多十倍
  B：哈哈你还好意思说烟
  【10月10日】
  A：提醒下，周五来别带生人，就你一个
  B：知道，老规矩，验货再给余款不
  A：当场验，验完现结，一共五万六，你备好
  B：定金两万出了，剩三万六现金，我周五去取
  A：对，带够，别差几百块让人笑话
  B：放心，我账上向来清楚
  B：你血压咋样了，上回你说高
  A：药吃着呢，一百四九十，医生让少喝
  B：能推的应酬就推了吧
  A：是，尽量推
  【10月11日】
  A：周五的货我从南边调，你八点到，别早别晚
  B：八点，库房边上，就咱俩
  A：对，车直接开进去，装完就走
  B：要带几个框
  A：六个框，别的啥都别带
  B：明白
