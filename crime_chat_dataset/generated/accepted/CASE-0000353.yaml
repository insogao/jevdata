conversation: |-
  【4月1日】
  A：那台相机还在吗？我朋友想要
  B：在，平台挂了一万二，箱说齐全
  A：我看照片了，价格明显低，八千就出吧
  B：这么低？
  A：我帮你省平台费，微信私下交易更快
  B：还是走平台稳妥
  B：搬家纸箱我买了十个，够不够
  A：相机包装单独放，别压着
  B：嗯，镜头都收回原盒了
  A：搬家当天叫朋友帮你抬
  【4月2日】
  A：你最近是不是要搬家，东西多很麻烦
  B：月底搬，正在清东西
  A：那就别拖，买家等着，转定金我帮你留
  B：平台下单就能锁定呀
  A：他不会用平台，直接加我谈了，你把收款方式发来
  B：不行，我还是用平台
  A：最近菜市场草莓便宜了
  B：我昨天买了一盒，挺甜
  A：洗之前别泡太久
  B：我妈也这么说
  A：买家说已经付款了，你看下微信
  B：没收到。你发的物流截图怎么是别人的单号？
  A：系统延迟，先把货寄出去
  B：我查过，单号查不到这台相机
  A：别磨蹭了，地址我等会发你
  B：我不会私下寄，先把平台订单发出来
  B：新房的窗帘选好了
  A：什么颜色
  B：浅灰，跟墙面比较搭
  A：挺耐看的
  【4月3日】
  B：你说的买家一直催我走微信，太奇怪了
  A：他着急用嘛
  B：我问了平台客服，根本没有订单
  A：那可能他取消了
  B：你还让我发假物流单号，别再联系我了
  A：你误会了
  B：我已经把聊天留存了
