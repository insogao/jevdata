  B：押金条又是您那一套，行吧
  A：面试那关收二百九十九的形象管理费，这是规矩
  B：面不过的呢
  A：面不过退一百五，剩下的算场地茶水
  B：您这账算得真精
  B：老板你那边下雨没，我这儿阴得厉害
  A：阴了一上午，刚出太阳
  B：那我下午出去发传单招人，带把伞
  【9月15日】
  B：老板，昨天面了两个，都过了，形象费收了五百九十八
  A：记台账上，名单发我
  B：发了，一个做过车展，一个做过发布会
  A：行，周六上午十点彩排，城西那家酒店
  B：活动啥主题，我好跟她们讲
  A：金融客户答谢，统一穿我发的黑色礼服
  B：服装到了吗
