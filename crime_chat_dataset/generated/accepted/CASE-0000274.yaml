  B：哈哈我也全错，今晚更新接着蹲
  【9月16日】
  A：周六的场子换了，改城东宴会厅，时间不变
  B：行，有人问为啥换地方咋说
  A：说规格升了，客户加钱了
  B：这话她们爱听
  A：人再补两个，现在才六个
  B：我这两天再面几个
  B：中午点那家螺蛳粉不
  A：你在办公室点，味儿别带楼道里
  B：知道，上回被行政念叨过
  A：给我捎杯豆浆
  【9月17日】
  B：又面了三个，收了八百九十七
  A：台账更新没
  B：更了，有位姐姐问活动靠不靠谱，还收吗
  A：收，跟她们讲前几场都是日结当场发的，谁也没欠过
  B：这倒是，前两场您都当天结了
  A：前头结得爽快，后头人才肯来，这叫口碑
  A：晚上打球不，老地方
  B：去，新球鞋到了正好上脚
  B：打折入的，四百多，不亏
  【9月18日】
  B：老板，明天十二个人齐了，押金加形象费一共收了一万零四百六十
  A：台账对好，明天彩排谁也不许迟到
  B：押金条我都打印好了
  A：场结还是日结明天定，你早点到
