conversation: |-
  【9月1日】
  A：我手上有几台手机，价比回收店低不少，你收不收？
  B：先给我看回收单和设备来源。
  A：还带原来的账户锁，没来得及处理。
  A：这两天降温挺快。
  B：早晚有点凉，我拿了薄外套。
  A：我还穿短袖，早上有点后悔。
  B：办公室放件外套方便。
  A：嗯，记下了。
  B：这周天气变化挺快。
  B：没有原主解除和所有权证明，我不能收。
  A：我认识人能把锁弄开，之后就能转卖。
  A：附近新开了家面馆，你吃过没？
  B：还没，同事说汤底挺清爽。
  A：我中午去试试，别又排队。
  B：早点去吧，十二点后人多。
  A：好，回来给你反馈。
  B：要是不错我也去。
  【9月2日】
  B：不能这样处理，先联系原主或正规失物渠道。
  A：批量拿价更好，几台一起算。
  B：来源不清的设备我不接。
  A：你家那盆绿植最近怎么样？
  B：新长了两片叶子，挪到窗边了。
  A：我办公室那盆还没动静。
  B：别浇太勤，土干了再浇。
  A：好，回头试试。
  B：希望它快点长起来。
  A：你店里最近换电池的多吗？
  B：还行，先让客户确认报价。
  A：这几台我先放你那儿？
  A：周末你准备做什么？
  B：可能回家看看父母，带点水果。
  A：橙子最近挺甜的。
  B：我妈更喜欢梨，我买一小袋。
  【9月3日】
  A：挺好，路上别赶。
  B：嗯，坐地铁过去。
  B：不行，店里不能存无来源设备。
  A：那我带回去问卖家。
  A：你最近还在看那部剧吗？
  B：看完了，后半段比开头好。
  A：我还没看到一半。
  【系统消息】A 向 B 转账 120 元，已收款。
  A：上次你帮我买的充电线钱我转回来了。
  B：慢慢看，不着急。
  A：最近晚上总加班。
  B：那就周末再看。
  B：请先核实所有权，不要交给不明人员处理。
  A：卖家找不到原始凭证。
  B：那就别转手，按正规渠道处理。
  A：你最近午饭还点那家盖饭吗？
  B：换成楼下的馄饨了，出餐快。
  【9月4日】
  A：我周末想把书架整理一下。
  B：先把不用的书装箱，桌面会清爽很多。
  A：今天早高峰地铁人多吗？
  B：还好，我提前一站下车走过来的。
  A：附近超市的梨最近挺甜。
  B：我上周买过，价格也还行。
  A：你那双鞋修好了吗？
  B：好了，换了鞋跟还能穿一阵。
  A：周末天气预报说会晴。
  B：那正好把被子拿出去晒晒。
  A：你最近晚上还在看书吗？
  B：睡前看几页，眼睛累了就停。
  A：我想换个保温杯，旧的漏水。
  B：买个简单的就行，容量别太大。
  A：楼下早餐店换了菜单。
  B：我看到多了豆浆和饭团。
  【9月5日】
  A：这周办公室空调有点冷。
  B：我放了件薄外套在椅背上。
  A：你家猫还喜欢蹲窗台吗？
  B：喜欢，早上总盯着外面的鸟看。
  A：我昨晚做了番茄鸡蛋面。
  B：简单又快，适合下班晚的时候。
  A：你上次推荐的播客我听了两期。
  B：还不错吧？我通勤时经常听。
  A：门口那家修车铺还开着吗？
  B：开着，我昨天去给车打了气。
  A：最近晚上风大，晾衣服要夹牢。
  B：是啊，我昨天差点把袜子吹走。
  A：周末你准备去哪里走走？
  B：可能去河边，不想跑太远。
  A：我把手机壳换成透明的了。
  B：挺好，旧的那个边角都裂了。
