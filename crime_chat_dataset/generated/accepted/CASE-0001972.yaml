title: bribery_corruption/gift_card_channel
conversation: |-
  【5月10日】
  A：师傅，节前路过想当面聊一下，你哪天有空？
  B：我看看安排，怎么了？
  A：周末球场还有位置吗
  B：下午那场还没满
  A：那我带双备用鞋
  B：好，别太晚到
  A：我六点前就出门
  B：路上可能会堵
  【5月11日】
  A：我之前交的入驻资料还想问问进度，后面好安排。
  B：这类材料都按时间顺着看，我不方便替谁单独调整。
  A：上次窗口你提醒过我，节前想当面谢谢你。
  A：阿姨最近睡得好些吗
  B：好多了，晚上不咳了
  A：那就继续按时吃药
  B：我帮她记着呢
  A：医生说状态稳定
  【5月12日】
  B：真好，家里都放心些
  B：见面没问题，别专门准备东西。
  A：我给你带了那张卡，里面多少没细看，节前一点心意。
  【系统消息】A 向 B 转账 300 元，已收款。
  A：你家电梯修好了吗
  B：上午物业来检查过
  A：现在运行正常没
  【5月13日】
  B：刚才试了一下，没问题
  A：看来只是小毛病
  B：对，师傅说已经调过
  B：单位发的福利卡要按单位的办法登记，私人送的我不收。
  A：上回提到的那件事，你有空时帮我提一句就好。
  A：耳机的声音恢复了吗
  B：清了下灰，好多了
  A：那就不用换新的
  【5月14日】
  B：先用两天观察下
  A：我把耳机盒也充上了
  B：这样路上就够用
  B：我只按统一顺序跟进，不会因为礼物或熟悉就提前。
  A：好，我就是问问，没别的意思。
  B：那张卡你带回去，之后还是按正常通知走。
  A：楼下那棵桂花开了吗
  B：开了，晚上挺香的
  【5月15日】
  A：路过时我也闻到了
  B：今年开得比去年早
  A：我拍了张照片
  B：发我看看呀
  A：前几天聊的那个有消息没？我这边还等着安排。
  B：有更新我会照平时的方式通知，顺序不变。
  A：知道了，卡我拿回去，节前正常见面。
