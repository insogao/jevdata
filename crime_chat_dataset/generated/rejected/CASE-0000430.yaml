  B：我看到了，招牌好像是咖喱鸡。
  A：下次去试试，我中午常常想不出吃啥。
  B：这样挺好，我这边看到最新版本了。
  A：路上看到有张购物卡，快过节了，给你带一张。
  B：你太客气了，卡面多少？
  A：没看具体金额，平时买东西能用，你收着吧。
  B：行，那我就先收下了。流程还是按材料走。
  A：递交日期我记在日历里了，免得忘。
  A：我妈说周末想来住两天，得把客房收拾出来。
  B：提前换好床单就行，别到最后一晚忙。
  A：她每次都说不用准备，最后又带好多东西。
  B：哈哈，家里人都这样。
  B：好，后面按系统提示补材料就行。
  A：报价单我又核对过了，缺的那一页今天补齐。
  B：我看到了，收到后会一起放进申请里。
  A：这事来回确认了好几次，辛苦你。
  【3月5日】
  B：没事，资料按要求备好就可以。
  A：上次买咖啡的钱我转给你，四十多。
  A：上次说的复印件我多备了一份。
  B：你那双鞋修好了没？
  A：修好了，鞋底重新粘了一下。
  B：还挺快的，我那双还在店里。
  A：你去拿的时候记得问下保修。
  B：先留着，暂时没有要求再交。
  B：收到了，这笔是那天咖啡钱。
