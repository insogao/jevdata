title: bribery_corruption/relative_employment_exchange
conversation: |-
  【6月1日】
  A：孩子的面试时间定了，流程还要准备很多吗？
  A：这周雨挺大，路上堵得厉害。
  B：我早上多坐了两站地铁，反而快些。
  A：明天我也早点出门试试。
  B：带把伞，预报说还要下。
  B：面试就是走一下形式，岗位我这边已经留好了。
  B：中午吃的什么？
  【6月2日】
  A：楼下新开了家面馆，味道还行。
  B：我也想去，别点太辣。
  A：放心，我最近胃不太舒服。
  A：那笔款刚到账，是按之前说的感谢安排吗？
  A：家里那盆绿植最近叶子有点蔫。
  B：是不是放在空调风口了？
  A：我挪到窗边看看。
  【6月3日】
  B：先少浇点水，周末再观察。
  B：嗯，先放着。等入职手续开始，我会把档案单独处理。
  A：正常招聘材料还要照常交吧？
  B：基础材料交一下就行，其他我会跟人事沟通。
  A：我不希望后面有人问起这笔钱。
  B：先别多聊，等录用通知下来再说。
  【6月4日】
  A：我刚开完会，今天安排有点满。
  【系统消息】B 向 A 转账 2384 元，已收款。
  B：辛苦了，记得喝水。
  A：嗯，桌上还放着半杯咖啡。
  B：冷了就别喝了，换点温水。
  A：明早我先把日程看一下。
  B：好，有变化再互相说一声。
  B：你那边今天忙到几点？
  【6月5日】
  A：差不多六点，晚点再回家。
  A：刚才网络断了一下，消息才发出去。
  B：没事，我也刚看到。
  B：快递送到了吗？
  A：到了，放在门口柜子里。
  A：这两天温差挺明显的。
  B：是啊，晚上记得加件外套。
  【6月6日】
  B：我先去处理下手头的事。
  A：好，忙完再聊。
  A：刚把桌面收拾了下，文件总算没那么乱。
  B：今天窗外风挺大，阳台门我关上了。
  A：晚饭打算做点清淡的，最近不想吃太油。
  B：我把明天要带的东西放在玄关了。
  【6月7日】
  A：刚泡了杯茶，先缓一会儿再继续。
