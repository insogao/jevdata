title: Hard Negative：熟人二手设备交易，语言省略但证据充分
conversation: |-
  【5月5日】
  
  A：上周你发群里那台还在吗？
  B：还在，就是右下角有个小磕碰。
  A：电池怎么样？
  B：循环次数我晚上截图给你。
  A：行，别的配件都在？
  B：充电器和盒子都在。
  
  
  A：猫最近还半夜叫吗？
  B：好多了，晚上陪它玩一会儿就安静。
  A：之前可能就是精力太旺。
  B：医生也这么说。
  A：它那次打针花了多少？
  B：三百多，比我上次看感冒还贵。
  A：照片发我一张。
  B：晚点拍，它现在睡着了。
  
  A：昨天那个电影你看完了吗？
  B：看完了，后半段有点拖。
  A：我看到一半睡着了。
  B：前面其实更好看。
  A：结尾别剧透。
  B：不说，你最好从头看，不然人物关系记不住。
  A：有这么复杂？
  B：也还好。
  
  A：你妈复查结果出来了吗？
  B：出来了，医生说先观察，不用住院。
  A：那还好，下个月再去一次？
  B：对，我周末回去陪两天。
  A：最近让她少熬夜。
  B：她比我还难劝。
  A：需要我帮你订票吗？
  B：不用，我自己来。
  
  A：你电脑昨天那个问题解决了吗？
  B：重装驱动后好了。
  A：我还以为硬盘坏了。
  B：差点也以为，重要文件现在都同步云盘了。
  A：那就行。
  B：就是公司VPN还是偶尔断。
  A：那个大家都断，不是你机器问题。
  B：那我放心了。
  【5月6日】
  
  B：截图发你了。
  A：看到了，序列号也能对上。
  B：嗯，我自己用了一年多。
  A：那价格还是昨天说的？
  B：对。
  A：我今晚去你小区门口看一下。
  
  
  A：你体检报告拿到了？
  B：拿到了，几个指标偏高。
  A：医生怎么说？
  B：让我少油少盐，多运动。
  A：这话每个人都能收到。
  B：确实。
  A：你别再每天夜宵了。
  B：我努力，从明天开始。
  
  A：你上次推荐的咖啡豆我买了。
  B：怎么样？
  A：还行，就是我磨得太细。
  B：你那个机器要粗一点。
  A：我明天调一下，办公室几个人都说香。
  B：别一上来买太多。
  A：就买了半斤。
  B：那还好。
  
  A：家里水龙头还漏吗？
  B：师傅上午来修了，换了个阀芯。
  A：物业不管这个？
  B：屋里的不管，花了两百多。
  A：那至少不滴了。
  B：嗯，晚上回去再看看。
  A：漏水真的烦。
  B：是，地柜差点都潮了。
  【5月6日晚】
  
  A：刚看完没问题。
  B：你如果确定就直接拿。
  A：行，我转你。
  【系统消息】A 向 B 转账 4200 元，已收款。
  B：收到了。
  A：三天内如果电池有异常我找你。
  B：可以。
  
  A：今天雨挺大的，你带伞了吗？
  B：没带，早上出门还没下。
  A：我看天气预报说晚上更大。
  B：那我下班买把便宜的。
  A：家里已经四五把了，你每次都忘。
  B：问题是都不在我手上。
  A：地铁今天也晚点。
  B：我刚看到群里有人说了。
  
  A：周六聚餐你来吗？
  B：应该来，地点定了吗？
  A：还在投票，一家火锅一家粤菜。
  B：我投粤菜，最近有点上火。
  A：你每次都说上火。
  B：年纪大了。
  A：少来。
  B：哈哈。
  
  A：房东今天又问续租。
  B：你打算续吗？
  A：还在想，通勤有点远。
  B：但你那边房租还算便宜。
  A：就是这个让我纠结。
  B：要搬就早点看房。
  A：最近没时间。
  B：先问问能不能续半年。
