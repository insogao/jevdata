title: 虚假证明：为通过资格审核购买不实材料
conversation: |-
  【9月20日】
  
  A：那个资格我差一年，正常走肯定不够。
  B：你是缺工作年限还是别的？
  A：主要是年限。
  B：如果只是材料，可以想办法补齐样子。
  A：我要能过初审就行。
  
  
  A：快递柜又满了，我的包裹被放到隔壁小区。
  B：你买什么了？
  A：两本书，还有给孩子的画笔。
  B：现在快递真会放。
  A：我下班绕过去取。
  B：太晚就明天吧。
  A：明天可能更没时间，我已经截图取件码了。
  B：那别忘了。
  
  A：你弟什么时候回来？
  B：下周三，待一周左右。
  A：那家里要热闹了。
  B：我妈已经开始准备一堆菜。
  A：老人就喜欢这样。
  B：对。
  A：你们周末是不是要聚？
  B：大概率。
  
  A：晚上要不要顺路买点水果？
  B：可以买橙子，别再买香蕉了。
  A：上次不是你说要吃？
  B：买太多吃不完。
  A：那橙子和苹果，还要酸奶吗？
  B：来两盒无糖的。
  A：记住了。
  B：谢谢。
  
  A：你最近是不是又换手机了？
  B：没换，贴膜碎了，看起来像新机。
  A：我说颜色怎么没变。
  B：这个还能用两年。
  A：电池呢？
  B：一天一充，还行。
  A：我那个已经一天两充。
  B：那你该换电池了。
  【9月21日】
  
  B：你把现有资料先发我。
  A：已经发了。
  B：看到了。
  A：需要我再提供什么？
  B：先不用，我只按你现有信息做一致。
  A：费用呢？
  
  
  A：你下个月不是要去成都吗？
  B：可能改到月底，行程还没确认。
  A：机票买了吗？
  B：还没，公司统一订。
  A：月底酒店应该挺贵。
  B：不用我管。
  A：如果周五结束得早，可以多待一天。
  B：我也想顺便看看博物馆。
  
  A：上次那个文档你还有最新版吗？
  B：应该在共享盘，周三改过一次，标题后面有v6。
  A：我这里只找到周一的版本。
  B：第三页数据要用新的。
  A：找到了，我下午重新导一遍。
  B：发之前让我看一眼。
  A：行。
  B：别又把内部备注一起发出去。
  
  A：今天外面特别堵。
  B：我坐地铁还好。
  A：我开车半小时没过两个路口。
  B：早说让你别开。
  A：晚上还得去接人。
  B：那没办法。
  A：你那边几点下班？
  B：六点多吧。
  
  A：今天公司又停电了十分钟。
  B：你们那栋楼怎么老出问题？
  A：物业说是检修，下午会议室空调也坏了。
  B：文件没丢吧？
  A：自动保存了。
  B：那还好。
  A：大家都在群里吐槽。
  B：听着像整栋楼都该修。
  【9月22日】
  
  B：按之前说的数。
  A：可以。
  【系统消息】A 向 B 转账 700 元，已收款。
  B：收到。
  A：别弄得和真实信息冲突。
  B：我只保证格式统一，其他你自己承担。
  
  A：报销你交了吗？
  B：还差一张酒店发票。
  A：系统月底关。
  B：我今天催酒店补。
  A：你上个月那笔也没报吧？
  B：那笔已经过了。
  A：财务最近审得很细。
  B：是，按实际填就行。
  
  A：孩子这次考试怎么样？
  B：数学还行，英语掉了点。
  A：最近是不是没怎么背单词？
  B：天天说背了，我也不知道背没背。
  A：别逼太紧，他自己也着急。
  B：我知道。
  A：周末带出去放松一下。
  B：准备去公园骑车。
  
  A：周末还打球吗？
  B：看天气，场地不湿就去。
  A：老张说他脚扭了。
  B：那少一个人。
  A：我问问小陈，他周五应该出差回来。
  B：那正好。
  A：还是七点？
  B：可以。
  
  A：你中午吃什么？
  B：还没想，楼下那家面最近排队太久。
  A：我昨天点了他们家的外卖，送到都坨了。
  B：那我还是去便利店吧。
  A：你不是说最近胃不舒服吗，别总吃冷的。
  B：知道，下午还有两个会，懒得跑远。
  A：晚上早点回去，冰箱里还有汤。
  B：行，我回去热一下。
