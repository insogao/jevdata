  A：我说颜色怎么没变。
  B：这个还能用两年。
  A：电池呢？
  B：一天一充，还行。
  A：我那个已经一天两充。
  B：那你该换电池了。
  【11月11日】
  
  A：一家已经说好了。
  B：另一家呢？
  A：还在谈。
  B：我们正常按自己的成本报？
  A：你们按正常区间，另外两家留在后面。
  B：文件别做得太一致，不然太明显。
  
  
  A：晚上要不要顺路买点水果？
  B：可以买橙子，别再买香蕉了。
  A：上次不是你说要吃？
  B：买太多吃不完。
  A：那橙子和苹果，还要酸奶吗？
  B：来两盒无糖的。
  A：记住了。
  B：谢谢。
  
  A：今天公司又停电了十分钟。
  B：你们那栋楼怎么老出问题？
  A：物业说是检修，下午会议室空调也坏了。
  B：文件没丢吧？
  A：自动保存了。
  B：那还好。
  A：大家都在群里吐槽。
  B：听着像整栋楼都该修。
  【11月12日】
  
  A：另一家也点头了。
  B：那我让同事准备。
  A：这件事别在正式群说。
  B：知道。
  A：下周你来北京吗？
  B：可能周二。
  
  
  A：今天外面特别堵。
  B：我坐地铁还好。
  A：我开车半小时没过两个路口。
  B：早说让你别开。
  A：晚上还得去接人。
  B：那没办法。
  A：你那边几点下班？
  B：六点多吧。
  
  A：你中午吃什么？
  B：还没想，楼下那家面最近排队太久。
  A：我昨天点了他们家的外卖，送到都坨了。
  B：那我还是去便利店吧。
  A：你不是说最近胃不舒服吗，别总吃冷的。
  B：知道，下午还有两个会，懒得跑远。
  A：晚上早点回去，冰箱里还有汤。
  B：行，我回去热一下。
  【11月13日】
  
  B：报价初稿出来了。
  A：你只给我看大概区间就行。
  B：嗯。
  A：其他人的我来协调。
  B：好。
  
  A：周末还打球吗？
  B：看天气，场地不湿就去。
  A：老张说他脚扭了。
  B：那少一个人。
  A：我问问小陈，他周五应该出差回来。
  B：那正好。
  A：还是七点？
  B：可以。
  
  A：我把阳台那几盆花都换土了。
  B：你不是最怕弄泥？
  A：最近突然想养点东西。
  B：别再把多肉养死。
  A：这次看了教程。
  B：教程救不了浇水太勤。
  A：我控制。
  B：长好一点拍给我看。
