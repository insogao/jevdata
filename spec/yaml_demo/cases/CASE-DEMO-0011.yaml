conversation: |-
  【11月10日】
  
  A：招标文件看了吧？
  B：看了，条件跟之前差不多。
  A：这次还是你们主拿。
  B：另外两家呢？
  A：我去沟通，他们会配合。
  B：价格别挤太近。
  
  
  A：孩子这次考试怎么样？
  B：数学还行，英语掉了点。
  A：最近是不是没怎么背单词？
  B：天天说背了，我也不知道背没背。
  A：别逼太紧，他自己也着急。
  B：我知道。
  A：周末带出去放松一下。
  B：准备去公园骑车。
  
  A：你最近是不是又换手机了？
